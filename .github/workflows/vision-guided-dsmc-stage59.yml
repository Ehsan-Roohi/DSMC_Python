name: Vision-guided DSMC Stage 59

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage59_independent_reference_audit.py'
      - 'vision_guided_dsmc/tests/test_stage59_independent_reference_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage59.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage59_independent_reference_audit.py'
      - 'vision_guided_dsmc/tests/test_stage59_independent_reference_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage59.yml'

permissions:
  actions: read
  contents: read

jobs:
  independent-published-reference-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 59 and retained Stage 58 endpoint
        run: |
          pytest -q \
            tests/test_stage59_independent_reference_audit.py \
            tests/test_stage58_conservative_solver_64x64_confirmation.py
      - name: Download exact completed Stage 58 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage58-conservative-solver-64x64-confirmation
          path: /tmp/stage58_conservative_solver_64x64_confirmation
          run-id: 30864287564
          github-token: ${{ github.token }}
      - name: Run Stage 59 independent Shakhov/DSMC reference audit
        run: |
          python -m vgdsmc.stage59_independent_reference_audit \
            --stage58-artifact-dir /tmp/stage58_conservative_solver_64x64_confirmation \
            --output-dir /tmp/stage59_independent_reference_audit
      - name: Verify provenance, independent-reference result and guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/stage59_independent_reference_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 59
          retained = summary['retained_stage58_endpoint']
          assert retained['workflow_run_id'] == 30864287564
          assert retained['workflow_job_id'] == 91852659651
          assert retained['workflow_conclusion'] == 'success'
          assert retained['tests_passed'] == 72
          assert retained['tests_failed'] == 0
          assert retained['artifact_id'] == 8882191150
          assert retained['artifact_sha256'] == (
              'c1e1cb40d35439d44a93bae091f732f35e1790c2c4e3f1180b16d7f8fb54e8f6'
          )

          reference = summary['published_reference']
          assert reference['doi'] == '10.1063/1.4875235'
          assert reference['table6_qav'] == {'shakhov': 0.178, 'dsmc': 0.179}
          assert reference['table3_independent_dsmc_profile_available'] is False

          cfg = summary['configuration']
          assert cfg['solver_rerun'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          baseline = summary['baseline_clipped']['heat_flux_reference_review']
          conservative = summary['conservative_projection']['heat_flux_reference_review']
          assert baseline['minimum_relative_error'] > 0.25
          assert conservative['minimum_relative_error'] > 0.26
          assert baseline['gap_to_reference_spread'] > 45.0
          assert conservative['gap_to_reference_spread'] > 46.0

          paired = summary['paired_review']
          assert paired['independent_dsmc_heat_flux_confirms_large_discrepancy'] is True
          assert paired['heat_flux_error_worsens_against_best_published_reference'] is True
          assert paired['velocity_guard_failed'] is True
          assert paired['projection_not_adopted'] is True
          assert paired['independent_dsmc_velocity_profile_available'] is False
          assert summary['decision'] == (
              'stage59_independent_dsmc_heat_flux_confirms_discrepancy_'
              'projection_not_adopted_transport_wall_audit_next'
          )
          assert len(summary['positive_findings']) >= 3
          assert len(summary['negative_findings']) >= 3
          assert 'does not validate' in summary['interpretation_guard']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage59-independent-reference-audit
          path: /tmp/stage59_independent_reference_audit
          retention-days: 30

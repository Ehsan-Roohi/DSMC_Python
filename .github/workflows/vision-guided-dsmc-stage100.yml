name: Vision-guided DSMC Stage 100

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage100_fused_single_run_directional_audit.py'
      - 'vision_guided_dsmc/tests/test_stage100_fused_single_run_directional_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage100.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage100_fused_single_run_directional_audit.py'
      - 'vision_guided_dsmc/tests/test_stage100_fused_single_run_directional_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage100.yml'

permissions:
  actions: read
  contents: read

jobs:
  fused-single-run-directional-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'

      - name: Test Stage 100 and retained fixed-design guards
        run: |
          pytest -q \
            tests/test_stage100_fused_single_run_directional_audit.py \
            tests/test_stage99_replay_provenance_audit.py \
            tests/test_stage98_directional_operator_growth_audit.py \
            tests/test_stage97_muscl_correction_spatial_localization_audit.py \
            tests/test_stage96_muscl_correction_growth_audit.py \
            tests/test_stage90_single_condition_reconstruction_solver_ab_audit.py

      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}

      - name: Download exact completed Stage 99 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage99-replay-provenance-audit
          path: /tmp/stage99_replay_provenance_audit
          run-id: 31378863028
          github-token: ${{ github.token }}

      - name: Verify exact Stage 67 and Stage 99 payload provenance
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              '/tmp/stage67_frozen_full_distribution_residual_decomposition/summary.json':
                  'e04043a1913b2fa9ae57fe1561aa26c70627830d648e91204093c8f1fb57b3d1',
              '/tmp/stage67_frozen_full_distribution_residual_decomposition/converged_full_distributions.npz':
                  'd4002a2765137ba517abec2d0483a3e5adcf13f415c53259018556bd14d612d1',
              '/tmp/stage99_replay_provenance_audit/summary.json':
                  '392faa3b817e06bc463461106c690a9f4fa93b2421064d82b25fae8294f27e17',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY

      - name: Run Stage 100 fused single-run directional audit
        run: |
          python -m vgdsmc.stage100_fused_single_run_directional_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage99-artifact-dir /tmp/stage99_replay_provenance_audit \
            --output-dir /tmp/stage100_fused_single_run_directional_audit

      - name: Verify Stage 100 fixed design and negative-result guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage100_fused_single_run_directional_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 100
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['correction_floor'] == 0.05
          assert cfg['diagnostic_steps'] == 25
          assert cfg['decomposition_closure_tolerance'] == 1.0e-12
          assert cfg['same_run_parent_map_tolerance'] == 1.0e-12
          assert cfg['stage67_run_id'] == 30991124477
          assert cfg['stage99_run_id'] == 31378863028
          assert cfg['stage99_job_id'] == 93424248816
          assert cfg['stage99_artifact_id'] == 9062898563
          assert cfg['fused_single_run'] is True
          assert cfg['full_solver_endpoint_rerun'] is False
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          assert cfg['solver_endpoint_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          assert summary['stage99_authorization']['decision'] == (
              'stage99_cross_run_iterative_replay_drift_stage100_fused_single_run_directional_audit'
          )
          assert summary['stage99_authorization']['cross_run_final_replay_max_relative_l2'] > 1.0e-12
          assert 1 <= summary['executed_steps'] <= 25
          assert np.isfinite(summary['maximum_decomposition_closure_relative_l2'])
          assert np.isfinite(summary['maximum_same_run_parent_map_relative_l2'])

          allowed = {
              'stage100_nonfinite_fused_replay_blocker_without_retuning',
              'stage100_same_run_decomposition_or_parent_mismatch_blocker_without_retuning',
              'stage100_x_dominant_growing_operator_stage101_x_signed_lobe_localization_audit',
              'stage100_y_dominant_growing_operator_stage101_y_signed_lobe_localization_audit',
              'stage100_material_cross_axis_cancellation_stage101_signed_cancellation_localization_audit',
              'stage100_mixed_directional_growth_stage101_interior_velocity_sector_audit',
          }
          assert summary['decision'] in allowed
          if not summary['decision'].endswith('blocker_without_retuning'):
              assert summary['finite'] is True
              assert summary['executed_steps'] == 25
              assert summary['maximum_decomposition_closure_relative_l2'] <= 1.0e-12
              assert summary['maximum_same_run_parent_map_relative_l2'] <= 1.0e-12

          assert 'Stage 98 remains a negative cross-run replay result' in summary['negative_result_guard']
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'no cross-Knudsen MUSCL extension is permitted' in summary['negative_result_guard']

          with np.load(root / 'fused_directional_histories.npz') as data:
              n = summary['executed_steps']
              for distribution in ('phi', 'psi'):
                  for metric in (
                      'x_weighted_abs', 'y_weighted_abs', 'net_weighted_abs',
                      'x_directional_abs_share', 'y_directional_abs_share',
                      'weighted_abs_cancellation_ratio',
                      'decomposition_closure_relative_l2',
                      'same_run_parent_map_relative_l2',
                  ):
                      name = f'{distribution}_{metric}'
                      assert data[name].shape == (n,)
                      assert np.isfinite(data[name]).all()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: stage100-fused-single-run-directional-audit
          path: /tmp/stage100_fused_single_run_directional_audit
          retention-days: 30

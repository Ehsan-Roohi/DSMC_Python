name: Vision-guided DSMC Stage 20
on:
  push:
    paths:
      - 'vision_guided_dsmc/**'
      - '.github/workflows/vision-guided-dsmc-stage20.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/**'
      - '.github/workflows/vision-guided-dsmc-stage20.yml'
jobs:
  sampling-allocation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test sampling-allocation utilities
        run: pytest -q tests/test_sampling_allocation.py
      - name: Run Stage 20 fixed-trajectory matched-observation benchmark
        run: |
          vgdsmc-sampling-allocation \
            --output-dir /tmp/stage20_sampling \
            --nx 6 --ny 6 --ppc 20 \
            --warm-steps 40 --pilot-steps 20 \
            --evaluation-steps 60 --base-samples 20 \
            --nv 6 --dvm-max-steps 900 \
            --seeds 288 299 311 322 333 344 355 366 377 388
      - name: Verify Stage 20 endpoints and budgets
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          summary = json.load(open('/tmp/stage20_sampling/summary.json'))
          assert summary['stage'] == 20
          assert summary['configuration']['observations_per_estimator'] == 720
          assert summary['configuration']['seeds'] == [288,299,311,322,333,344,355,366,377,388]
          assert len(summary['rows']) == 60
          assert set(summary['policy_summaries']) == {'mild','strong'}
          for row in summary['rows']:
              assert row['uniform_observations'] == row['adaptive_observations'] == 720
              assert row['observation_ratio'] == 1.0
              assert math.isfinite(row['sampling_error_ratio'])
              assert math.isfinite(row['dvm_error_ratio'])
          for policy in summary['policy_summaries'].values():
              primary = policy['sampling_error']
              assert primary['run_count'] == 30
              assert primary['ci95_low'] <= primary['mean'] <= primary['ci95_high']
              assert isinstance(policy['primary_success'], bool)
          assert Path('/tmp/stage20_sampling/sampling_maps.npz').exists()
          PY

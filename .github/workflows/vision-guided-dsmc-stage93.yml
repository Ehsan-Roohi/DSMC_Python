name: Vision-guided DSMC Stage 93

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage93_first_order_axis_component_balance_audit.py'
      - 'vision_guided_dsmc/tests/test_stage93_first_order_axis_component_balance_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage93.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage93_first_order_axis_component_balance_audit.py'
      - 'vision_guided_dsmc/tests/test_stage93_first_order_axis_component_balance_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage93.yml'

permissions:
  actions: read
  contents: read

jobs:
  first-order-axis-component-balance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 93 and retained Stage 92 guards
        run: |
          pytest -q \
            tests/test_stage93_first_order_axis_component_balance_audit.py \
            tests/test_stage92_candidate_update_localization_audit.py \
            tests/test_stage91_fixed_parameter_nonconvergence_onset_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 92 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage92-candidate-update-localization-audit
          path: /tmp/stage92_candidate_update_localization_audit
          run-id: 31301735307
          github-token: ${{ github.token }}
      - name: Run Stage 93 first-order axis-component balance audit
        run: |
          python -m vgdsmc.stage93_first_order_axis_component_balance_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage92-artifact-dir /tmp/stage92_candidate_update_localization_audit \
            --output-dir /tmp/stage93_first_order_axis_component_balance_audit
      - name: Verify fixed design, component closure, and negative-result guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage93_first_order_axis_component_balance_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 93
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['onset_step'] == 1
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          assert cfg['solver_endpoint_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          context = summary['stage92_context']
          assert context['phi_ab_floor_mask_jaccard'] >= 0.99
          assert context['psi_ab_floor_mask_jaccard'] >= 0.99
          for key in (
              'phi_baseline_correction_induced_fraction_of_activations',
              'psi_baseline_correction_induced_fraction_of_activations',
              'phi_one_sided_correction_induced_fraction_of_activations',
              'psi_one_sided_correction_induced_fraction_of_activations',
          ):
              assert 0.0 <= context[key] < 0.01

          for distribution in ('phi', 'psi'):
              result = summary[distribution]
              assert result['finite'] is True
              assert 0.0 <= result['floor_activation_fraction_by_count'] <= 1.0
              assert 0.0 <= result['floor_activation_fraction_by_quadrature_weight'] <= 1.0
              assert 0.0 <= result['strict_negative_fraction'] <= 1.0
              assert 0.0 <= result['exact_zero_fraction_of_activations'] <= 1.0
              assert 0.0 <= result['all_components_exact_zero_fraction_of_activations'] <= 1.0
              assert 0.0 <= result['masked_quadrature_value_fraction_of_global_first_order'] <= 1.0
              assert result['component_sum_closure_relative_l2'] <= 1.0e-14
              for value in result['positive_reduced_moment_fractions_from_floor_set'].values():
                  assert 0.0 <= value <= 1.0 + 1.0e-12
              for component in ('source', 'x_transport', 'y_transport'):
                  stats = result['component_statistics'][component]
                  assert np.isfinite(stats['minimum'])
                  assert np.isfinite(stats['maximum'])
                  assert 0.0 <= stats['exact_zero_fraction_of_activations'] <= 1.0
                  assert 0.0 <= stats['masked_value_fraction_of_global_first_order'] <= 1.0 + 1.0e-12

          allowed = {
              'stage93_nonfinite_first_order_component_blocker_without_retuning',
              'stage93_axis_component_balance_complete_stage94_floor_moment_perturbation_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 90 remains nonconverged in both reconstruction arms' in summary['negative_result_guard']

          with np.load(root / 'first_order_axis_component_maps.npz') as maps:
              expected = {
                  'phi_cell_floor_fraction': (64, 64),
                  'psi_cell_floor_fraction': (64, 64),
                  'phi_velocity_floor_fraction': (3840,),
                  'psi_velocity_floor_fraction': (3840,),
              }
              for key, shape in expected.items():
                  assert key in maps
                  assert maps[key].shape == shape
                  assert np.isfinite(maps[key]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage93-first-order-axis-component-balance-audit
          path: /tmp/stage93_first_order_axis_component_balance_audit
          retention-days: 30

name: Vision-guided DSMC Stage 91

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage91_fixed_parameter_nonconvergence_onset_audit.py'
      - 'vision_guided_dsmc/tests/test_stage91_fixed_parameter_nonconvergence_onset_audit.py'
      - 'vision_guided_dsmc/results/stage90_nonconverged_solver_ab_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage91.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage91_fixed_parameter_nonconvergence_onset_audit.py'
      - 'vision_guided_dsmc/tests/test_stage91_fixed_parameter_nonconvergence_onset_audit.py'
      - 'vision_guided_dsmc/results/stage90_nonconverged_solver_ab_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage91.yml'

permissions:
  actions: read
  contents: read

jobs:
  fixed-parameter-nonconvergence-onset-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 91 and retained Stage 90 guards
        run: |
          pytest -q \
            tests/test_stage91_fixed_parameter_nonconvergence_onset_audit.py \
            tests/test_stage90_single_condition_reconstruction_solver_ab_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Run Stage 91 fixed-parameter onset audit
        run: |
          python -m vgdsmc.stage91_fixed_parameter_nonconvergence_onset_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --output-dir /tmp/stage91_fixed_parameter_nonconvergence_onset_audit
      - name: Verify fixed design and negative-result guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage91_fixed_parameter_nonconvergence_onset_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 91
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['diagnostic_steps'] == 25
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          for arm_name in ('zero_boundary_slope', 'one_sided_boundary_slope'):
              arm = summary[arm_name]
              assert isinstance(arm['finite'], bool)
              assert 1 <= arm['executed_steps'] <= 25
              assert arm['maximum_phi_floor_fraction'] >= 0.0
              assert arm['maximum_psi_floor_fraction'] >= 0.0
              assert arm['first_phi_floor_activation_step'] is None or 1 <= arm['first_phi_floor_activation_step'] <= 25
              assert arm['first_psi_floor_activation_step'] is None or 1 <= arm['first_psi_floor_activation_step'] <= 25
              if arm['finite']:
                  assert np.isfinite(arm['minimum_candidate_phi'])
                  assert np.isfinite(arm['minimum_candidate_psi'])
                  assert np.isfinite(arm['first_step_macro_change'])
                  assert np.isfinite(arm['final_step_macro_change'])

          allowed = {
              'stage91_nonfinite_onset_blocker_without_retuning',
              'stage91_both_arms_activate_positivity_floor_within_fixed_onset_window_stage92_candidate_update_localization_audit',
              'stage91_boundary_specific_floor_onset_signal_stage92_candidate_update_localization_audit',
              'stage91_baseline_floor_onset_precedes_boundary_counterfactual_interpretation_stage92_candidate_update_localization_audit',
              'stage91_no_floor_onset_within_fixed_window_blocker_without_retuning',
          }
          assert summary['decision'] in allowed
          assert 'Stage 90 remains nonconverged in both arms' in summary['negative_result_guard']
          with np.load(root / 'onset_histories.npz') as history:
              for prefix in ('baseline', 'one_sided'):
                  for suffix in ('macro_change', 'phi_floor_fraction', 'psi_floor_fraction', 'minimum_candidate_phi', 'minimum_candidate_psi'):
                      key = f'{prefix}_{suffix}'
                      assert key in history
                      assert 1 <= history[key].size <= 25
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage91-fixed-parameter-nonconvergence-onset-audit
          path: /tmp/stage91_fixed_parameter_nonconvergence_onset_audit
          retention-days: 30

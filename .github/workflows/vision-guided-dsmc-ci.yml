name: Vision-guided DSMC CI
on:
  push:
    paths:
      - 'vision_guided_dsmc/**'
      - '.github/workflows/vision-guided-dsmc-ci.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/**'
      - '.github/workflows/vision-guided-dsmc-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[full]'
      - run: pytest -q
      - run: vgdsmc-generate --output /tmp/pilot --nx 6 --ny 6 --ppc 3 --reference-ppc 6 --steps 10 --sample-start 4
      - name: Build deterministic-reference fixture
        run: |
          python - <<'PY'
          import numpy as np
          with np.load('/tmp/pilot/case.npz') as data:
              np.savez_compressed(
                  '/tmp/reference.npz',
                  T=data['reference_T'],
                  rho=data['reference_rho'],
                  u=data['reference_u'],
                  v=data['reference_v'],
              )
          PY
      - run: vgdsmc-reference-case --coarse-case /tmp/pilot/case.npz --reference /tmp/reference.npz --output /tmp/supervised.npz
      - name: Verify supervised artifact
        run: |
          python - <<'PY'
          import numpy as np
          with np.load('/tmp/supervised.npz') as data:
              assert data['x'].shape == (4, 6, 6)
              assert data['score'].shape == (6, 6)
              assert set(np.unique(data['label'])) == {0, 1, 2}
          PY

name: Vision-guided DSMC Stage 137

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage137_right_lobe_decay_shape_audit.py'
      - 'vision_guided_dsmc/tests/test_stage137_right_lobe_decay_shape_audit.py'
      - 'vision_guided_dsmc/results/stage136_right_lobe_depth_support_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage137.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage137_right_lobe_decay_shape_audit.py'
      - 'vision_guided_dsmc/tests/test_stage137_right_lobe_decay_shape_audit.py'
      - 'vision_guided_dsmc/results/stage136_right_lobe_depth_support_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage137.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  right-lobe-decay-shape-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 136-137 fixed-design guards
        run: |
          pytest -q \
            tests/test_stage136_right_lobe_depth_support_audit.py \
            tests/test_stage137_right_lobe_decay_shape_audit.py
      - name: Download exact completed Stage 136 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage136-right-lobe-depth-support-audit
          path: /tmp/stage136_right_lobe_depth_support_audit
          run-id: 32140741740
          github-token: ${{ github.token }}
      - name: Verify exact Stage 136 payload digests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage136_right_lobe_depth_support_audit/summary.json': 'eaf3706b2c7bca1678b0680dcf06daa076ccd36eeb91dccb9b8602bd8378b64c',
              '/tmp/stage136_right_lobe_depth_support_audit/right_lobe_depth_support.npz': 'f8829d07450f3832dc45a878943ac69415390e89208f9bb859e838fa9c160015',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 137 fixed right-lobe decay-shape audit
        run: |
          python -m vgdsmc.stage137_right_lobe_decay_shape_audit \
            --stage136-dir /tmp/stage136_right_lobe_depth_support_audit \
            --stage136-record results/stage136_right_lobe_depth_support_audit_observed.json \
            --output-dir /tmp/stage137_right_lobe_decay_shape_audit
      - name: Verify Stage 137 scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage137_right_lobe_decay_shape_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 137
          assert summary['finite'] is True
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['interior_grid'] == [56, 56]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['correction_floor'] == 0.05
          assert cfg['witness_node'] == 9
          assert cfg['pair_sectors'] == [5, 6]
          assert cfg['dominant_mirrored_sector'] == 6
          assert cfg['log_linear_r2_min'] == 0.90
          assert cfg['relative_l2_residual_max'] == 0.10
          assert cfg['monotone_step_fraction_min'] == 5.0 / 6.0
          assert cfg['common_rate_relative_difference_max'] == 0.25
          assert cfg['diagnostic_decay_fit_used_for_solver'] is False
          assert cfg['phase_shift_applied'] is False
          assert cfg['width_refit_applied'] is False
          assert cfg['amplitude_refit_applied'] is False
          assert cfg['solver_rerun'] is False
          assert cfg['solver_endpoint_advanced'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['benchmark_or_validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          assert summary['aggregate']['maximum_parent_profile_closure'] <= 1.0e-12
          assert summary['aggregate']['parent_record_ok'] is True
          allowed = {
              'stage137_smooth_common_decay_rate_stage138_common_decay_scale_audit',
              'stage137_smooth_channel_rate_split_stage138_channel_rate_origin_audit',
              'stage137_resolved_decay_structure_stage138_curvature_localization_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'Stage 90 remains nonconverged' in summary['negative_result_guard']
          assert 'diagnostic fits only' in summary['negative_result_guard']
          with np.load(root / 'right_lobe_decay_shape.npz') as data:
              assert data['right_depth'].shape == (7,)
              for key in (
                  'dominant_magnitude', 'parent_magnitude',
                  'dominant_normalized_magnitude', 'parent_normalized_magnitude',
                  'dominant_log_linear_fit', 'parent_log_linear_fit',
                  'common_geometric_profile', 'common_log_linear_fit',
              ):
                  assert data[key].shape == (7,)
              for key in data.files:
                  assert np.isfinite(data[key]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage137-right-lobe-decay-shape-audit
          path: /tmp/stage137_right_lobe_decay_shape_audit
          retention-days: 30

# Explicit Stage 137 launch touch; no scientific guard or numerical parameter changed.

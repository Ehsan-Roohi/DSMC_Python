name: Vision-guided DSMC Stage 75

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage75_signed_face_location_velocity_moment_audit.py'
      - 'vision_guided_dsmc/tests/test_stage75_signed_face_location_velocity_moment_audit.py'
      - 'vision_guided_dsmc/results/stage74_radial_speed_shell_opposite_sector_cancellation_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage75.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage75_signed_face_location_velocity_moment_audit.py'
      - 'vision_guided_dsmc/tests/test_stage75_signed_face_location_velocity_moment_audit.py'
      - 'vision_guided_dsmc/results/stage74_radial_speed_shell_opposite_sector_cancellation_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage75.yml'

permissions:
  actions: read
  contents: read

jobs:
  signed-face-location-velocity-moment-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 75 and retained audit endpoints
        run: |
          pytest -q \
            tests/test_stage75_signed_face_location_velocity_moment_audit.py \
            tests/test_stage74_radial_speed_shell_opposite_sector_cancellation_audit.py \
            tests/test_stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit.py \
            tests/test_stage72_directional_transport_component_audit.py \
            tests/test_stage71_wall_layer_interior_face_transport_attribution_audit.py \
            tests/test_stage70_independent_wall_face_flux_discretization_audit.py \
            tests/test_stage69_frozen_grid_transfer_residual_scaling_audit.py \
            tests/test_stage68_independent_transport_operator_residual_audit.py \
            tests/test_stage67_frozen_full_distribution_residual_decomposition.py \
            tests/test_stage66_frozen_collision_source_observable_audit.py \
            tests/test_stage65_local_clipping_activation_map_audit.py \
            tests/test_stage64_source_step_consistency_audit.py \
            tests/test_stage63_collision_target_equivalence_audit.py \
            tests/test_stage62_finite_kn_normalization_audit.py \
            tests/test_stage60_transport_wall_equation_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 74 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage74-radial-speed-shell-opposite-sector-cancellation-audit
          path: /tmp/stage74_radial_speed_shell_opposite_sector_cancellation_audit
          run-id: 31099020204
          github-token: ${{ github.token }}
      - name: Run Stage 75 signed face-location and velocity-moment audit
        run: |
          python -m vgdsmc.stage75_signed_face_location_velocity_moment_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage74-artifact-dir /tmp/stage74_radial_speed_shell_opposite_sector_cancellation_audit \
            --output-dir /tmp/stage75_signed_face_location_velocity_moment_audit
      - name: Verify exact moment closure, provenance, and scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage75_signed_face_location_velocity_moment_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 75
          assert summary['finite'] is True
          assert summary['provenance_consistent'] is True
          assert summary['moment_closure_closed'] is True
          assert not summary['decision'].endswith('blocker')

          endpoint74 = summary['retained_stage74_endpoint']
          assert endpoint74['workflow_run_id'] == 31099020204
          assert endpoint74['workflow_job_id'] == 92607816279
          assert endpoint74['artifact_id'] == 8973240674
          assert endpoint74['tests_passed'] == 178
          assert endpoint74['tests_failed'] == 0

          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['solver_rerun_count'] == 0
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          metrics = summary['fine_grid_face_location_velocity_moment_metrics']
          assert abs(sum(metrics['moment_absolute_shares']) - 1.0) < 1e-12
          assert abs(sum(metrics['x_zone_absolute_shares']) - 1.0) < 1e-12
          assert abs(sum(metrics['y_band_absolute_shares']) - 1.0) < 1e-12
          assert metrics['face_pair_cancellation_ratio'] <= cfg['face_pair_cancellation_guard']
          assert metrics['left_right_signed_balance_error'] <= 1e-9

          with np.load(root / 'signed_face_location_velocity_moment_maps.npz') as maps:
              cell = maps['moment_cell_maps']
              left = maps['face_left_target_moment_maps']
              right = maps['face_right_target_moment_maps']
              reconstructed = maps['reconstructed_total_cell_map']
              reference = maps['stage74_reference_total_cell_map']
              assert cell.shape == (3, 64, 64)
              assert left.shape == right.shape == (3, 64, 63)
              assert np.all(np.isfinite(cell))
              assert np.allclose(np.sum(cell, axis=0), reconstructed)
              relative = np.linalg.norm((reconstructed-reference).ravel()) / np.linalg.norm(reference.ravel())
              assert relative <= 1e-10

          assert 'not a sensitivity measure' in summary['negative_findings'][0]
          assert 'failed Stage-28 MUSCL' in summary['negative_findings'][1]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage75-signed-face-location-velocity-moment-audit
          path: /tmp/stage75_signed_face_location_velocity_moment_audit
          retention-days: 30

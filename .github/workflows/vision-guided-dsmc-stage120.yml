name: Vision-guided DSMC Stage 120
on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage120_*'
      - 'vision_guided_dsmc/tests/test_stage120_*'
      - '.github/workflows/vision-guided-dsmc-stage120.yml'
permissions:
  contents: read
  actions: read
jobs:
  kernel-residual-velocity-cell-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_stage120_kernel_residual_velocity_cell_audit.py
      - uses: actions/download-artifact@v8
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67
          github-token: ${{ github.token }}
          run-id: 30991124477
      - uses: actions/download-artifact@v8
        with:
          name: stage111-axis-conditioned-asymmetry-audit
          path: /tmp/stage111
          github-token: ${{ github.token }}
          run-id: 31590035358
      - uses: actions/download-artifact@v8
        with:
          name: stage119-exact-directional-moment-kernel-audit
          path: /tmp/stage119
          github-token: ${{ github.token }}
          run-id: 31807927456
      - run: >-
          python -m vgdsmc.stage120_kernel_residual_velocity_cell_audit
          --stage67-dir /tmp/stage67
          --stage111-dir /tmp/stage111
          --stage119-dir /tmp/stage119
          --stage119-record results/stage119_exact_directional_moment_kernel_audit_observed.json
          --output-dir /tmp/stage120
      - uses: actions/upload-artifact@v7
        with:
          name: stage120-kernel-residual-velocity-cell-audit
          path: /tmp/stage120
          retention-days: 30

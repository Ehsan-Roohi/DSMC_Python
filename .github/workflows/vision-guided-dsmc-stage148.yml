name: Vision-guided DSMC Stage 148

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage148_sample_scale_curvature_alternation_audit.py'
      - 'vision_guided_dsmc/tests/test_stage148_sample_scale_curvature_alternation_audit.py'
      - 'vision_guided_dsmc/results/stage147_dual_channel_neighborhood_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage148.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage148_sample_scale_curvature_alternation_audit.py'
      - 'vision_guided_dsmc/tests/test_stage148_sample_scale_curvature_alternation_audit.py'
      - 'vision_guided_dsmc/results/stage147_dual_channel_neighborhood_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage148.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  sample-scale-curvature-alternation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 144-148 fixed-design guards
        run: |
          pytest -q \
            tests/test_stage144_positive_lobe_shape_audit.py \
            tests/test_stage145_trough_persistence_audit.py \
            tests/test_stage146_trough_provenance_audit.py \
            tests/test_stage147_dual_channel_neighborhood_audit.py \
            tests/test_stage148_sample_scale_curvature_alternation_audit.py
      - name: Download exact completed Stage 147 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage147-dual-channel-neighborhood-audit
          path: /tmp/stage147_dual_channel_neighborhood_audit
          run-id: 32358081943
          github-token: ${{ github.token }}
      - name: Verify exact Stage 147 parent payload digests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage147_dual_channel_neighborhood_audit/summary.json': 'bf8fa6cc06e510fa2f4fbd76726db8e03faf5237bc95cc897fbfa7d42cf0ba5b',
              '/tmp/stage147_dual_channel_neighborhood_audit/dual_channel_neighborhood.npz': 'a77b8bc80a291fe9e440d30f7c09e768964e86b9e873a9ab9890074caf8d6c2d',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 148 fixed sample-scale curvature-alternation audit
        run: |
          python -m vgdsmc.stage148_sample_scale_curvature_alternation_audit \
            --stage147-dir /tmp/stage147_dual_channel_neighborhood_audit \
            --stage147-record results/stage147_dual_channel_neighborhood_audit_observed.json \
            --output-dir /tmp/stage148_sample_scale_curvature_alternation_audit
      - name: Verify Stage 148 scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage148_sample_scale_curvature_alternation_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 148
          assert summary['finite'] is True
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['interior_grid'] == [56, 56]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['correction_floor'] == 0.05
          assert cfg['witness_node'] == 9
          assert cfg['pair_sectors'] == [5, 6]
          assert cfg['dominant_mirrored_sector'] == 6
          assert cfg['alternating_energy_share_min'] == 0.75
          assert cfg['coarse_center_retention_max'] == 0.5
          assert cfg['curvature_scale_used_for_solver'] is False
          assert cfg['solver_rerun'] is False
          assert cfg['solver_endpoint_advanced'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['benchmark_or_validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          agg = summary['aggregate']
          assert agg['stage147_record_ok'] is True
          assert agg['parent_route_ok'] is True
          assert agg['inherited_curvature_match_error'] <= 1.0e-12
          assert agg['maximum_identity_or_provenance_error'] <= 1.0e-12
          allowed = {
              'stage148_sample_scale_alternation_dominant_stage149_channel_scale_separation_audit',
              'stage148_multiscale_alternation_persists_stage149_extended_scale_audit',
              'stage148_weak_alternating_mode_stage149_shape_residual_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'Stage 90 remains nonconverged' in summary['negative_result_guard']
          assert 'diagnostics, not solver parameters' in summary['negative_result_guard']
          with np.load(root / 'sample_scale_curvature.npz') as data:
              assert data['fine_depth'].shape == (3,)
              assert data['fine_dominant_curvature'].shape == (3,)
              assert data['fine_parent_curvature'].shape == (3,)
              assert data['fine_complement_deficit'].shape == (3,)
              assert data['dominant_alternating_fit'].shape == (3,)
              assert data['parent_alternating_fit'].shape == (3,)
              assert data['complement_alternating_fit'].shape == (3,)
              assert data['coarse_center_components'].shape == (3,)
              assert data['coarse_to_fine_retention'].shape == (3,)
              assert np.isfinite(data['coarse_to_fine_retention']).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage148-sample-scale-curvature-alternation-audit
          path: /tmp/stage148_sample_scale_curvature_alternation_audit
          retention-days: 30

name: Vision-guided DSMC Stage 104

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage104_interior_gradient_scale_audit.py'
      - 'vision_guided_dsmc/tests/test_stage104_interior_gradient_scale_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage104.yml'

permissions:
  actions: read
  contents: read

jobs:
  interior-gradient-scale-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 104 and retained fixed-design guards
        run: |
          pytest -q \
            tests/test_stage104_interior_gradient_scale_audit.py \
            tests/test_stage103_shell1_spatial_localization_audit.py \
            tests/test_stage102_radial_speed_shell_audit.py \
            tests/test_stage101_interior_velocity_sector_audit.py \
            tests/test_stage100_fused_single_run_directional_audit.py \
            tests/test_stage99_replay_provenance_audit.py \
            tests/test_stage98_directional_operator_growth_audit.py \
            tests/test_stage97_muscl_correction_spatial_localization_audit.py \
            tests/test_stage96_muscl_correction_growth_audit.py \
            tests/test_stage90_single_condition_reconstruction_solver_ab_audit.py
      - name: Download exact completed Stage 103 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage103-shell1-spatial-localization-audit
          path: /tmp/stage103_shell1_spatial_localization_audit
          run-id: 31445957648
          github-token: ${{ github.token }}
      - name: Verify exact Stage 103 payload provenance
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage103_shell1_spatial_localization_audit/summary.json': 'a19d325d7b72938da7673b9a66b2669623840d0e00cfbbe7696da885608eb914',
              '/tmp/stage103_shell1_spatial_localization_audit/shell1_spatial_localization_histories.npz': 'a13c1130f92613ad97b60beafb1899269409e6dae6b51991a61633f6ec6c0867',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 104 interior gradient-scale audit
        run: |
          python -m vgdsmc.stage104_interior_gradient_scale_audit \
            --stage103-artifact-dir /tmp/stage103_shell1_spatial_localization_audit \
            --output-dir /tmp/stage104_interior_gradient_scale_audit
      - name: Verify Stage 104 fixed design and negative-result guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage104_interior_gradient_scale_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 104
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['correction_floor'] == 0.05
          assert cfg['diagnostic_steps'] == 25
          assert cfg['wall_band_cells'] == 4
          assert cfg['dominant_radial_shell'] == 1
          assert cfg['lags_cells'] == [1, 2, 4, 7, 14]
          assert cfg['grid_scale_guard_cells'] == 2.0
          assert cfg['mesoscale_upper_guard_cells'] == 7.0
          assert cfg['parent_closure_tolerance'] == 1.0e-12
          assert cfg['stage103_run_id'] == 31445957648
          assert cfg['stage103_job_id'] == 93640121182
          assert cfg['stage103_artifact_id'] == 9085375562
          assert cfg['full_solver_endpoint_rerun'] is False
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['one_sided_boundary_slope_promoted'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          assert cfg['solver_endpoint_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          assert summary['stage103_authorization']['decision'] == 'stage103_spatially_diffuse_shell1_growth_stage104_interior_gradient_scale_audit'
          assert summary['stage103_authorization']['maximum_stage102_shell_history_closure_relative'] <= 1.0e-12
          assert summary['finite'] is True
          allowed = {
              'stage104_nonfinite_gradient_metric_blocker_without_retuning',
              'stage104_stage103_parent_closure_blocker_without_retuning',
              'stage104_grid_scale_shell1_gradient_stage105_limiter_activation_audit',
              'stage104_mesoscale_shell1_gradient_stage105_directional_gradient_alignment_audit',
              'stage104_broad_scale_shell1_gradient_stage105_macroscopic_gradient_coupling_audit',
          }
          assert summary['decision'] in allowed
          assert summary['decision'] == 'stage104_mesoscale_shell1_gradient_stage105_directional_gradient_alignment_audit'
          for distribution in ('phi', 'psi'):
              metrics = summary['metrics'][distribution]
              assert np.isfinite(metrics['characteristic_gradient_length_cells'])
              assert metrics['characteristic_gradient_length_cells'] > 2.0
              assert metrics['characteristic_gradient_length_cells'] <= 7.0
              assert metrics['positive_growth_magnitude_share'] == 1.0
              assert set(metrics['lag_increment_ratio']) == {'1', '2', '4', '7', '14'}
          assert 'Stage 99 remains a negative cross-run reproducibility result' in summary['negative_result_guard']
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'no cross-Knudsen MUSCL extension is permitted' in summary['negative_result_guard']
          with np.load(root / 'interior_gradient_scale_maps.npz') as data:
              assert data['phi_growth_map'].shape == (56, 56)
              assert data['psi_growth_map'].shape == (56, 56)
              assert np.isfinite(data['phi_growth_map']).all()
              assert np.isfinite(data['psi_growth_map']).all()
              assert int(np.sum(data['interior_mask'])) == 56 * 56
              assert data['lags_cells'].tolist() == [1, 2, 4, 7, 14]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage104-interior-gradient-scale-audit
          path: /tmp/stage104_interior_gradient_scale_audit
          retention-days: 30

name: Vision-guided DSMC Stage 43

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage43_projected_polar_resolution_sequence.py'
      - 'vision_guided_dsmc/tests/test_stage43_projected_polar_resolution_sequence.py'
      - 'vision_guided_dsmc/results/stage42_projected_polar_heated_cavity_pilot_summary.json'
      - '.github/workflows/vision-guided-dsmc-stage43.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage43_projected_polar_resolution_sequence.py'
      - 'vision_guided_dsmc/tests/test_stage43_projected_polar_resolution_sequence.py'
      - 'vision_guided_dsmc/results/stage42_projected_polar_heated_cavity_pilot_summary.json'
      - '.github/workflows/vision-guided-dsmc-stage43.yml'

jobs:
  projected-polar-resolution-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 43 and retained benchmark infrastructure
        run: |
          pytest -q \
            tests/test_stage43_projected_polar_resolution_sequence.py \
            tests/test_stage42_projected_polar_heated_cavity_pilot.py \
            tests/test_stage40_external_benchmark_fidelity_audit.py \
            tests/test_stage39_collision_model_benchmark_audit.py \
            tests/test_stage38_transport_collision_interaction_audit.py \
            tests/test_reduced_spherical_solver.py
      - name: Run frozen Stage 43 spatial-resolution sequence
        run: |
          python -m vgdsmc.stage43_projected_polar_resolution_sequence \
            --output-dir /tmp/stage43_projected_polar_resolution_sequence
      - name: Verify provenance, frozen design and retained outcomes
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage43_projected_polar_resolution_sequence')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 43

          retained = summary['retained_stage42_endpoint']
          assert retained['workflow_run_id'] == 30731231176
          assert retained['workflow_job_id'] == 91451917655
          assert retained['artifact_id'] == 8828768222
          assert retained['artifact_sha256'] == (
              '4d9181f5e01407ebb15da0b3a52539d3e536a62e6b38271b905cc5d1be646552'
          )
          assert retained['regression_tests_passed'] == 44
          assert retained['regression_tests_failed'] == 0

          reproduction = summary['stage42_reproduction']
          assert reproduction['passed'] is True
          for key, value in reproduction.items():
              if key != 'passed':
                  assert math.isfinite(value)
                  assert value <= 1e-12

          cfg = summary['configuration']
          assert cfg['kn0'] == 0.1
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['grids'] == [[8, 8], [12, 12], [16, 16]]
          assert cfg['polar_rule'] == {
              'radial_nodes': 32,
              'angular_nodes': 96,
              'point_count': 3072,
          }
          assert cfg['prandtl'] == 2.0 / 3.0
          assert cfg['shakhov_correction_floor'] == 0.05
          assert cfg['transport_iteration'] == 'steady_first_order_upwind_jacobi'
          assert cfg['collision'] == 'projected_shakhov'
          assert cfg['relaxation_mapping'] == (
              'sqrt(2)*Kn0/sqrt(pi) in c0 coordinates'
          )
          assert cfg['source_relaxation'] == 1.0
          assert cfg['max_iterations'] == 3000
          assert cfg['minimum_iterations'] == 500
          assert cfg['check_interval'] == 25
          assert cfg['tolerance'] == 2e-5
          assert cfg['physical_parameter_retuning'] is False
          assert cfg['velocity_quadrature_retuning'] is False
          assert cfg['source_resolution_reproduction'] is False

          assert len(summary['cases']) == 3
          for case, grid in zip(summary['cases'], cfg['grids']):
              assert case['grid'] == grid
              assert case['finite'] is True
              assert case['minimum_phi'] > 0.0
              assert case['minimum_psi'] > 0.0
              assert case['wall_mass_balance_relative_error'] < 1e-10
              assert 1 <= case['iterations'] <= 3000
              for key in (
                  'final_change', 'predicted_qav', 'literature_qav',
                  'qav_relative_error', 'wall_mass_balance_relative_error',
                  'minimum_phi', 'minimum_psi',
                  'maximum_phi_clipped_weight_fraction',
                  'maximum_psi_clipped_weight_fraction', 'work_proxy',
              ):
                  assert math.isfinite(case[key])
              for value in case['velocity_metrics'].values():
                  assert math.isfinite(value)
              assert np.isfinite(case['table_velocity']).all()

          assert summary['decision'] in {
              'projected_polar_spatial_sequence_converging_stage44_cross_kn_extension',
              'projected_polar_spatial_improvement_not_converged_stage44_finer_grid',
              'projected_polar_heat_flux_improves_velocity_discrepancy_stage44_wall_observable_audit',
              'projected_polar_velocity_improves_heat_flux_discrepancy_stage44_heat_flux_definition_audit',
              'projected_polar_nonmonotonic_stage44_space_velocity_coupling_audit',
              'stage42_reproduction_blocker',
              'stage43_resolution_blocker',
          }

          arrays = np.load(root / 'fields_and_profiles.npz')
          for key in arrays.files:
              assert np.isfinite(arrays[key]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage43-projected-polar-resolution-sequence
          path: /tmp/stage43_projected_polar_resolution_sequence
          retention-days: 30

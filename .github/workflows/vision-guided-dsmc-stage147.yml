name: Vision-guided DSMC Stage 147

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage147_dual_channel_neighborhood_audit.py'
      - 'vision_guided_dsmc/tests/test_stage147_dual_channel_neighborhood_audit.py'
      - 'vision_guided_dsmc/results/stage146_trough_provenance_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage147.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage147_dual_channel_neighborhood_audit.py'
      - 'vision_guided_dsmc/tests/test_stage147_dual_channel_neighborhood_audit.py'
      - 'vision_guided_dsmc/results/stage146_trough_provenance_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage147.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  dual-channel-neighborhood-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 143-147 fixed-design guards
        run: |
          pytest -q \
            tests/test_stage143_positive_lobe_scale_audit.py \
            tests/test_stage144_positive_lobe_shape_audit.py \
            tests/test_stage145_trough_persistence_audit.py \
            tests/test_stage146_trough_provenance_audit.py \
            tests/test_stage147_dual_channel_neighborhood_audit.py
      - name: Download exact completed Stage 146 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage146-trough-provenance-audit
          path: /tmp/stage146_trough_provenance_audit
          run-id: 32334751969
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 138 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage138-channel-rate-origin-audit
          path: /tmp/stage138_channel_rate_origin_audit
          run-id: 32176056342
          github-token: ${{ github.token }}
      - name: Verify exact parent payload digests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage146_trough_provenance_audit/summary.json': '7d3046422d4b7f44089e5089f9c4416dd1b876fded67334376a27d45af20052a',
              '/tmp/stage146_trough_provenance_audit/trough_provenance.npz': 'c33bdfea137093ca370e9307658b9aaf0deca33d7811a011ed4911563e4ec63d',
              '/tmp/stage138_channel_rate_origin_audit/summary.json': '61a10326c2dce8e5a47dd57333ea9acd5776f0b531dcce48204129a330860c3f',
              '/tmp/stage138_channel_rate_origin_audit/channel_rate_origin.npz': '44ddc0cc8bd3c1bc18c4cb60b953c985bdcb93ebe0c3446b5216a8cf000e03c8',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 147 fixed dual-channel neighborhood audit
        run: |
          python -m vgdsmc.stage147_dual_channel_neighborhood_audit \
            --stage146-dir /tmp/stage146_trough_provenance_audit \
            --stage146-record results/stage146_trough_provenance_audit_observed.json \
            --stage138-dir /tmp/stage138_channel_rate_origin_audit \
            --stage138-record results/stage138_channel_rate_origin_audit_observed.json \
            --output-dir /tmp/stage147_dual_channel_neighborhood_audit
      - name: Verify Stage 147 scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage147_dual_channel_neighborhood_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 147
          assert summary['finite'] is True
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['interior_grid'] == [56, 56]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['correction_floor'] == 0.05
          assert cfg['witness_node'] == 9
          assert cfg['pair_sectors'] == [5, 6]
          assert cfg['dominant_mirrored_sector'] == 6
          assert cfg['material_neighbor_ratio_min'] == 0.25
          assert cfg['curvature_neighborhood_used_for_solver'] is False
          assert cfg['solver_rerun'] is False
          assert cfg['solver_endpoint_advanced'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['benchmark_or_validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          agg = summary['aggregate']
          assert agg['stage146_record_ok'] is True
          assert agg['stage138_record_ok'] is True
          assert agg['parent_route_ok'] is True
          assert agg['center_metric_match_error'] <= 1.0e-12
          assert agg['local_profile_match_error'] <= 1.0e-12
          assert agg['maximum_identity_or_decomposition_closure'] <= 1.0e-12
          allowed = {
              'stage147_dual_channel_curvature_persists_stage148_persistent_curvature_shape_audit',
              'stage147_material_bilateral_curvature_sign_reversal_stage148_sample_scale_curvature_alternation_audit',
              'stage147_mixed_or_one_sided_curvature_stage148_extended_neighborhood_curvature_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'Stage 90 remains nonconverged' in summary['negative_result_guard']
          assert 'diagnostics, not solver parameters' in summary['negative_result_guard']
          with np.load(root / 'dual_channel_neighborhood.npz') as data:
              assert data['five_point_depth'].shape == (5,)
              assert data['five_point_dominant_signed'].shape == (5,)
              assert data['five_point_parent_signed'].shape == (5,)
              assert data['five_point_complement_signed'].shape == (5,)
              assert data['neighborhood_depth'].shape == (3,)
              assert data['dominant_projected_curvature'].shape == (3,)
              assert data['parent_projected_curvature'].shape == (3,)
              assert data['complement_secant_deficit'].shape == (3,)
              assert data['neighbor_absolute_ratio_to_center'].shape == (2,)
              assert data['channel_absolute_shares'].shape == (3, 2)
              assert np.isfinite(data['complement_secant_deficit']).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage147-dual-channel-neighborhood-audit
          path: /tmp/stage147_dual_channel_neighborhood_audit
          retention-days: 30

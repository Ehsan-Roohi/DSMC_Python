name: Vision-guided DSMC Stage 92

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage92_candidate_update_localization_audit.py'
      - 'vision_guided_dsmc/tests/test_stage92_candidate_update_localization_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage92.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage92_candidate_update_localization_audit.py'
      - 'vision_guided_dsmc/tests/test_stage92_candidate_update_localization_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage92.yml'

permissions:
  actions: read
  contents: read

jobs:
  candidate-update-localization-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 92 and retained Stage 91 guards
        run: |
          pytest -q \
            tests/test_stage92_candidate_update_localization_audit.py \
            tests/test_stage91_fixed_parameter_nonconvergence_onset_audit.py \
            tests/test_stage90_single_condition_reconstruction_solver_ab_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 91 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage91-fixed-parameter-nonconvergence-onset-audit
          path: /tmp/stage91_fixed_parameter_nonconvergence_onset_audit
          run-id: 31297331158
          github-token: ${{ github.token }}
      - name: Run Stage 92 first-update candidate localization audit
        run: |
          python -m vgdsmc.stage92_candidate_update_localization_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage91-artifact-dir /tmp/stage91_fixed_parameter_nonconvergence_onset_audit \
            --output-dir /tmp/stage92_candidate_update_localization_audit
      - name: Verify fixed design, localization output, and negative-result guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage92_candidate_update_localization_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 92
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['onset_step'] == 1
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          assert cfg['solver_endpoint_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          for distribution in ('phi', 'psi'):
              result = summary[distribution]
              for arm_name in ('zero_boundary_slope', 'one_sided_boundary_slope'):
                  arm = result[arm_name]
                  assert arm['finite'] is True
                  assert 0.0 <= arm['floor_activation_fraction'] <= 1.0
                  assert 0.0 <= arm['strict_negative_fraction'] <= 1.0
                  assert 0.0 <= arm['first_order_floor_fraction'] <= 1.0
                  assert 0.0 <= arm['correction_induced_fraction_of_activations'] <= 1.0
                  assert np.isfinite(arm['minimum_candidate'])
                  assert np.isfinite(arm['minimum_first_order_candidate'])
              pair = result['paired_floor_mask_comparison']
              assert 0.0 <= pair['jaccard_overlap'] <= 1.0

          allowed = {
              'stage92_nonfinite_first_update_blocker_without_retuning',
              'stage92_shared_correction_induced_floor_onset_stage93_axis_component_balance_audit',
              'stage92_boundary_counterfactual_changes_floor_topology_stage93_boundary_specific_balance_audit',
              'stage92_mixed_floor_onset_localization_stage93_axis_component_balance_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 90 remains nonconverged in both arms' in summary['negative_result_guard']

          with np.load(root / 'candidate_update_localization_maps.npz') as maps:
              expected = {
                  'phi_zero_boundary_slope_cell_floor_fraction': (64, 64),
                  'phi_one_sided_boundary_slope_cell_floor_fraction': (64, 64),
                  'psi_zero_boundary_slope_cell_floor_fraction': (64, 64),
                  'psi_one_sided_boundary_slope_cell_floor_fraction': (64, 64),
                  'phi_zero_boundary_slope_velocity_floor_fraction': (3840,),
                  'phi_one_sided_boundary_slope_velocity_floor_fraction': (3840,),
                  'psi_zero_boundary_slope_velocity_floor_fraction': (3840,),
                  'psi_one_sided_boundary_slope_velocity_floor_fraction': (3840,),
              }
              for key, shape in expected.items():
                  assert key in maps
                  assert maps[key].shape == shape
                  assert np.isfinite(maps[key]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage92-candidate-update-localization-audit
          path: /tmp/stage92_candidate_update_localization_audit
          retention-days: 30

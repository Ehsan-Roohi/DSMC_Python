name: Vision-guided DSMC Stage 87

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage87_one_sided_boundary_slope_counterfactual_audit.py'
      - 'vision_guided_dsmc/tests/test_stage87_one_sided_boundary_slope_counterfactual_audit.py'
      - 'vision_guided_dsmc/results/stage86_boundary_reconstruction_stencil_activation_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage87.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage87_one_sided_boundary_slope_counterfactual_audit.py'
      - 'vision_guided_dsmc/tests/test_stage87_one_sided_boundary_slope_counterfactual_audit.py'
      - 'vision_guided_dsmc/results/stage86_boundary_reconstruction_stencil_activation_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage87.yml'

permissions:
  actions: read
  contents: read

jobs:
  one-sided-boundary-slope-counterfactual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 87 and retained frozen-audit endpoints
        run: |
          pytest -q \
            tests/test_stage87_one_sided_boundary_slope_counterfactual_audit.py \
            tests/test_stage86_boundary_reconstruction_stencil_activation_audit.py \
            tests/test_stage85_near_wall_face_amplitude_suppression_audit.py \
            tests/test_stage84_wall_normal_sign_lobe_geometry_audit.py \
            tests/test_stage83_opposite_sector_spatial_cancellation_localization_audit.py \
            tests/test_stage82_within_sector_angular_coherence_audit.py \
            tests/test_stage81_dominant_node_individual_ordinate_audit.py \
            tests/test_stage80_dominant_shell_radial_node_angular_attribution_audit.py \
            tests/test_stage79_dominant_moment_radial_angular_gradient_audit.py \
            tests/test_stage78_face_gradient_moment_attribution_audit.py \
            tests/test_stage77_common_frame_face_flux_divergence_audit.py \
            tests/test_stage76_local_velocity_frame_jump_audit.py \
            tests/test_stage75_signed_face_location_velocity_moment_audit.py \
            tests/test_stage74_radial_speed_shell_opposite_sector_cancellation_audit.py \
            tests/test_stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit.py \
            tests/test_stage72_directional_transport_component_audit.py \
            tests/test_stage71_wall_layer_interior_face_transport_attribution_audit.py \
            tests/test_stage70_independent_wall_face_flux_discretization_audit.py \
            tests/test_stage69_frozen_grid_transfer_residual_scaling_audit.py \
            tests/test_stage68_independent_transport_operator_residual_audit.py \
            tests/test_stage67_frozen_full_distribution_residual_decomposition.py \
            tests/test_stage66_frozen_collision_source_observable_audit.py \
            tests/test_stage65_local_clipping_activation_map_audit.py \
            tests/test_stage64_source_step_consistency_audit.py \
            tests/test_stage63_collision_target_equivalence_audit.py \
            tests/test_stage62_finite_kn_normalization_audit.py \
            tests/test_stage60_transport_wall_equation_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 86 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage86-boundary-reconstruction-stencil-activation-audit
          path: /tmp/stage86_boundary_reconstruction_stencil_activation_audit
          run-id: 31253211394
          github-token: ${{ github.token }}
      - name: Run Stage 87 one-sided boundary-slope counterfactual audit
        run: |
          python -m vgdsmc.stage87_one_sided_boundary_slope_counterfactual_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage86-artifact-dir /tmp/stage86_boundary_reconstruction_stencil_activation_audit \
            --output-dir /tmp/stage87_one_sided_boundary_slope_counterfactual_audit
      - name: Verify fixed design, provenance, closure and counterfactual scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage87_one_sided_boundary_slope_counterfactual_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 87
          assert summary['finite'] is True
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['counterfactual_boundary_slope'] == 'one_sided_first_difference'
          assert cfg['counterfactual_face_scope'] == 'wall_adjacent_interior_x_faces_only'
          assert cfg['solver_rerun_count'] == 0
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          metrics = summary['counterfactual_metrics']
          assert metrics['baseline_stage86_relative_l2_closure_error'] <= cfg['baseline_closure_guard']
          assert metrics['maximum_counterfactual_change_away_from_wall_adjacent_faces'] == 0.0
          assert len(metrics['rows']) == 4
          allowed = {
              'stage87_one_sided_boundary_slope_large_frozen_effect_stage88_full_moment_boundary_counterfactual_audit',
              'stage87_one_sided_boundary_slope_partial_frozen_effect_stage88_remaining_direction_counterfactual_decomposition',
              'stage87_one_sided_boundary_slope_weak_frozen_effect_stage88_boundary_distribution_curvature_audit',
          }
          assert summary['decision'] in allowed
          with np.load(root / 'one_sided_boundary_slope_counterfactual_maps.npz') as maps:
              assert maps['baseline_pair_face_groups'].shape == (2, 64, 63)
              assert maps['counterfactual_pair_face_groups'].shape == (2, 64, 63)
              assert maps['baseline_pair_cell_divergence_groups'].shape == (2, 64, 64)
              assert maps['counterfactual_pair_cell_divergence_groups'].shape == (2, 64, 64)
              assert np.max(np.abs(maps['face_change_groups'][:, :, 1:-1])) == 0.0
          assert 'not a stable solver endpoint' in summary['negative_findings'][0]
          assert 'diagnostic perturbation' in summary['negative_findings'][1]
          assert 'failed Stage-28 MUSCL' in summary['negative_findings'][2]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage87-one-sided-boundary-slope-counterfactual-audit
          path: /tmp/stage87_one_sided_boundary_slope_counterfactual_audit
          retention-days: 30

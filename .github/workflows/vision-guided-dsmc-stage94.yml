name: Vision-guided DSMC Stage 94

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage94_floor_moment_perturbation_audit.py'
      - 'vision_guided_dsmc/tests/test_stage94_floor_moment_perturbation_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage94.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage94_floor_moment_perturbation_audit.py'
      - 'vision_guided_dsmc/tests/test_stage94_floor_moment_perturbation_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage94.yml'

permissions:
  actions: read
  contents: read

jobs:
  floor-moment-perturbation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 94 and retained Stage 93 guards
        run: |
          pytest -q \
            tests/test_stage94_floor_moment_perturbation_audit.py \
            tests/test_stage93_first_order_axis_component_balance_audit.py \
            tests/test_stage92_candidate_update_localization_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 93 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage93-first-order-axis-component-balance-audit
          path: /tmp/stage93_first_order_axis_component_balance_audit
          run-id: 31309184991
          github-token: ${{ github.token }}
      - name: Run Stage 94 positivity-floor moment-perturbation audit
        run: |
          python -m vgdsmc.stage94_floor_moment_perturbation_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage93-artifact-dir /tmp/stage93_first_order_axis_component_balance_audit \
            --output-dir /tmp/stage94_floor_moment_perturbation_audit
      - name: Verify fixed design, perturbation accounting, and negative-result guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage94_floor_moment_perturbation_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 94
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['onset_step'] == 1
          assert cfg['positivity_floor'] == 1.0e-30
          assert cfg['correction_floor'] == 0.05
          assert cfg['material_perturbation_guard'] == 1.0e-6
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          assert cfg['solver_endpoint_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          context = summary['stage93_context']
          assert context['phi_floor_activation_fraction_by_count'] > 0.0
          assert context['psi_floor_activation_fraction_by_count'] > 0.0

          for distribution in ('phi', 'psi'):
              result = summary[distribution]
              assert result['finite'] is True
              assert result['strict_negative_fraction'] == 0.0
              assert 0.0 < result['activation_fraction_by_count'] < 1.0
              assert 0.0 <= result['exact_zero_fraction_of_activations'] <= 1.0
              assert 0.0 <= result['positive_subfloor_fraction_of_activations'] <= 1.0
              assert result['added_weighted_value'] >= 0.0
              assert 0.0 <= result['exact_zero_share_of_added_weighted_value'] <= 1.0
              assert result['maximum_cell_relative_m0_perturbation'] >= 0.0
              for stats in result['moment_perturbations'].values():
                  assert np.isfinite(stats['signed_delta'])
                  assert stats['absolute_delta'] >= 0.0
                  assert stats['baseline_absolute_scale'] >= 0.0
                  assert stats['relative_absolute_perturbation'] >= 0.0

          for stats in summary['macroscopic_floor_perturbation'].values():
              assert stats['relative_l2'] >= 0.0
              assert stats['maximum_absolute_delta'] >= 0.0
              assert stats['relative_to_baseline_max'] >= 0.0
              assert stats['mean_absolute_delta'] >= 0.0
              assert all(np.isfinite(value) for value in stats.values())

          allowed = {
              'stage94_nonfinite_floor_perturbation_blocker_without_retuning',
              'stage94_unexpected_negative_candidate_blocker_without_retuning',
              'stage94_floor_moment_perturbation_negligible_stage95_unclipped_second_update_propagation_audit',
              'stage94_floor_moment_perturbation_material_stage95_clipped_unclipped_second_update_propagation_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 90 remains nonconverged in both reconstruction arms' in summary['negative_result_guard']

          with np.load(root / 'floor_moment_perturbation_maps.npz') as maps:
              expected = {
                  'phi_cell_added_m0': (64, 64),
                  'psi_cell_added_m0': (64, 64),
                  'rho_delta': (64, 64),
                  'u_delta': (64, 64),
                  'v_delta': (64, 64),
                  'T_delta': (64, 64),
                  'qx_delta': (64, 64),
                  'qy_delta': (64, 64),
              }
              for key, shape in expected.items():
                  assert key in maps
                  assert maps[key].shape == shape
                  assert np.isfinite(maps[key]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage94-floor-moment-perturbation-audit
          path: /tmp/stage94_floor_moment_perturbation_audit
          retention-days: 30

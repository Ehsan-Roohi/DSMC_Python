name: Vision-guided DSMC Stage 111

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage111_axis_conditioned_asymmetry_audit.py'
      - 'vision_guided_dsmc/tests/test_stage111_axis_conditioned_asymmetry_audit.py'
      - 'vision_guided_dsmc/results/stage110_same_sign_slope_asymmetry_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage111.yml'

permissions:
  actions: read
  contents: read

jobs:
  axis-conditioned-asymmetry-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 111 and retained fixed-design guards
        run: |
          pytest -q \
            tests/test_stage111_axis_conditioned_asymmetry_audit.py \
            tests/test_stage110_same_sign_slope_asymmetry_audit.py \
            tests/test_stage109_limiter_intervention_mode_decomposition_audit.py \
            tests/test_stage108_limiter_severity_correction_amplitude_coupling_audit.py \
            tests/test_stage107_limiter_activation_colocation_audit.py \
            tests/test_stage106_gradient_magnitude_coupling_audit.py \
            tests/test_stage105_directional_gradient_alignment_audit.py \
            tests/test_stage104_interior_gradient_scale_audit.py \
            tests/test_stage103_shell1_spatial_localization_audit.py \
            tests/test_stage102_radial_speed_shell_audit.py \
            tests/test_stage101_interior_velocity_sector_audit.py \
            tests/test_stage100_fused_single_run_directional_audit.py \
            tests/test_stage99_replay_provenance_audit.py \
            tests/test_stage98_directional_operator_growth_audit.py \
            tests/test_stage97_muscl_correction_spatial_localization_audit.py \
            tests/test_stage96_muscl_correction_growth_audit.py \
            tests/test_stage90_single_condition_reconstruction_solver_ab_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 110 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage110-same-sign-slope-asymmetry-audit
          path: /tmp/stage110_same_sign_slope_asymmetry_audit
          run-id: 31567568732
          github-token: ${{ github.token }}
      - name: Verify exact Stage 67 and Stage 110 payload provenance
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage67_frozen_full_distribution_residual_decomposition/summary.json': 'e04043a1913b2fa9ae57fe1561aa26c70627830d648e91204093c8f1fb57b3d1',
              '/tmp/stage67_frozen_full_distribution_residual_decomposition/converged_full_distributions.npz': 'd4002a2765137ba517abec2d0483a3e5adcf13f415c53259018556bd14d612d1',
              '/tmp/stage110_same_sign_slope_asymmetry_audit/summary.json': '277d860d302e6216cbbdb5ba503acb02bfbf78a2826ba505b2eb635c07e1ef9a',
              '/tmp/stage110_same_sign_slope_asymmetry_audit/same_sign_slope_asymmetry_maps.npz': 'd63a60ff8ee51769385031066429b43efdba61e8373185e818d3813e39943265',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 111 frozen axis-conditioned asymmetry audit
        run: |
          python -m vgdsmc.stage111_axis_conditioned_asymmetry_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage110-artifact-dir /tmp/stage110_same_sign_slope_asymmetry_audit \
            --output-dir /tmp/stage111_axis_conditioned_asymmetry_audit
      - name: Verify Stage 111 fixed design and negative-result guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage111_axis_conditioned_asymmetry_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 111
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['correction_floor'] == 0.05
          assert cfg['diagnostic_steps'] == 25
          assert cfg['wall_band_cells'] == 4
          assert cfg['dominant_radial_shell'] == 1
          assert cfg['radial_shell_count'] == 4
          assert cfg['radial_nodes_per_shell'] == 10
          assert cfg['shell_velocity_point_count'] == 960
          assert cfg['axis_rank_coupling_guard'] == 0.50
          assert cfg['quartile_amplitude_ratio_guard'] == 1.50
          assert cfg['axis_dominance_ratio_guard'] == 1.25
          assert cfg['mode_closure_tolerance'] == 1.0e-12
          assert cfg['stage67_run_id'] == 30991124477
          assert cfg['stage67_job_id'] == 92257254811
          assert cfg['stage67_artifact_id'] == 8931272132
          assert cfg['stage110_run_id'] == 31567568732
          assert cfg['stage110_job_id'] == 94022470984
          assert cfg['stage110_artifact_id'] == 9138171523
          assert cfg['full_solver_endpoint_rerun'] is False
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['one_sided_boundary_slope_promoted'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          assert cfg['solver_endpoint_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          assert summary['stage110_authorization']['decision'] == 'stage110_relative_same_sign_asymmetry_coupled_stage111_axis_conditioned_asymmetry_audit'
          assert summary['max_parent_closure_relative_l2'] <= 1.0e-12
          allowed = {
              'stage111_nonfinite_axis_conditioning_blocker_without_retuning',
              'stage111_axis_decomposition_closure_blocker_without_retuning',
              'stage111_x_axis_asymmetry_coupled_stage112_axis_specific_spatial_audit',
              'stage111_y_axis_asymmetry_coupled_stage112_axis_specific_spatial_audit',
              'stage111_x_axis_dominates_stage112_axis_specific_spatial_audit',
              'stage111_y_axis_dominates_stage112_axis_specific_spatial_audit',
              'stage111_both_axes_asymmetry_coupled_stage112_joint_axis_interaction_audit',
              'stage111_axis_conditioning_not_sufficient_stage112_gradient_strength_confound_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 110 remains association rather than causal isolation' in summary['negative_result_guard']
          assert 'Stage 99 remains a negative cross-run reproducibility result' in summary['negative_result_guard']
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'no cross-Knudsen MUSCL extension is permitted' in summary['negative_result_guard']
          with np.load(root / 'axis_conditioned_asymmetry_maps.npz') as data:
              expected = {
                  'phi_x_same_sign_change_weighted_abs', 'phi_x_same_sign_centered_slope_weighted_abs',
                  'phi_x_same_sign_relative_asymmetry', 'phi_x_same_sign_support_weight_fraction',
                  'phi_y_same_sign_change_weighted_abs', 'phi_y_same_sign_centered_slope_weighted_abs',
                  'phi_y_same_sign_relative_asymmetry', 'phi_y_same_sign_support_weight_fraction',
                  'phi_growth_amplitude',
                  'psi_x_same_sign_change_weighted_abs', 'psi_x_same_sign_centered_slope_weighted_abs',
                  'psi_x_same_sign_relative_asymmetry', 'psi_x_same_sign_support_weight_fraction',
                  'psi_y_same_sign_change_weighted_abs', 'psi_y_same_sign_centered_slope_weighted_abs',
                  'psi_y_same_sign_relative_asymmetry', 'psi_y_same_sign_support_weight_fraction',
                  'psi_growth_amplitude',
                  'common_x_relative_same_sign_asymmetry', 'common_y_relative_same_sign_asymmetry',
                  'joint_growth_amplitude',
              }
              assert set(data.files) == expected
              for name in data.files:
                  assert data[name].shape == (56, 56)
                  assert np.isfinite(data[name]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage111-axis-conditioned-asymmetry-audit
          path: /tmp/stage111_axis_conditioned_asymmetry_audit
          retention-days: 30

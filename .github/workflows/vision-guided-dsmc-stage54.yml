name: Vision-guided DSMC Stage 54

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage54_projected_collision_moment_audit.py'
      - 'vision_guided_dsmc/tests/test_stage54_projected_collision_moment_audit.py'
      - 'vision_guided_dsmc/results/stage53_radial_mapping_tail_audit_summary.json'
      - '.github/workflows/vision-guided-dsmc-stage54.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage54_projected_collision_moment_audit.py'
      - 'vision_guided_dsmc/tests/test_stage54_projected_collision_moment_audit.py'
      - 'vision_guided_dsmc/results/stage53_radial_mapping_tail_audit_summary.json'
      - '.github/workflows/vision-guided-dsmc-stage54.yml'

permissions:
  contents: read
  actions: read

jobs:
  projected-collision-moment-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 54 and retained projected-polar infrastructure
        run: |
          pytest -q \
            tests/test_stage54_projected_collision_moment_audit.py \
            tests/test_stage53_radial_mapping_tail_audit.py \
            tests/test_stage52_velocity_resolution_audit.py \
            tests/test_stage51_heat_flux_definition_audit.py \
            tests/test_stage50_projected_polar_cross_kn_extension.py \
            tests/test_stage49_projected_polar_64x64_confirmation.py \
            tests/test_stage48_projected_polar_56x56_confirmation.py \
            tests/test_stage47_projected_polar_48x48_confirmation.py \
            tests/test_stage46_projected_polar_40x40_confirmation.py \
            tests/test_stage45_projected_polar_32x32_confirmation.py \
            tests/test_stage44_projected_polar_finer_grid_sequence.py \
            tests/test_stage43_projected_polar_resolution_sequence.py \
            tests/test_stage42_projected_polar_heated_cavity_pilot.py \
            tests/test_stage40_external_benchmark_fidelity_audit.py \
            tests/test_reduced_spherical_solver.py
      - name: Download exact completed Stage 53 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage53-radial-mapping-tail-audit
          path: /tmp/stage53_radial_mapping_tail_audit
          run-id: 30803098842
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run frozen Stage 54 projected collision-moment audit
        run: |
          python -m vgdsmc.stage54_projected_collision_moment_audit \
            --stage53-artifact-dir /tmp/stage53_radial_mapping_tail_audit \
            --output-dir /tmp/stage54_projected_collision_moment_audit
      - name: Verify provenance, frozen design and explicit scientific endpoint
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage54_projected_collision_moment_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 54
          retained = summary['retained_stage53_endpoint']
          assert retained['workflow_run_id'] == 30803098842
          assert retained['workflow_job_id'] == 91652089093
          assert retained['workflow_conclusion'] == 'success'
          assert retained['tests_passed'] == 87
          assert retained['tests_failed'] == 0
          assert retained['artifact_id'] == 8854974012
          assert retained['artifact_sha256'] == (
              '35a29adb215b29609084e7aa2e63d6c9f3ba738cbb3e0210926371c4889a0306'
          )
          assert summary['retained_stage53_decision'] == (
              'radial_mapping_tail_does_not_explain_cross_kn_heat_flux_'
              'stage54_projected_collision_moment_audit'
          )

          cfg = summary['configuration']
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['grid'] == [64, 64]
          assert cfg['radial_nodes'] == 32
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3072
          assert cfg['cases'] == [
              {'name': 'compressed_tail', 'radial_scale': 0.5},
              {'name': 'expanded_tail', 'radial_scale': 2.0},
          ]
          assert cfg['retained_correction_floor'] == 0.05
          assert math.isclose(cfg['prandtl'], 2.0 / 3.0)
          for key in (
              'physical_parameter_retuning',
              'collision_parameter_retuning',
              'transport_retuning',
              'wall_model_retuning',
              'normalization_retuning',
              'quadrature_retuning',
              'solver_rerun',
          ):
              assert cfg[key] is False
          assert cfg['unclipped_equilibrium_is_diagnostic_only'] is True

          expected_cases = {'compressed_tail', 'expanded_tail'}
          assert set(summary['case_audits']) == expected_cases
          for name, row in summary['case_audits'].items():
              assert row['radial_scale'] in {0.5, 2.0}
              for operator in (
                  'current_clipped_operator',
                  'unclipped_algebraic_diagnostic',
              ):
                  metrics = row[operator]
                  assert math.isfinite(metrics['maximum_conserved_moment_defect'])
                  assert math.isfinite(metrics['rms_conserved_moment_defect'])
                  assert math.isfinite(metrics['heat_flux_closure_relative_l2'])
              path = root / f'{name}_collision_diagnostics.npz'
              with np.load(path) as data:
                  required = {
                      'clipped_local_conserved_defect',
                      'clipped_local_heat_flux_closure',
                      'unclipped_local_conserved_defect',
                      'unclipped_local_heat_flux_closure',
                      'phi_clipped_weight_fraction',
                      'psi_clipped_weight_fraction',
                  }
                  assert required.issubset(data.files)
                  for key in required:
                      assert np.isfinite(data[key]).all()

          allowed = {
              'positivity_clipping_breaks_collision_invariants_stage55_conservative_positive_projection_pilot',
              'projected_collision_formula_or_quadrature_blocker',
              'projected_collision_moments_do_not_explain_cross_kn_heat_flux_stage55_knudsen_convention_audit',
          }
          assert summary['decision'] in allowed
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage54-projected-collision-moment-audit
          path: /tmp/stage54_projected_collision_moment_audit
          retention-days: 30

name: Vision-guided DSMC Stage 103

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage103_shell1_spatial_localization_audit.py'
      - 'vision_guided_dsmc/tests/test_stage103_shell1_spatial_localization_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage103.yml'

permissions:
  actions: read
  contents: read

jobs:
  shell1-spatial-localization-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 103 and retained fixed-design guards
        run: |
          pytest -q \
            tests/test_stage103_shell1_spatial_localization_audit.py \
            tests/test_stage102_radial_speed_shell_audit.py \
            tests/test_stage101_interior_velocity_sector_audit.py \
            tests/test_stage100_fused_single_run_directional_audit.py \
            tests/test_stage99_replay_provenance_audit.py \
            tests/test_stage98_directional_operator_growth_audit.py \
            tests/test_stage97_muscl_correction_spatial_localization_audit.py \
            tests/test_stage96_muscl_correction_growth_audit.py \
            tests/test_stage90_single_condition_reconstruction_solver_ab_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 102 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage102-radial-speed-shell-audit
          path: /tmp/stage102_radial_speed_shell_audit
          run-id: 31431835887
          github-token: ${{ github.token }}
      - name: Verify exact Stage 67 and Stage 102 payload provenance
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage67_frozen_full_distribution_residual_decomposition/summary.json': 'e04043a1913b2fa9ae57fe1561aa26c70627830d648e91204093c8f1fb57b3d1',
              '/tmp/stage67_frozen_full_distribution_residual_decomposition/converged_full_distributions.npz': 'd4002a2765137ba517abec2d0483a3e5adcf13f415c53259018556bd14d612d1',
              '/tmp/stage102_radial_speed_shell_audit/summary.json': '8f909a0db0390a235aeb8436c53a99bbfe791739d4b991e1584015484393ca66',
              '/tmp/stage102_radial_speed_shell_audit/interior_radial_speed_shell_histories.npz': 'caf7177a57ff72685747190d3eac45778a434c2dbeec5cfc6b8ccf0a65d26a75',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 103 shell-1 spatial localization audit
        run: |
          python -m vgdsmc.stage103_shell1_spatial_localization_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage102-artifact-dir /tmp/stage102_radial_speed_shell_audit \
            --output-dir /tmp/stage103_shell1_spatial_localization_audit
      - name: Verify Stage 103 fixed design and negative-result guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage103_shell1_spatial_localization_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 103
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['correction_floor'] == 0.05
          assert cfg['diagnostic_steps'] == 25
          assert cfg['wall_band_cells'] == 4
          assert cfg['dominant_radial_shell'] == 1
          assert cfg['interior_tile_count_per_axis'] == 4
          assert cfg['interior_tile_count'] == 16
          assert cfg['interior_tile_size'] == 14
          assert cfg['single_tile_share_guard'] == 0.25
          assert cfg['contiguous_2x2_share_guard'] == 0.50
          assert cfg['material_shell_growth_ratio'] == 2.0
          assert cfg['spatial_parent_closure_tolerance'] == 1.0e-12
          assert cfg['stage67_run_id'] == 30991124477
          assert cfg['stage102_run_id'] == 31431835887
          assert cfg['stage102_job_id'] == 93596839081
          assert cfg['stage102_artifact_id'] == 9084348663
          assert cfg['full_solver_endpoint_rerun'] is False
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['one_sided_boundary_slope_promoted'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          assert cfg['solver_endpoint_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          assert summary['stage102_authorization']['decision'] == 'stage102_common_dominant_radial_shell_1_stage103_shell_spatial_localization_audit'
          assert summary['stage102_authorization']['maximum_shell_parent_closure_relative'] <= 1.0e-12
          assert 1 <= summary['executed_steps'] <= 25
          assert np.isfinite(summary['maximum_stage102_shell_history_closure_relative'])
          allowed_prefixes = ('stage103_nonfinite_replay_blocker_without_retuning', 'stage103_stage102_shell_history_closure_blocker_without_retuning', 'stage103_common_localized_tile_', 'stage103_common_localized_contiguous_2x2_', 'stage103_spatially_diffuse_shell1_growth_stage104_interior_gradient_scale_audit')
          assert summary['decision'].startswith(allowed_prefixes)
          if not summary['decision'].endswith('blocker_without_retuning'):
              assert summary['finite'] is True
              assert summary['executed_steps'] == 25
              assert summary['maximum_stage102_shell_history_closure_relative'] <= 1.0e-12
          assert 'Stage 99 remains a negative cross-run reproducibility result' in summary['negative_result_guard']
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'no cross-Knudsen MUSCL extension is permitted' in summary['negative_result_guard']
          with np.load(root / 'shell1_spatial_localization_histories.npz') as data:
              n = summary['executed_steps']
              assert data['tile_index'].shape == (64, 64)
              assert int(np.sum(data['interior_mask'])) == 56 * 56
              assert int(np.sum(data['dominant_shell_mask'])) == 10 * 96
              for k in range(16):
                  assert int(np.sum(data['tile_index'] == k)) == 14 * 14
              for distribution in ('phi', 'psi'):
                  for metric in ('tile_weighted_abs', 'tile_weighted_signed', 'tile_abs_share', 'tile_signed_to_abs_ratio'):
                      name = f'{distribution}_{metric}'
                      assert data[name].shape == (n, 16)
                      assert np.isfinite(data[name]).all()
                  closure = data[f'{distribution}_stage102_shell_history_closure_relative']
                  assert closure.shape == (n,)
                  assert np.isfinite(closure).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage103-shell1-spatial-localization-audit
          path: /tmp/stage103_shell1_spatial_localization_audit
          retention-days: 30

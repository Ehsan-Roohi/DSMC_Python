name: Vision-guided DSMC Stage 26
on:
  push:
    paths:
      - 'vision_guided_dsmc/**'
      - '.github/workflows/vision-guided-dsmc-stage26.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/**'
      - '.github/workflows/vision-guided-dsmc-stage26.yml'
jobs:
  quantitative-linear-sidewall-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 26 equations and literature tables
        run: pytest -q tests/test_linear_sidewall_validation.py tests/test_dvm_shakhov.py
      - name: Run three quantitative journal benchmark cases
        run: |
          vgdsmc-linear-sidewall-validation \
            --output-dir /tmp/stage26_linear_sidewall \
            --nx 20 --ny 20 --nv 17 --velocity-extent 5.0 \
            --max-steps 6000 --tolerance 2e-5
      - name: Verify fixed quantitative design
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np
          summary = json.load(open('/tmp/stage26_linear_sidewall/summary.json'))
          assert summary['stage'] == 26
          assert summary['configuration']['wall_model'] == 'bottom hot, top cold, side walls linear hot-to-cold'
          assert summary['configuration']['relaxation_scale'] == '2*Kn0/sqrt(pi)'
          assert [row['kn0'] for row in summary['rows']] == [0.1, 1.0, 10.0]
          assert len(summary['rows']) == 3
          for row in summary['rows']:
              for name in ('final_change', 'predicted_qav', 'literature_qav',
                           'qav_relative_error', 'wall_velocity_relative_rms',
                           'wall_velocity_sign_agreement'):
                  assert math.isfinite(row[name])
              assert 0.0 <= row['wall_velocity_sign_agreement'] <= 1.0
          arrays = np.load('/tmp/stage26_linear_sidewall/fields_and_profiles.npz')
          assert 'table_velocity_kn0p1' in arrays.files
          assert 'table_velocity_kn1p0' in arrays.files
          assert 'table_velocity_kn10p0' in arrays.files
          assert Path('/tmp/stage26_linear_sidewall/summary.json').exists()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage26-linear-sidewall-quantitative-validation
          path: /tmp/stage26_linear_sidewall
          retention-days: 30

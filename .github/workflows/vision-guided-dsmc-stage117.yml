name: Vision-guided DSMC Stage 117
on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage117_*'
      - 'vision_guided_dsmc/tests/test_stage117_*'
      - '.github/workflows/vision-guided-dsmc-stage117.yml'
permissions:
  contents: read
  actions: read
jobs:
  pair-node-transition-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_stage117_pair_node_transition_audit.py
      - uses: actions/download-artifact@v8
        with:
          name: stage116-pair-resolved-radial-node-audit
          path: /tmp/stage116
          github-token: ${{ github.token }}
          run-id: 31703583725
      - run: python -m vgdsmc.stage117_parent_checks /tmp/stage116
      - run: python -m vgdsmc.stage117_pair_node_transition_audit --parent-dir /tmp/stage116 --output-dir /tmp/stage117
      - uses: actions/upload-artifact@v7
        with:
          name: stage117-pair-node-transition-audit
          path: /tmp/stage117
          retention-days: 30

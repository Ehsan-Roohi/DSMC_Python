name: Vision-guided DSMC Stage 35

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage35_coordinate_covariance.py'
      - 'vision_guided_dsmc/vgdsmc/stage32_near_continuum_observable_audit.py'
      - 'vision_guided_dsmc/vgdsmc/linear_sidewall_validation.py'
      - 'vision_guided_dsmc/vgdsmc/velocity_quadrature_audit.py'
      - 'vision_guided_dsmc/tests/test_stage35_coordinate_covariance.py'
      - 'vision_guided_dsmc/pyproject.toml'
      - '.github/workflows/vision-guided-dsmc-stage35.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage35_coordinate_covariance.py'
      - 'vision_guided_dsmc/vgdsmc/stage32_near_continuum_observable_audit.py'
      - 'vision_guided_dsmc/vgdsmc/linear_sidewall_validation.py'
      - 'vision_guided_dsmc/vgdsmc/velocity_quadrature_audit.py'
      - 'vision_guided_dsmc/tests/test_stage35_coordinate_covariance.py'
      - 'vision_guided_dsmc/pyproject.toml'
      - '.github/workflows/vision-guided-dsmc-stage35.yml'

jobs:
  coordinate-covariance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 35 coordinate covariance and retained scale utilities
        run: |
          pytest -q \
            tests/test_stage35_coordinate_covariance.py \
            tests/test_stage34_velocity_scale_consistency.py \
            tests/test_reduced_spherical_solver.py
      - name: Run exact c0-versus-zeta covariance audit
        run: |
          vgdsmc-stage35-coordinate-covariance \
            --output-dir /tmp/stage35_coordinate_covariance \
            --max-steps 9000 --tolerance 3e-5
      - name: Verify Stage 35 reproducibility without forcing a positive result
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np

          summary = json.load(open('/tmp/stage35_coordinate_covariance/summary.json'))
          assert summary['stage'] == 35
          cfg = summary['configuration']
          assert cfg['grid'] == [12, 12]
          assert cfg['kn0_sequence'] == [0.1, 1.0, 10.0]
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['physical_quadrature'] == 'spherical_matched_r16_mu12_phi24'
          assert cfg['velocity_point_count'] == 4608
          assert cfg['c0_tau_prefactor'] == 'sqrt(2)*Kn0/sqrt(pi)'
          assert cfg['zeta_tau_prefactor'] == '2*Kn0/sqrt(pi)'
          assert cfg['transport'] == 'first-order upwind'
          assert cfg['collision'] == 'Shakhov'
          assert cfg['physical_parameter_retuning'] is False
          assert len(summary['rows']) == 3
          for row in summary['rows']:
              for key in (
                  'c0_final_change', 'zeta_final_change',
                  'c0_predicted_qav', 'zeta_predicted_qav',
                  'literature_qav', 'c0_qav_relative_error',
                  'zeta_qav_relative_error',
                  'c0_wall_mass_balance_relative_error',
                  'zeta_wall_mass_balance_relative_error',
              ):
                  assert math.isfinite(row[key])
              covariance = row['covariance']
              for key in (
                  'distribution_relative_l1_after_jacobian_transform',
                  'residual_relative_max_error',
                  'dt_ratio_zeta_to_c0',
                  'tau_prefactor_ratio_zeta_to_c0',
                  'maximum_covariance_error',
              ):
                  assert math.isfinite(covariance[key])
              assert set(covariance['field_relative_max_errors']) == {
                  'T', 'rho', 'u', 'v', 'qx', 'qy',
                  'left_wall_velocity', 'table_velocity', 'bottom_heat_flux',
              }
              for value in covariance['field_relative_max_errors'].values():
                  assert math.isfinite(value)
              assert row['c0_wall_mass_balance_relative_error'] < 1e-10
              assert row['zeta_wall_mass_balance_relative_error'] < 1e-10
          assert summary['decision'] in {
              'coordinate_covariance_passes_adopt_paper_consistent_mapping_and_run_high_resolution_stage36',
              'coordinate_covariance_fails_fix_scale_implementation_before_validation',
          }
          arrays = np.load('/tmp/stage35_coordinate_covariance/fields_and_profiles.npz')
          for kn in ('0p1', '1p0', '10p0'):
              for coordinate in ('c0', 'zeta'):
                  assert np.isfinite(arrays[f'{coordinate}_T_kn{kn}']).all()
                  assert np.isfinite(arrays[f'{coordinate}_bottom_heat_flux_kn{kn}']).all()
                  assert np.isfinite(arrays[f'{coordinate}_table_velocity_kn{kn}']).all()
          assert Path('/tmp/stage35_coordinate_covariance/summary.json').exists()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage35-coordinate-covariance
          path: /tmp/stage35_coordinate_covariance
          retention-days: 30

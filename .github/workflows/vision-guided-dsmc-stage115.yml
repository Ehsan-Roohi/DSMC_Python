name: Vision-guided DSMC Stage 115
on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage115_distribution_specific_velocity_sector_audit.py'
      - 'vision_guided_dsmc/tests/test_stage115_distribution_specific_velocity_sector_audit.py'
      - 'vision_guided_dsmc/results/stage114_wall_distance_conditioned_velocity_quadrature_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage115.yml'
permissions:
  contents: read
jobs:
  distribution-specific-velocity-sector-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_stage115_distribution_specific_velocity_sector_audit.py
      - run: python -m vgdsmc.stage115_distribution_specific_velocity_sector_audit --stage114-record-path results/stage114_wall_distance_conditioned_velocity_quadrature_audit_observed.json --output-dir /tmp/stage115
      - uses: actions/upload-artifact@v4
        with:
          name: stage115-distribution-specific-velocity-sector-audit
          path: /tmp/stage115
          retention-days: 30

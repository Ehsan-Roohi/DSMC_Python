name: Vision-guided DSMC Stage 24
on:
  push:
    paths:
      - 'vision_guided_dsmc/**'
      - '.github/workflows/vision-guided-dsmc-stage24.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/**'
      - '.github/workflows/vision-guided-dsmc-stage24.yml'
jobs:
  bottom-heated-literature-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 24 utilities and boundary physics
        run: pytest -q tests/test_bottom_heated_benchmark.py tests/test_dvm_shakhov.py
      - name: Run nine published operating conditions
        run: |
          vgdsmc-bottom-heated-benchmark \
            --output-dir /tmp/stage24_bottom_heated \
            --nx 18 --ny 18 --nv 12 --velocity-extent 6.0 \
            --max-steps 2400 --tolerance 3e-6 \
            --kn0 0.1 1 10 \
            --ratios 0.1 0.5 0.9
      - name: Verify complete matrix and structural endpoints
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np
          summary = json.load(open('/tmp/stage24_bottom_heated/summary.json'))
          assert summary['stage'] == 24
          assert len(summary['rows']) == 9
          assert summary['source']['published_conditions']['viscosity_exponent'] == 0.5
          assert summary['source']['published_conditions']['bottom_corner_ramp_fraction'] == 0.05
          assert set(summary['by_ratio']) == {'ratio_0.1', 'ratio_0.5', 'ratio_0.9'}
          assert set(summary['ratio_ordering_checks']) == {'kn0_1', 'kn0_10'}
          assert summary['structural_check_count'] == 3
          for value in summary['structural_checks'].values():
              assert isinstance(value, bool)
          for row in summary['rows']:
              for name in (
                  'final_residual', 'positive_lateral_velocity_fraction',
                  'average_bottom_heat_flux', 'maximum_dimensionless_speed',
                  'mean_temperature', 'minimum_temperature', 'maximum_temperature',
              ):
                  assert math.isfinite(row[name])
              assert 0.0 <= row['positive_lateral_velocity_fraction'] <= 1.0
              assert row['minimum_temperature'] > 0.0
          arrays = np.load('/tmp/stage24_bottom_heated/fields_and_profiles.npz')
          assert 'bottom_heat_flux_ratio0p1_kn0p1' in arrays.files
          assert 'lateral_velocity_ratio0p5_kn1' in arrays.files
          assert 'T_ratio0p9_kn10' in arrays.files
          assert Path('/tmp/stage24_bottom_heated/summary.json').exists()
          PY
      - name: Upload Stage 24 validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage24-bottom-heated-literature-validation
          path: /tmp/stage24_bottom_heated
          retention-days: 30

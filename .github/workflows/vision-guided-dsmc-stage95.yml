name: Vision-guided DSMC Stage 95

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage95_second_update_floor_propagation_audit.py'
      - 'vision_guided_dsmc/tests/test_stage95_second_update_floor_propagation_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage95.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage95_second_update_floor_propagation_audit.py'
      - 'vision_guided_dsmc/tests/test_stage95_second_update_floor_propagation_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage95.yml'

permissions:
  actions: read
  contents: read

jobs:
  second-update-floor-propagation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 95 and retained Stage 94 guards
        run: |
          pytest -q \
            tests/test_stage95_second_update_floor_propagation_audit.py \
            tests/test_stage94_floor_moment_perturbation_audit.py \
            tests/test_stage93_first_order_axis_component_balance_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 94 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage94-floor-moment-perturbation-audit
          path: /tmp/stage94_floor_moment_perturbation_audit
          run-id: 31314965092
          github-token: ${{ github.token }}
      - name: Run Stage 95 second-update floor-propagation audit
        run: |
          python -m vgdsmc.stage95_second_update_floor_propagation_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage94-artifact-dir /tmp/stage94_floor_moment_perturbation_audit \
            --output-dir /tmp/stage95_second_update_floor_propagation_audit
      - name: Verify fixed design, propagation accounting, and negative-result guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage95_second_update_floor_propagation_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 95
          assert summary['retained_stage94_decision'] == 'stage94_floor_moment_perturbation_negligible_stage95_unclipped_second_update_propagation_audit'
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['positivity_floor'] == 1.0e-30
          assert cfg['correction_floor'] == 0.05
          assert cfg['second_update_index'] == 2
          assert cfg['material_propagation_guard'] == 1.0e-6
          assert cfg['second_candidate_floor_application'] is False
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          assert cfg['solver_endpoint_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          context = summary['stage94_first_state_context']
          assert context['phi_floor_activation_fraction_by_count'] > 0.0
          assert context['psi_floor_activation_fraction_by_count'] > 0.0
          assert context['maximum_first_state_macroscopic_relative_l2'] <= 1.0e-6

          for key in ('second_update_first_order', 'second_update_baseline_muscl'):
              operator = summary[key]
              assert operator['second_candidate_floor_application'] is False
              for distribution in ('phi', 'psi'):
                  result = operator[distribution]
                  assert result['finite'] is True
                  assert result['raw_relative_l2'] >= 0.0
                  assert result['maximum_absolute_delta'] >= 0.0
                  assert result['weighted_m0_relative_absolute_difference'] >= 0.0
                  assert result['weighted_speed_squared_relative_absolute_difference'] >= 0.0
                  assert 0.0 <= result['floor_mask_jaccard'] <= 1.0
                  assert 0.0 <= result['floor_mask_symmetric_difference_fraction'] <= 1.0
                  for seed in ('unclipped_seed', 'clipped_seed'):
                      stats = result[seed]
                      assert 0.0 <= stats['activation_fraction_by_count'] <= 1.0
                      assert 0.0 <= stats['strict_negative_fraction'] <= 1.0
                      assert np.isfinite(stats['minimum_candidate'])
              for stats in operator['macroscopic_difference'].values():
                  assert all(np.isfinite(value) for value in stats.values())
                  assert stats['relative_l2'] >= 0.0

          assert summary['maximum_propagated_macroscopic_relative_l2'] >= 0.0
          assert summary['maximum_propagated_weighted_relative_difference'] >= 0.0
          allowed = {
              'stage95_nonfinite_second_update_blocker_without_retuning',
              'stage95_floor_propagation_negligible_stage96_muscl_correction_growth_audit',
              'stage95_floor_propagation_material_stage96_floor_sensitive_operator_localization_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 90 remains nonconverged in both reconstruction arms' in summary['negative_result_guard']
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']

          with np.load(root / 'second_update_floor_propagation_maps.npz') as maps:
              expected = {
                  'first_order_phi_cell_abs_delta_m0': (64, 64),
                  'first_order_psi_cell_abs_delta_m0': (64, 64),
                  'first_order_rho_delta': (64, 64),
                  'first_order_T_delta': (64, 64),
                  'first_order_qx_delta': (64, 64),
                  'first_order_qy_delta': (64, 64),
                  'muscl_phi_cell_abs_delta_m0': (64, 64),
                  'muscl_psi_cell_abs_delta_m0': (64, 64),
                  'muscl_rho_delta': (64, 64),
                  'muscl_T_delta': (64, 64),
                  'muscl_qx_delta': (64, 64),
                  'muscl_qy_delta': (64, 64),
              }
              for name, shape in expected.items():
                  assert name in maps
                  assert maps[name].shape == shape
                  assert np.isfinite(maps[name]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage95-second-update-floor-propagation-audit
          path: /tmp/stage95_second_update_floor_propagation_audit
          retention-days: 30

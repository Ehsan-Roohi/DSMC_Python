name: Vision-guided DSMC Stage 58

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage58_conservative_solver_64x64_confirmation.py'
      - 'vision_guided_dsmc/tests/test_stage58_conservative_solver_64x64_confirmation.py'
      - 'vision_guided_dsmc/results/stage57_conservative_solver_pilot_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage58.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage58_conservative_solver_64x64_confirmation.py'
      - 'vision_guided_dsmc/tests/test_stage58_conservative_solver_64x64_confirmation.py'
      - 'vision_guided_dsmc/results/stage57_conservative_solver_pilot_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage58.yml'

permissions:
  actions: read
  contents: read

jobs:
  conservative-solver-64x64-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 58 and retained conservative-projection infrastructure
        run: |
          pytest -q \
            tests/test_stage58_conservative_solver_64x64_confirmation.py \
            tests/test_stage57_conservative_solver_pilot.py \
            tests/test_stage56_conservative_projection_pilot.py \
            tests/test_stage55_unclipped_quadrature_closure_audit.py \
            tests/test_stage54_projected_collision_moment_audit.py \
            tests/test_stage53_radial_mapping_tail_audit.py \
            tests/test_stage52_velocity_resolution_audit.py \
            tests/test_stage50_projected_polar_cross_kn_extension.py \
            tests/test_stage42_projected_polar_heated_cavity_pilot.py
      - name: Download exact completed Stage 57 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage57-conservative-solver-pilot
          path: /tmp/stage57_conservative_solver_pilot
          run-id: 30859493733
          github-token: ${{ github.token }}
      - name: Run frozen Stage 58 paired 64x64 confirmation
        run: |
          python -m vgdsmc.stage58_conservative_solver_64x64_confirmation \
            --stage57-artifact-dir /tmp/stage57_conservative_solver_pilot \
            --output-dir /tmp/stage58_conservative_solver_64x64_confirmation
      - name: Verify provenance, frozen design, paired results and closure
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage58_conservative_solver_64x64_confirmation')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 58
          retained = summary['retained_stage57_endpoint']
          assert retained['workflow_run_id'] == 30859493733
          assert retained['workflow_job_id'] == 91838121463
          assert retained['workflow_conclusion'] == 'success'
          assert retained['tests_passed'] == 71
          assert retained['tests_failed'] == 0
          assert retained['artifact_id'] == 8875278804
          assert retained['artifact_sha256'] == (
              '17f4a660e1c528308bc7ece461fdecb22e93a51f01d910220236b9aae33f8210'
          )
          assert summary['retained_stage57_decision'] == (
              'stage57_conservative_solver_pilot_passes_'
              'stage58_frozen_64x64_confirmation'
          )

          cfg = summary['configuration']
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['grid'] == [64, 64]
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['retained_correction_floor'] == 0.05
          assert cfg['source_relaxation'] == 1.0
          assert cfg['cross_knudsen_extension_permitted'] is False
          for key in (
              'physical_parameter_retuning', 'collision_parameter_retuning',
              'transport_retuning', 'wall_model_retuning',
              'normalization_retuning', 'correction_floor_retuning',
              'source_relaxation_retuning', 'velocity_quadrature_retuning',
          ):
              assert cfg[key] is False

          for arm_name in ('baseline_clipped', 'conservative_projection'):
              arm = summary[arm_name]
              for key in (
                  'iterations', 'final_change', 'predicted_qav',
                  'literature_qav', 'qav_relative_error',
                  'wall_mass_balance_relative_error',
                  'minimum_phi', 'minimum_psi', 'work_proxy',
              ):
                  assert math.isfinite(float(arm[key]))
              assert len(arm['table_velocity']) == 10
              assert all(math.isfinite(float(v)) for v in arm['table_velocity'])
              assert all(math.isfinite(float(v)) for v in arm['velocity_metrics'].values())

          for value in summary['projection_diagnostics'].values():
              assert math.isfinite(float(value))
          for value in summary['resolution_change_from_stage57_pilot'].values():
              assert math.isfinite(float(value))

          for filename in (
              'baseline_clipped_fields_and_profiles.npz',
              'conservative_fields_and_profiles.npz',
          ):
              with np.load(root / filename) as data:
                  required = {
                      'T', 'rho', 'u', 'v', 'qx', 'qy',
                      'left_wall_velocity', 'table_velocity',
                      'bottom_heat_flux', 'residual_history',
                  }
                  assert required.issubset(data.files)
                  for key in required:
                      assert np.isfinite(data[key]).all()
                  assert data['T'].shape == (64, 64)
                  assert data['table_velocity'].shape == (10,)

          allowed = {
              'stage58_frozen_64x64_confirmation_passes_independent_reference_review_before_any_extension',
              'stage58_conservative_confirmation_stable_but_observables_degrade_requires_review_without_retuning',
              'stage58_stable_nonconverged_blocker_without_parameter_retuning',
              'stage58_conservative_projection_closure_blocker_requires_review',
              'stage58_conservative_solver_numerical_blocker_requires_review',
              'stage58_retained_clipped_baseline_numerical_blocker',
              'stage58_nonfinite_blocker_requires_review',
          }
          assert summary['decision'] in allowed
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage58-conservative-solver-64x64-confirmation
          path: /tmp/stage58_conservative_solver_64x64_confirmation
          retention-days: 30

name: Vision-guided DSMC Stage 71

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage71_wall_layer_interior_face_transport_attribution_audit.py'
      - 'vision_guided_dsmc/tests/test_stage71_wall_layer_interior_face_transport_attribution_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage71.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage71_wall_layer_interior_face_transport_attribution_audit.py'
      - 'vision_guided_dsmc/tests/test_stage71_wall_layer_interior_face_transport_attribution_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage71.yml'

permissions:
  actions: read
  contents: read

jobs:
  wall-layer-interior-face-transport-attribution-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 71 and retained audit endpoints
        run: |
          pytest -q \
            tests/test_stage71_wall_layer_interior_face_transport_attribution_audit.py \
            tests/test_stage70_independent_wall_face_flux_discretization_audit.py \
            tests/test_stage69_frozen_grid_transfer_residual_scaling_audit.py \
            tests/test_stage68_independent_transport_operator_residual_audit.py \
            tests/test_stage67_frozen_full_distribution_residual_decomposition.py \
            tests/test_stage66_frozen_collision_source_observable_audit.py \
            tests/test_stage65_local_clipping_activation_map_audit.py \
            tests/test_stage64_source_step_consistency_audit.py \
            tests/test_stage63_collision_target_equivalence_audit.py \
            tests/test_stage62_finite_kn_normalization_audit.py \
            tests/test_stage60_transport_wall_equation_audit.py
      - name: Download exact completed Stage 69 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage69-frozen-grid-transfer-residual-scaling-audit
          path: /tmp/stage69_frozen_grid_transfer_residual_scaling_audit
          run-id: 31027231271
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 70 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage70-independent-wall-face-flux-discretization-audit
          path: /tmp/stage70_independent_wall_face_flux_discretization_audit
          run-id: 31037106991
          github-token: ${{ github.token }}
      - name: Run Stage 71 wall-layer interior-face transport attribution audit
        run: |
          python -m vgdsmc.stage71_wall_layer_interior_face_transport_attribution_audit \
            --stage69-artifact-dir /tmp/stage69_frozen_grid_transfer_residual_scaling_audit \
            --stage70-artifact-dir /tmp/stage70_independent_wall_face_flux_discretization_audit \
            --output-dir /tmp/stage71_wall_layer_interior_face_transport_attribution_audit
      - name: Verify provenance, attribution, and scientific guards
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage71_wall_layer_interior_face_transport_attribution_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 71
          assert summary['finite'] is True
          assert summary['partition_closed'] is True
          assert summary['provenance_consistent'] is True
          assert summary['decision'] == 'stage71_near_wall_side_strip_interior_face_dominance_stage72_directional_transport_component_audit'

          endpoint69 = summary['retained_stage69_endpoint']
          assert endpoint69['workflow_run_id'] == 31027231271
          assert endpoint69['workflow_job_id'] == 92378691275
          assert endpoint69['artifact_id'] == 8942482076
          assert endpoint69['tests_passed'] == 107
          assert endpoint69['tests_failed'] == 0
          endpoint70 = summary['retained_stage70_endpoint']
          assert endpoint70['workflow_run_id'] == 31037106991
          assert endpoint70['workflow_job_id'] == 92411824859
          assert endpoint70['artifact_id'] == 8950151688
          assert endpoint70['tests_passed'] == 125
          assert endpoint70['tests_failed'] == 0

          cfg = summary['configuration']
          assert cfg['grids'] == [16, 32, 64]
          assert cfg['fine_grid'] == 64
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['wall_band_physical_fraction'] == 1.0 / 16.0
          assert cfg['solver_rerun_count'] == 0
          assert cfg['bounded_wall_face_arm_adopted'] is False
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          fine = summary['fine_grid_attribution']
          assert fine['stage69_wall_share_reproduced'] is True
          assert fine['stage70_wall_face_submaterial'] is True
          assert fine['wall_band_dominant'] is True
          assert fine['outer_two_layers_concentrated'] is True
          assert fine['side_strips_dominant'] is True
          assert math.isclose(fine['wall_band_absolute_share'], 0.6047289196255863, rel_tol=1e-12, abs_tol=1e-12)
          assert math.isclose(fine['outer_two_layer_absolute_wall_band_share'], 0.8939171598122034, rel_tol=1e-12, abs_tol=1e-12)
          assert math.isclose(fine['vertical_side_strip_absolute_wall_band_share'], 0.5750613051231903, rel_tol=1e-12, abs_tol=1e-12)
          assert math.isclose(fine['horizontal_strip_absolute_wall_band_share'], 0.3242530086211617, rel_tol=1e-12, abs_tol=1e-12)
          assert math.isclose(fine['corner_absolute_wall_band_share'], 0.10068568625564818, rel_tol=1e-12, abs_tol=1e-12)
          assert math.isclose(fine['global_signed_cancellation_ratio'], 4.671185138118918e-05, rel_tol=1e-11, abs_tol=1e-13)
          assert math.isclose(fine['stage70_fine_wall_face_qav_difference_ratio'], 0.007590384487112345, rel_tol=1e-12, abs_tol=1e-12)
          assert 'not solver sensitivity' in summary['interpretation_guard']
          assert 'x- and y-direction' in summary['scientifically_justified_next_scope']

          with np.load(root / 'wall_layer_attribution_maps.npz') as maps:
              expected = set()
              for grid in (16, 32, 64):
                  expected.add(f'grid{grid}_difference_qy')
                  expected.add(f'grid{grid}_wall_distance_cells')
                  expected.add(f'grid{grid}_region_code')
              assert set(maps.files) == expected
              for grid in (16, 32, 64):
                  assert maps[f'grid{grid}_difference_qy'].shape == (grid, grid)
                  assert np.all(np.isfinite(maps[f'grid{grid}_difference_qy']))
                  assert maps[f'grid{grid}_wall_distance_cells'].shape == (grid, grid)
                  assert maps[f'grid{grid}_region_code'].shape == (grid, grid)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage71-wall-layer-interior-face-transport-attribution-audit
          path: /tmp/stage71_wall_layer_interior_face_transport_attribution_audit
          retention-days: 30

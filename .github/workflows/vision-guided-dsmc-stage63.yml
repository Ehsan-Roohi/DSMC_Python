name: Vision-guided DSMC Stage 63

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage63_collision_target_equivalence_audit.py'
      - 'vision_guided_dsmc/tests/test_stage63_collision_target_equivalence_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage63.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage63_collision_target_equivalence_audit.py'
      - 'vision_guided_dsmc/tests/test_stage63_collision_target_equivalence_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage63.yml'

permissions:
  actions: read
  contents: read

jobs:
  collision-target-equivalence-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 63 and retained equation-audit endpoints
        run: |
          pytest -q \
            tests/test_stage63_collision_target_equivalence_audit.py \
            tests/test_stage62_finite_kn_normalization_audit.py \
            tests/test_stage61_characteristic_transport_audit.py \
            tests/test_stage60_transport_wall_equation_audit.py
      - name: Download exact completed Stage 62 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage62-finite-kn-normalization-audit
          path: /tmp/stage62_finite_kn_normalization_audit
          run-id: 30919066526
          github-token: ${{ github.token }}
      - name: Run Stage 63 collision-target equivalence audit
        run: |
          python -m vgdsmc.stage63_collision_target_equivalence_audit \
            --stage62-artifact-dir /tmp/stage62_finite_kn_normalization_audit \
            --output-dir /tmp/stage63_collision_target_equivalence_audit
      - name: Verify provenance, frozen design, negative findings and guarded decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/stage63_collision_target_equivalence_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 63
          retained = summary['retained_stage62_endpoint']
          assert retained['workflow_run_id'] == 30919066526
          assert retained['workflow_job_id'] == 92024594771
          assert retained['workflow_conclusion'] == 'success'
          assert retained['tests_passed'] == 23
          assert retained['tests_failed'] == 0
          assert retained['artifact_id'] == 8903379367
          assert retained['artifact_size_bytes'] == 2583
          assert retained['artifact_sha256'] == (
              '560afeb69a6a1a8c1c055c68b6e44029a74432294ff952625141f60a664541ea'
          )
          assert retained['summary_sha256'] == (
              'c01131443fa1188cbf604f340aa2598b493ed629ac8be4aa66e91318c310a026'
          )

          cfg = summary['configuration']
          assert cfg['kn0_investigation_scope'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['viscosity_exponent'] == 0.5
          assert cfg['velocity_rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['prandtl'] == 2.0 / 3.0
          assert cfg['retained_correction_floor'] == 0.05
          assert cfg['frozen_state_count'] == 5
          assert cfg['solver_rerun'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['conservative_projection_adopted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          aggregate = summary['aggregate']
          assert aggregate['state_count'] == 5
          assert aggregate['states_with_material_clipping'] >= 3
          assert aggregate['maximum_formula_transform_error'] < 1e-12
          assert aggregate['maximum_implementation_match_error'] < 1e-12
          assert aggregate['maximum_unclipped_conserved_moment_defect'] < 1e-7
          assert aggregate['maximum_unclipped_heat_flux_closure_error'] < 1e-6
          assert aggregate['maximum_clipped_conserved_moment_defect'] >= 1e-2
          assert aggregate['maximum_clipped_heat_flux_closure_error'] >= 1e-2

          assert summary['decision'] == (
              'stage63_collision_target_matches_independent_paper_equations_'
              'clipping_defects_material_stage64_source_step_consistency_audit'
          )
          assert len(summary['positive_findings']) >= 3
          assert len(summary['negative_findings']) >= 4
          assert 'not physical correctness' in summary['negative_findings'][0]
          assert 'does not rerun the cavity solver' in summary['interpretation_guard']
          assert summary['scientifically_justified_next_scope']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage63-collision-target-equivalence-audit
          path: /tmp/stage63_collision_target_equivalence_audit
          retention-days: 30

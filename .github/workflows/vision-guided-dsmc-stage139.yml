name: Vision-guided DSMC Stage 139

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage139_complement_transition_geometry_audit.py'
      - 'vision_guided_dsmc/tests/test_stage139_complement_transition_geometry_audit.py'
      - 'vision_guided_dsmc/results/stage138_channel_rate_origin_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage139.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage139_complement_transition_geometry_audit.py'
      - 'vision_guided_dsmc/tests/test_stage139_complement_transition_geometry_audit.py'
      - 'vision_guided_dsmc/results/stage138_channel_rate_origin_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage139.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  complement-transition-geometry-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 138-139 fixed-design guards
        run: |
          pytest -q \
            tests/test_stage138_channel_rate_origin_audit.py \
            tests/test_stage139_complement_transition_geometry_audit.py
      - name: Download exact completed Stage 138 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage138-channel-rate-origin-audit
          path: /tmp/stage138_channel_rate_origin_audit
          run-id: 32176056342
          github-token: ${{ github.token }}
      - name: Verify exact Stage 138 payload digests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage138_channel_rate_origin_audit/summary.json': '61a10326c2dce8e5a47dd57333ea9acd5776f0b531dcce48204129a330860c3f',
              '/tmp/stage138_channel_rate_origin_audit/channel_rate_origin.npz': '44ddc0cc8bd3c1bc18c4cb60b953c985bdcb93ebe0c3446b5216a8cf000e03c8',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 139 fixed complement transition geometry audit
        run: |
          python -m vgdsmc.stage139_complement_transition_geometry_audit \
            --stage138-dir /tmp/stage138_channel_rate_origin_audit \
            --stage138-record results/stage138_channel_rate_origin_audit_observed.json \
            --output-dir /tmp/stage139_complement_transition_geometry_audit
      - name: Verify Stage 139 scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage139_complement_transition_geometry_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 139
          assert summary['finite'] is True
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['interior_grid'] == [56, 56]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['correction_floor'] == 0.05
          assert cfg['witness_node'] == 9
          assert cfg['pair_sectors'] == [5, 6]
          assert cfg['dominant_mirrored_sector'] == 6
          assert cfg['parent_identity_closure_max'] == 1.0e-12
          assert cfg['transition_bracket_width_max_cells'] == 1.0 + 1.0e-12
          assert cfg['side_sign_coherence_min'] == 1.0
          assert cfg['well_centered_edge_clearance_min_fraction'] == 0.25
          assert cfg['interpolated_crossing_used_for_solver'] is False
          assert cfg['solver_rerun'] is False
          assert cfg['solver_endpoint_advanced'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['benchmark_or_validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          assert summary['aggregate']['parent_record_ok'] is True
          assert summary['aggregate']['parent_identity_closure'] <= 1.0e-12
          allowed = {
              'stage139_node_proximate_crossing_stage140_local_interpolation_robustness_audit',
              'stage139_well_localized_crossing_stage140_signed_lobe_balance_audit',
              'stage139_underresolved_crossing_stage140_transition_resolution_audit',
              'stage139_unresolved_transition_geometry_stage140_signed_complement_residual_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'Stage 90 remains nonconverged' in summary['negative_result_guard']
          assert 'not a solver parameter' in summary['negative_result_guard']
          with np.load(root / 'complement_transition_geometry.npz') as data:
              for key in ('right_depth', 'dominant_signed', 'parent_signed', 'complement_signed'):
                  assert data[key].shape == (7,)
                  assert np.isfinite(data[key]).all()
              assert data['crossing_bracket_indices'].shape == (2,)
              assert data['crossing_depth'].shape == (1,)
              assert data['crossing_edge_clearance_fraction'].shape == (1,)
              assert data['signed_lobe_abs_areas'].shape == (2,)
              assert np.isfinite(data['crossing_depth']).all()
              assert np.isfinite(data['crossing_edge_clearance_fraction']).all()
              assert np.isfinite(data['signed_lobe_abs_areas']).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage139-complement-transition-geometry-audit
          path: /tmp/stage139_complement_transition_geometry_audit
          retention-days: 30

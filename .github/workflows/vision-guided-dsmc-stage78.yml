name: Vision-guided DSMC Stage 78

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage78_face_gradient_moment_attribution_audit.py'
      - 'vision_guided_dsmc/tests/test_stage78_face_gradient_moment_attribution_audit.py'
      - 'vision_guided_dsmc/results/stage77_common_frame_face_flux_divergence_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage78.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage78_face_gradient_moment_attribution_audit.py'
      - 'vision_guided_dsmc/tests/test_stage78_face_gradient_moment_attribution_audit.py'
      - 'vision_guided_dsmc/results/stage77_common_frame_face_flux_divergence_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage78.yml'

permissions:
  actions: read
  contents: read

jobs:
  face-gradient-moment-attribution-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 78 and retained frozen-audit endpoints
        run: |
          pytest -q \
            tests/test_stage78_face_gradient_moment_attribution_audit.py \
            tests/test_stage77_common_frame_face_flux_divergence_audit.py \
            tests/test_stage76_local_velocity_frame_jump_audit.py \
            tests/test_stage75_signed_face_location_velocity_moment_audit.py \
            tests/test_stage74_radial_speed_shell_opposite_sector_cancellation_audit.py \
            tests/test_stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit.py \
            tests/test_stage72_directional_transport_component_audit.py \
            tests/test_stage71_wall_layer_interior_face_transport_attribution_audit.py \
            tests/test_stage70_independent_wall_face_flux_discretization_audit.py \
            tests/test_stage69_frozen_grid_transfer_residual_scaling_audit.py \
            tests/test_stage68_independent_transport_operator_residual_audit.py \
            tests/test_stage67_frozen_full_distribution_residual_decomposition.py \
            tests/test_stage66_frozen_collision_source_observable_audit.py \
            tests/test_stage65_local_clipping_activation_map_audit.py \
            tests/test_stage64_source_step_consistency_audit.py \
            tests/test_stage63_collision_target_equivalence_audit.py \
            tests/test_stage62_finite_kn_normalization_audit.py \
            tests/test_stage60_transport_wall_equation_audit.py
      - name: Download exact completed Stage 77 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage77-common-frame-face-flux-divergence-audit
          path: /tmp/stage77_common_frame_face_flux_divergence_audit
          run-id: 31136773318
          github-token: ${{ github.token }}
      - name: Run Stage 78 face-gradient moment attribution audit
        run: |
          python -m vgdsmc.stage78_face_gradient_moment_attribution_audit \
            --stage77-artifact-dir /tmp/stage77_common_frame_face_flux_divergence_audit \
            --output-dir /tmp/stage78_face_gradient_moment_attribution_audit
      - name: Verify fixed design, closure, and scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage78_face_gradient_moment_attribution_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 78
          assert summary['finite'] is True
          assert summary['closure_closed'] is True
          assert not summary['decision'].endswith('blocker')

          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['moment_names'] == ['streamwise_kinetic', 'transverse_kinetic', 'reduced_internal']
          assert cfg['dominant_cell_divergence_share_guard'] == 0.50
          assert cfg['component_face_correlation_guard'] == 0.90
          assert cfg['intercomponent_cancellation_ratio_guard'] == 0.75
          assert cfg['solver_rerun_count'] == 0
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          closure = summary['moment_gradient_closure']
          assert closure['face_relative_l2_error'] <= 1e-12
          assert closure['cell_relative_l2_error'] <= 1e-12
          metrics = summary['moment_gradient_metrics']
          assert metrics['dominant_component'] in cfg['moment_names']
          assert 0.0 <= metrics['dominant_cell_divergence_absolute_share'] <= 1.0
          assert 0.0 <= metrics['intercomponent_face_cancellation_ratio'] <= 1.0 + 1e-12
          assert 0.0 <= metrics['intercomponent_cell_divergence_cancellation_ratio'] <= 1.0 + 1e-12
          assert abs(sum(metrics['per_component'][name]['cell_divergence_absolute_share'] for name in cfg['moment_names']) - 1.0) < 1e-12

          with np.load(root / 'face_gradient_moment_attribution_maps.npz') as maps:
              face = maps['face_components']
              cell = maps['cell_divergence_components']
              assert face.shape == (3, 64, 63)
              assert cell.shape == (3, 64, 64)
              assert np.all(np.isfinite(face))
              assert np.all(np.isfinite(cell))
              assert np.max(np.abs(np.sum(cell, axis=(1, 2)))) <= 1e-10

          assert 'not an adjoint sensitivity' in summary['negative_findings'][0]
          assert 'failed Stage-28 MUSCL' in summary['negative_findings'][1]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage78-face-gradient-moment-attribution-audit
          path: /tmp/stage78_face_gradient_moment_attribution_audit
          retention-days: 30

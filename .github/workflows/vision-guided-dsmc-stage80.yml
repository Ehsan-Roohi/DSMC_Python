name: Vision-guided DSMC Stage 80

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage80_dominant_shell_radial_node_angular_attribution_audit.py'
      - 'vision_guided_dsmc/tests/test_stage80_dominant_shell_radial_node_angular_attribution_audit.py'
      - 'vision_guided_dsmc/results/stage79_dominant_moment_radial_angular_gradient_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage80.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage80_dominant_shell_radial_node_angular_attribution_audit.py'
      - 'vision_guided_dsmc/tests/test_stage80_dominant_shell_radial_node_angular_attribution_audit.py'
      - 'vision_guided_dsmc/results/stage79_dominant_moment_radial_angular_gradient_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage80.yml'

permissions:
  actions: read
  contents: read

jobs:
  dominant-shell-radial-node-angular-attribution-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 80 and retained frozen-audit endpoints
        run: |
          pytest -q \
            tests/test_stage80_dominant_shell_radial_node_angular_attribution_audit.py \
            tests/test_stage79_dominant_moment_radial_angular_gradient_audit.py \
            tests/test_stage78_face_gradient_moment_attribution_audit.py \
            tests/test_stage77_common_frame_face_flux_divergence_audit.py \
            tests/test_stage76_local_velocity_frame_jump_audit.py \
            tests/test_stage75_signed_face_location_velocity_moment_audit.py \
            tests/test_stage74_radial_speed_shell_opposite_sector_cancellation_audit.py \
            tests/test_stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit.py \
            tests/test_stage72_directional_transport_component_audit.py \
            tests/test_stage71_wall_layer_interior_face_transport_attribution_audit.py \
            tests/test_stage70_independent_wall_face_flux_discretization_audit.py \
            tests/test_stage69_frozen_grid_transfer_residual_scaling_audit.py \
            tests/test_stage68_independent_transport_operator_residual_audit.py \
            tests/test_stage67_frozen_full_distribution_residual_decomposition.py \
            tests/test_stage66_frozen_collision_source_observable_audit.py \
            tests/test_stage65_local_clipping_activation_map_audit.py \
            tests/test_stage64_source_step_consistency_audit.py \
            tests/test_stage63_collision_target_equivalence_audit.py \
            tests/test_stage62_finite_kn_normalization_audit.py \
            tests/test_stage60_transport_wall_equation_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 79 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage79-dominant-moment-radial-angular-gradient-audit
          path: /tmp/stage79_dominant_moment_radial_angular_gradient_audit
          run-id: 31159895420
          github-token: ${{ github.token }}
      - name: Run Stage 80 dominant-shell radial-node/angular attribution audit
        run: |
          python -m vgdsmc.stage80_dominant_shell_radial_node_angular_attribution_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage79-artifact-dir /tmp/stage79_dominant_moment_radial_angular_gradient_audit \
            --output-dir /tmp/stage80_dominant_shell_radial_node_angular_attribution_audit
      - name: Verify fixed design, closure, and scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage80_dominant_shell_radial_node_angular_attribution_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 80
          assert summary['finite'] is True
          assert summary['closure_closed'] is True
          assert not summary['decision'].endswith('blocker')

          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['dominant_moment'] == 'transverse_kinetic'
          assert cfg['dominant_radial_shell'] == 2
          assert cfg['dominant_shell_global_radial_nodes'] == list(range(20, 30))
          assert cfg['radial_nodes_per_shell'] == 10
          assert cfg['angular_bin_count'] == 8
          assert cfg['vertical_oblique_bins'] == [1, 2, 5, 6]
          assert cfg['dominant_radial_node_share_guard'] == 0.20
          assert cfg['top_three_radial_node_concentration_guard'] == 0.60
          assert cfg['vertical_oblique_concentration_guard'] == 0.70
          assert cfg['solver_rerun_count'] == 0
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          closure = summary['dominant_shell_reconstruction_closure']
          assert closure['face_relative_l2_error'] <= 1e-10
          assert closure['cell_relative_l2_error'] <= 1e-10
          assert closure['radial_shell_labels_exact_match'] is True
          assert closure['angular_bin_labels_exact_match'] is True

          metrics = summary['radial_node_angular_metrics']
          assert 20 <= metrics['dominant_global_radial_node'] < 30
          assert 0.0 <= metrics['dominant_radial_node_cell_divergence_share'] <= 1.0 + 1e-12
          assert 0.0 <= metrics['top_three_radial_node_cell_divergence_share'] <= 1.0 + 1e-12
          assert 0.0 <= metrics['vertical_oblique_cell_divergence_share_within_shell'] <= 1.0 + 1e-12

          with np.load(root / 'dominant_shell_radial_node_angular_attribution_maps.npz') as maps:
              face = maps['face_groups']
              cell = maps['cell_divergence_groups']
              assert face.shape == (10, 8, 64, 63)
              assert cell.shape == (10, 8, 64, 64)
              assert np.all(np.isfinite(face))
              assert np.all(np.isfinite(cell))
              assert np.max(np.abs(np.sum(cell, axis=(2, 3)))) <= 1e-10

          assert 'not an adjoint sensitivity' in summary['negative_findings'][0]
          assert 'failed Stage-28 MUSCL' in summary['negative_findings'][1]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage80-dominant-shell-radial-node-angular-attribution-audit
          path: /tmp/stage80_dominant_shell_radial_node_angular_attribution_audit
          retention-days: 30

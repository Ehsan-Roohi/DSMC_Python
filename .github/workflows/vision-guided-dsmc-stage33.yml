name: Vision-guided DSMC Stage 33
on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage33_asymptotic_spatial_extrapolation.py'
      - 'vision_guided_dsmc/tests/test_stage33_asymptotic_spatial_extrapolation.py'
      - 'vision_guided_dsmc/pyproject.toml'
      - '.github/workflows/vision-guided-dsmc-stage33.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage33_asymptotic_spatial_extrapolation.py'
      - 'vision_guided_dsmc/tests/test_stage33_asymptotic_spatial_extrapolation.py'
      - 'vision_guided_dsmc/pyproject.toml'
      - '.github/workflows/vision-guided-dsmc-stage33.yml'

jobs:
  asymptotic-spatial-extrapolation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 33 extrapolation and reduced solver
        run: |
          pytest -q \
            tests/test_stage33_asymptotic_spatial_extrapolation.py \
            tests/test_stage32_near_continuum_observable_audit.py \
            tests/test_reduced_spherical_solver.py
      - name: Run fixed-physics high-resolution spatial extrapolation
        run: |
          vgdsmc-stage33-spatial-extrapolation \
            --output-dir /tmp/stage33_spatial_extrapolation \
            --max-steps 12000 --tolerance 2e-5
      - name: Verify Stage 33 reproducibility and scientific endpoint
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np

          summary = json.load(open('/tmp/stage33_spatial_extrapolation/summary.json'))
          assert summary['stage'] == 33
          cfg = summary['configuration']
          assert cfg['kn0'] == 0.1
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['grids'] == [[24, 24], [30, 30], [36, 36]]
          assert cfg['quadrature'] == 'spherical_matched_r16_mu12_phi24'
          assert cfg['velocity_point_count'] == 4608
          assert cfg['transport'] == 'first-order upwind'
          assert cfg['collision'] == 'Shakhov'
          assert cfg['observable'] == 'linear_extrapolated_wall'
          assert cfg['physical_parameter_retuning'] is False
          assert len(summary['rows']) == 3
          for row in summary['rows']:
              for key in (
                  'final_change', 'predicted_qav', 'literature_qav',
                  'qav_relative_error', 'wall_mass_balance_relative_error',
                  'minimum_distribution', 'minimum_temperature',
                  'maximum_temperature', 'work_proxy',
              ):
                  assert math.isfinite(row[key])
              assert row['minimum_distribution'] > 0.0
              assert row['minimum_temperature'] > 0.0
              assert row['wall_mass_balance_relative_error'] < 1e-10
              metrics = row['velocity_metrics']
              assert math.isfinite(metrics['relative_rms'])
              assert math.isfinite(metrics['relative_l1'])
              assert 0.0 <= metrics['sign_agreement'] <= 1.0
          extrap = summary['linear_in_h_extrapolation']
          for key in ('predicted_qav_h0', 'qav_slope', 'qav_fit_r2',
                      'qav_relative_error_h0', 'velocity_fit_r2'):
              assert math.isfinite(extrap[key])
          metrics = extrap['velocity_metrics_h0']
          assert math.isfinite(metrics['relative_rms'])
          assert math.isfinite(metrics['relative_l1'])
          assert 0.0 <= metrics['sign_agreement'] <= 1.0
          assert summary['decision'] in {
              'spatial_truncation_explains_most_error_advance_second_order_spherical_kn0p1',
              'asymptotic_limit_retains_model_or_benchmark_discrepancy',
              'not_yet_asymptotic_extend_spatial_sequence_without_retuning',
          }
          arrays = np.load('/tmp/stage33_spatial_extrapolation/fields_and_profiles.npz')
          for grid in ('24x24', '30x30', '36x36'):
              assert np.isfinite(arrays[f'table_velocity_{grid}']).all()
              assert np.isfinite(arrays[f'bottom_heat_flux_{grid}']).all()
              assert np.isfinite(arrays[f'T_{grid}']).all()
          assert np.isfinite(arrays['velocity_profile_h0']).all()
          assert Path('/tmp/stage33_spatial_extrapolation/summary.json').exists()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-asymptotic-spatial-extrapolation
          path: /tmp/stage33_spatial_extrapolation
          retention-days: 30

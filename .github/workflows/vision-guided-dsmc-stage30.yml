name: Vision-guided DSMC Stage 30
on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/reduced_spherical_solver.py'
      - 'vision_guided_dsmc/vgdsmc/velocity_quadrature_audit.py'
      - 'vision_guided_dsmc/tests/test_reduced_spherical_solver.py'
      - 'vision_guided_dsmc/tests/test_velocity_quadrature_audit.py'
      - 'vision_guided_dsmc/pyproject.toml'
      - '.github/workflows/vision-guided-dsmc-stage30.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/reduced_spherical_solver.py'
      - 'vision_guided_dsmc/vgdsmc/velocity_quadrature_audit.py'
      - 'vision_guided_dsmc/tests/test_reduced_spherical_solver.py'
      - 'vision_guided_dsmc/tests/test_velocity_quadrature_audit.py'
      - 'vision_guided_dsmc/pyproject.toml'
      - '.github/workflows/vision-guided-dsmc-stage30.yml'

jobs:
  reduced-spherical-cavity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 30 arbitrary-quadrature solver and Stage 29 rules
        run: pytest -q tests/test_reduced_spherical_solver.py tests/test_velocity_quadrature_audit.py
      - name: Run fixed-physics Cartesian versus spherical cavity comparison
        run: |
          vgdsmc-stage30-reduced-spherical \
            --output-dir /tmp/stage30_reduced_spherical \
            --nx 12 --ny 12 \
            --max-steps 4200 --tolerance 3e-5
      - name: Verify Stage 30 integration contract and scientific endpoint
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np
          summary = json.load(open('/tmp/stage30_reduced_spherical/summary.json'))
          assert summary['stage'] == 30
          cfg = summary['configuration']
          assert cfg['grid'] == [12, 12]
          assert cfg['kn0'] == 1.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['physical_parameter_retuning'] is False
          assert cfg['transport'] == 'first-order upwind'
          assert cfg['collision'] == 'Shakhov'
          assert [row['scheme'] for row in summary['rows']] == [
              'cartesian_midpoint_nv19',
              'spherical_matched_r16_mu12_phi24',
          ]
          for row in summary['rows']:
              assert row['point_count'] > 0
              for key in (
                  'final_change', 'predicted_qav', 'literature_qav',
                  'qav_relative_error', 'wall_velocity_relative_rms',
                  'wall_velocity_sign_agreement', 'wall_mass_balance_relative_error',
                  'minimum_distribution', 'minimum_temperature', 'maximum_temperature',
                  'work_proxy',
              ):
                  assert math.isfinite(row[key])
              assert row['minimum_distribution'] > 0.0
              assert row['minimum_temperature'] > 0.0
              assert row['wall_mass_balance_relative_error'] < 1e-10
          assert summary['decision'] in {
              'extend_spherical_solver_to_kn0_0p1_and_10',
              'audit_wall_observable_and_sign_convention_before_further_physics_runs',
          }
          arrays = np.load('/tmp/stage30_reduced_spherical/fields_and_profiles.npz')
          assert 'T_cartesian_midpoint_nv19' in arrays.files
          assert 'T_spherical_matched_r16_mu12_phi24' in arrays.files
          assert np.isfinite(arrays['T_cartesian_midpoint_nv19']).all()
          assert np.isfinite(arrays['T_spherical_matched_r16_mu12_phi24']).all()
          assert Path('/tmp/stage30_reduced_spherical/summary.json').exists()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage30-reduced-spherical-cavity
          path: /tmp/stage30_reduced_spherical
          retention-days: 30

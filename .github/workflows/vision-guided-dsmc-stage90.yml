name: Vision-guided DSMC Stage 90

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage90_single_condition_reconstruction_solver_ab_audit.py'
      - 'vision_guided_dsmc/tests/test_stage90_single_condition_reconstruction_solver_ab_audit.py'
      - 'vision_guided_dsmc/results/stage89_boundary_reconstruction_admissibility_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage90.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage90_single_condition_reconstruction_solver_ab_audit.py'
      - 'vision_guided_dsmc/tests/test_stage90_single_condition_reconstruction_solver_ab_audit.py'
      - 'vision_guided_dsmc/results/stage89_boundary_reconstruction_admissibility_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage90.yml'

permissions:
  actions: read
  contents: read

jobs:
  single-condition-reconstruction-solver-ab-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 90 and retained frozen-audit endpoints
        run: |
          pytest -q \
            tests/test_stage90_single_condition_reconstruction_solver_ab_audit.py \
            tests/test_stage89_boundary_reconstruction_admissibility_audit.py \
            tests/test_stage88_full_moment_boundary_counterfactual_audit.py \
            tests/test_stage87_one_sided_boundary_slope_counterfactual_audit.py \
            tests/test_stage86_boundary_reconstruction_stencil_activation_audit.py \
            tests/test_stage85_near_wall_face_amplitude_suppression_audit.py \
            tests/test_stage84_wall_normal_sign_lobe_geometry_audit.py \
            tests/test_stage83_opposite_sector_spatial_cancellation_localization_audit.py \
            tests/test_stage82_within_sector_angular_coherence_audit.py \
            tests/test_stage81_dominant_node_individual_ordinate_audit.py \
            tests/test_stage80_dominant_shell_radial_node_angular_attribution_audit.py \
            tests/test_stage79_dominant_moment_radial_angular_gradient_audit.py \
            tests/test_stage78_face_gradient_moment_attribution_audit.py \
            tests/test_stage77_common_frame_face_flux_divergence_audit.py \
            tests/test_stage76_local_velocity_frame_jump_audit.py \
            tests/test_stage75_signed_face_location_velocity_moment_audit.py \
            tests/test_stage74_radial_speed_shell_opposite_sector_cancellation_audit.py \
            tests/test_stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit.py \
            tests/test_stage72_directional_transport_component_audit.py \
            tests/test_stage71_wall_layer_interior_face_transport_attribution_audit.py \
            tests/test_stage70_independent_wall_face_flux_discretization_audit.py \
            tests/test_stage69_frozen_grid_transfer_residual_scaling_audit.py \
            tests/test_stage68_independent_transport_operator_residual_audit.py \
            tests/test_stage67_frozen_full_distribution_residual_decomposition.py \
            tests/test_stage66_frozen_collision_source_observable_audit.py \
            tests/test_stage65_local_clipping_activation_map_audit.py \
            tests/test_stage64_source_step_consistency_audit.py \
            tests/test_stage63_collision_target_equivalence_audit.py \
            tests/test_stage62_finite_kn_normalization_audit.py \
            tests/test_stage60_transport_wall_equation_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 89 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage89-boundary-reconstruction-admissibility-audit
          path: /tmp/stage89_boundary_reconstruction_admissibility_audit
          run-id: 31272829723
          github-token: ${{ github.token }}
      - name: Run frozen Stage 90 nonlinear reconstruction A/B solver audit
        run: |
          python -m vgdsmc.stage90_single_condition_reconstruction_solver_ab_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage89-artifact-dir /tmp/stage89_boundary_reconstruction_admissibility_audit \
            --output-dir /tmp/stage90_single_condition_reconstruction_solver_ab_audit
      - name: Verify fixed A/B design, benchmark reporting and negative-result guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage90_single_condition_reconstruction_solver_ab_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 90
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['baseline_boundary_slope'] == 'zero'
          assert cfg['counterfactual_boundary_slope'] == 'one_sided_first_difference_x_only'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['max_iterations'] == 3000
          assert cfg['minimum_iterations'] == 500
          assert cfg['check_interval'] == 25
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['material_benchmark_improvement_guard'] == 0.10
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          for arm_name in ('zero_boundary_slope', 'one_sided_boundary_slope'):
              arm = summary[arm_name]
              assert arm['iterations'] <= 3000
              assert isinstance(arm['converged'], bool)
              assert isinstance(arm['finite'], bool)
              assert np.isfinite(arm['predicted_qav']) or not arm['finite']
              assert arm['literature_qav'] == 0.179
              assert arm['qav_relative_error'] >= 0.0 or not arm['finite']
              assert arm['velocity_metrics']['relative_rms'] >= 0.0 or not arm['finite']

          allowed = {
              'stage90_material_table3_table6_improvement_stage91_independent_confirmation_before_any_extension',
              'stage90_partial_material_benchmark_improvement_stage91_independent_confirmation_before_any_extension',
              'stage90_no_material_benchmark_improvement_close_boundary_reconstruction_route_stage91_fixed_quadrature_model_form_reconciliation_audit',
              'stage90_nonfinite_solver_blocker_without_retuning',
              'stage90_nonconverged_solver_blocker_without_retuning',
          }
          assert summary['decision'] in allowed
          assert 'failed Stage-28 MUSCL endpoint remains negative' in summary['negative_result_guard']
          for name in ('zero_boundary_slope_endpoint.npz', 'one_sided_boundary_slope_endpoint.npz'):
              with np.load(root / name) as endpoint:
                  assert endpoint['phi'].shape == (64, 64, 3840)
                  assert endpoint['psi'].shape == (64, 64, 3840)
                  assert endpoint['table_velocity'].ndim == 1
                  assert endpoint['bottom_heat_flux'].shape == (64,)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage90-single-condition-reconstruction-solver-ab-audit
          path: /tmp/stage90_single_condition_reconstruction_solver_ab_audit
          retention-days: 30

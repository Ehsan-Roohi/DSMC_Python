name: Vision-guided DSMC Stage 82

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage82_within_sector_angular_coherence_audit.py'
      - 'vision_guided_dsmc/tests/test_stage82_within_sector_angular_coherence_audit.py'
      - 'vision_guided_dsmc/results/stage81_dominant_node_individual_ordinate_attribution_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage82.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage82_within_sector_angular_coherence_audit.py'
      - 'vision_guided_dsmc/tests/test_stage82_within_sector_angular_coherence_audit.py'
      - 'vision_guided_dsmc/results/stage81_dominant_node_individual_ordinate_attribution_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage82.yml'

permissions:
  actions: read
  contents: read

jobs:
  within-sector-angular-coherence-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 82 and retained frozen-audit endpoints
        run: |
          pytest -q \
            tests/test_stage82_within_sector_angular_coherence_audit.py \
            tests/test_stage81_dominant_node_individual_ordinate_audit.py \
            tests/test_stage80_dominant_shell_radial_node_angular_attribution_audit.py \
            tests/test_stage79_dominant_moment_radial_angular_gradient_audit.py \
            tests/test_stage78_face_gradient_moment_attribution_audit.py \
            tests/test_stage77_common_frame_face_flux_divergence_audit.py \
            tests/test_stage76_local_velocity_frame_jump_audit.py \
            tests/test_stage75_signed_face_location_velocity_moment_audit.py \
            tests/test_stage74_radial_speed_shell_opposite_sector_cancellation_audit.py \
            tests/test_stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit.py \
            tests/test_stage72_directional_transport_component_audit.py \
            tests/test_stage71_wall_layer_interior_face_transport_attribution_audit.py \
            tests/test_stage70_independent_wall_face_flux_discretization_audit.py \
            tests/test_stage69_frozen_grid_transfer_residual_scaling_audit.py \
            tests/test_stage68_independent_transport_operator_residual_audit.py \
            tests/test_stage67_frozen_full_distribution_residual_decomposition.py \
            tests/test_stage66_frozen_collision_source_observable_audit.py \
            tests/test_stage65_local_clipping_activation_map_audit.py \
            tests/test_stage64_source_step_consistency_audit.py \
            tests/test_stage63_collision_target_equivalence_audit.py \
            tests/test_stage62_finite_kn_normalization_audit.py \
            tests/test_stage60_transport_wall_equation_audit.py
      - name: Download exact completed Stage 81 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage81-dominant-node-individual-ordinate-attribution-audit
          path: /tmp/stage81_dominant_node_individual_ordinate_attribution_audit
          run-id: 31189580849
          github-token: ${{ github.token }}
      - name: Run Stage 82 within-sector angular coherence audit
        run: |
          python -m vgdsmc.stage82_within_sector_angular_coherence_audit \
            --stage81-artifact-dir /tmp/stage81_dominant_node_individual_ordinate_attribution_audit \
            --output-dir /tmp/stage82_within_sector_angular_coherence_audit
      - name: Verify fixed design, closure, and scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage82_within_sector_angular_coherence_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 82
          assert summary['finite'] is True
          assert summary['closure_closed'] is True
          assert not summary['decision'].endswith('blocker')

          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['dominant_moment'] == 'transverse_kinetic'
          assert cfg['dominant_radial_shell'] == 2
          assert cfg['dominant_local_radial_node'] == 1
          assert cfg['dominant_global_radial_node'] == 21
          assert cfg['vertical_oblique_bins'] == [1, 2, 5, 6]
          assert cfg['opposite_sector_pairs'] == [[1, 5], [2, 6]]
          assert cfg['weighted_adjacent_coherence_guard'] == 0.90
          assert cfg['sector_internal_retention_guard'] == 0.75
          assert cfg['solver_rerun_count'] == 0
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          closure = summary['vertical_sector_reconstruction_closure']
          assert closure['face_relative_l2_error'] <= 1e-10
          assert closure['cell_relative_l2_error'] <= 1e-10
          assert closure['within_guard'] is True

          metrics = summary['within_sector_metrics']
          assert [row['angular_bin'] for row in metrics['sectors']] == [1, 2, 5, 6]
          assert [row['ordinate_count'] for row in metrics['sectors']] == [12, 12, 11, 12]
          assert 0.0 <= metrics['vertical_oblique_cell_divergence_share_within_node'] <= 1.0 + 1e-12
          assert 0.0 <= metrics['vertical_oblique_face_absolute_share_within_node'] <= 1.0 + 1e-12
          assert -1.0 <= metrics['minimum_sector_cell_weighted_adjacent_coherence'] <= 1.0
          assert 0.0 <= metrics['minimum_sector_cell_internal_retention_ratio'] <= 1.0 + 1e-12

          with np.load(root / 'within_sector_angular_coherence_maps.npz') as maps:
              assert maps['sector_face_groups'].shape == (4, 64, 63)
              assert maps['sector_cell_divergence_groups'].shape == (4, 64, 64)
              assert np.all(np.isfinite(maps['sector_face_groups']))
              assert np.all(np.isfinite(maps['sector_cell_divergence_groups']))
              assert np.array_equal(maps['vertical_oblique_bins'], [1, 2, 5, 6])
              assert np.array_equal(maps['sector_ordinate_counts'], [12, 12, 11, 12])

          assert 'not an adjoint sensitivity' in summary['negative_findings'][0]
          assert 'does not constitute physical validation' in summary['negative_findings'][1]
          assert 'failed Stage-28 MUSCL' in summary['negative_findings'][2]
          assert 'no cavity solver is rerun' in summary['negative_findings'][3]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage82-within-sector-angular-coherence-audit
          path: /tmp/stage82_within_sector_angular_coherence_audit
          retention-days: 30

name: Vision-guided DSMC Stage 36

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage36_high_resolution_cross_kn.py'
      - 'vision_guided_dsmc/tests/test_stage36_high_resolution_cross_kn.py'
      - '.github/workflows/vision-guided-dsmc-stage36.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage36_high_resolution_cross_kn.py'
      - 'vision_guided_dsmc/tests/test_stage36_high_resolution_cross_kn.py'
      - '.github/workflows/vision-guided-dsmc-stage36.yml'

jobs:
  high-resolution-cross-kn:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 36 and retained corrected-mapping infrastructure
        run: |
          pytest -q \
            tests/test_stage36_high_resolution_cross_kn.py \
            tests/test_stage35_coordinate_covariance.py \
            tests/test_stage34_velocity_scale_consistency.py \
            tests/test_reduced_spherical_solver.py
      - name: Run fixed high-resolution corrected-mapping case matrix
        run: |
          python -m vgdsmc.stage36_high_resolution_cross_kn \
            --output-dir /tmp/stage36_high_resolution_cross_kn \
            --max-steps 14000 --tolerance 2e-5
      - name: Verify exact design and retain positive or negative endpoint
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage36_high_resolution_cross_kn')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 36
          cfg = summary['configuration']
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['quadrature'] == 'spherical_matched_r16_mu12_phi24'
          assert cfg['velocity_point_count'] == 4608
          assert cfg['relaxation_mapping'] == 'sqrt(2)*Kn0/sqrt(pi) in c0 coordinates'
          assert cfg['transport'] == 'first-order upwind'
          assert cfg['collision'] == 'Shakhov'
          assert cfg['wall_observable'] == 'linear_extrapolated_wall'
          assert cfg['physical_parameter_retuning'] is False
          expected = [
              ('kn0p1_24x24', 0.1, [24, 24]),
              ('kn0p1_36x36', 0.1, [36, 36]),
              ('kn1p0_24x24', 1.0, [24, 24]),
              ('kn10p0_24x24', 10.0, [24, 24]),
          ]
          assert [
              (row['case'], row['kn0'], row['grid']) for row in summary['rows']
          ] == expected
          for row in summary['rows']:
              for key in (
                  'final_change', 'predicted_qav', 'literature_qav',
                  'qav_relative_error', 'wall_mass_balance_relative_error',
                  'minimum_distribution', 'minimum_temperature',
                  'maximum_temperature', 'work_proxy',
              ):
                  assert math.isfinite(row[key])
              metrics = row['velocity_metrics']
              for key in ('relative_rms', 'sign_agreement'):
                  assert math.isfinite(metrics[key])
              comparison = row['comparison_to_stage35_12x12']
              for key in ('qav_error_ratio', 'velocity_error_ratio',
                          'sign_agreement_change'):
                  assert math.isfinite(comparison[key])
              assert row['wall_mass_balance_relative_error'] < 1e-10
              assert row['minimum_distribution'] > 0.0
              assert row['minimum_temperature'] > 0.0
          assert math.isfinite(summary['low_kn_profile_change_24x24_to_36x36'])
          assert summary['decision'] in {
              'cross_kn_quantitative_support_advance_independent_reference_stage37',
              'high_kn_supported_low_kn_requires_transport_or_collision_audit_stage37',
              'high_resolution_nonconvergence_requires_numerical_stability_audit_stage37',
              'high_resolution_retains_cross_kn_discrepancy_stage37_model_observable_audit',
          }
          arrays = np.load(root / 'fields_and_profiles.npz')
          for token in (
              'kn0p1_24x24', 'kn0p1_36x36',
              'kn1p0_24x24', 'kn10p0_24x24',
          ):
              assert np.isfinite(arrays[f'table_velocity_{token}']).all()
              assert np.isfinite(arrays[f'bottom_heat_flux_{token}']).all()
              assert np.isfinite(arrays[f'residual_history_{token}']).all()
              assert np.isfinite(arrays[f'T_{token}']).all()
              assert np.isfinite(arrays[f'rho_{token}']).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage36-high-resolution-cross-kn
          path: /tmp/stage36_high_resolution_cross_kn
          retention-days: 30

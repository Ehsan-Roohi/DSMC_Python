name: Vision-guided DSMC Stage 47

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage47_projected_polar_48x48_confirmation.py'
      - 'vision_guided_dsmc/tests/test_stage47_projected_polar_48x48_confirmation.py'
      - 'vision_guided_dsmc/results/stage46_projected_polar_40x40_confirmation_summary.json'
      - '.github/workflows/vision-guided-dsmc-stage47.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage47_projected_polar_48x48_confirmation.py'
      - 'vision_guided_dsmc/tests/test_stage47_projected_polar_48x48_confirmation.py'
      - 'vision_guided_dsmc/results/stage46_projected_polar_40x40_confirmation_summary.json'
      - '.github/workflows/vision-guided-dsmc-stage47.yml'

jobs:
  projected-polar-48x48-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 47 and retained projected-polar infrastructure
        run: |
          pytest -q \
            tests/test_stage47_projected_polar_48x48_confirmation.py \
            tests/test_stage46_projected_polar_40x40_confirmation.py \
            tests/test_stage45_projected_polar_32x32_confirmation.py \
            tests/test_stage44_projected_polar_finer_grid_sequence.py \
            tests/test_stage43_projected_polar_resolution_sequence.py \
            tests/test_stage42_projected_polar_heated_cavity_pilot.py \
            tests/test_stage40_external_benchmark_fidelity_audit.py \
            tests/test_reduced_spherical_solver.py
      - name: Run frozen Stage 47 48x48 confirmation
        run: |
          python -m vgdsmc.stage47_projected_polar_48x48_confirmation \
            --output-dir /tmp/stage47_projected_polar_48x48_confirmation
      - name: Verify exact provenance, frozen design and retained endpoint
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage47_projected_polar_48x48_confirmation')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 47

          retained = summary['retained_stage46_endpoint']
          assert retained['workflow_run_id'] == 30753260337
          assert retained['workflow_job_id'] == 91510943443
          assert retained['tests_passed'] == 45
          assert retained['tests_failed'] == 0
          assert retained['artifact_id'] == 8835645496
          assert retained['artifact_sha256'] == (
              '384af3378996f74f7f17905f064c86c9aa702cbb2f86549cacef3998f24886e8'
          )
          assert retained['source_head_sha'] == (
              '9a7d48b7925b404513f1e2b40cff3c9588c60ce0'
          )
          assert retained['decision'] == (
              'projected_polar_40x40_improving_not_converged_'
              'stage47_48x48_confirmation'
          )

          cfg = summary['configuration']
          assert cfg['kn0'] == 0.1
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['grid'] == [48, 48]
          assert cfg['combined_sequence_grids'] == [20, 24, 32, 40, 48]
          assert cfg['polar_rule'] == {
              'radial_nodes': 32,
              'angular_nodes': 96,
              'point_count': 3072,
          }
          assert cfg['prandtl'] == 2.0 / 3.0
          assert cfg['shakhov_correction_floor'] == 0.05
          assert cfg['transport_iteration'] == 'steady_first_order_upwind_jacobi'
          assert cfg['collision'] == 'projected_shakhov'
          assert cfg['relaxation_mapping'] == (
              'sqrt(2)*Kn0/sqrt(pi) in c0 coordinates'
          )
          assert cfg['source_relaxation'] == 1.0
          assert cfg['max_iterations'] == 3000
          assert cfg['minimum_iterations'] == 500
          assert cfg['check_interval'] == 25
          assert cfg['tolerance'] == 2e-5
          assert cfg['physical_parameter_retuning'] is False
          assert cfg['velocity_quadrature_retuning'] is False

          case = summary['new_case']
          assert case['grid'] == [48, 48]
          assert case['finite'] is True
          assert case['minimum_phi'] > 0.0
          assert case['minimum_psi'] > 0.0
          assert case['wall_mass_balance_relative_error'] < 1e-10
          assert 1 <= case['iterations'] <= 3000
          for key in (
              'final_change', 'predicted_qav', 'literature_qav',
              'qav_relative_error', 'wall_mass_balance_relative_error',
              'minimum_phi', 'minimum_psi',
              'maximum_phi_clipped_weight_fraction',
              'maximum_psi_clipped_weight_fraction', 'work_proxy',
          ):
              assert math.isfinite(case[key])
          for value in case['velocity_metrics'].values():
              assert math.isfinite(value)
          assert np.isfinite(case['table_velocity']).all()

          for key, value in summary['finest_grid_changes'].items():
              if isinstance(value, bool):
                  continue
              assert math.isfinite(value)

          extrapolation = summary['linear_h_extrapolation']
          for key, value in extrapolation.items():
              if isinstance(value, list):
                  assert np.isfinite(value).all()
              elif isinstance(value, str):
                  continue
              else:
                  assert math.isfinite(value)

          assert summary['decision'] in {
              'projected_polar_48x48_converging_stage48_cross_kn_extension',
              'projected_polar_48x48_improving_not_converged_stage48_56x56_confirmation',
              'projected_polar_48x48_heat_flux_only_improves_stage48_wall_observable_audit',
              'projected_polar_48x48_velocity_only_improves_stage48_heat_flux_definition_audit',
              'projected_polar_48x48_nonmonotonic_stage48_space_velocity_coupling_audit',
              'stage47_48x48_blocker',
          }

          arrays = np.load(root / 'fields_and_profiles.npz')
          for key in arrays.files:
              assert np.isfinite(arrays[key]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage47-projected-polar-48x48-confirmation
          path: /tmp/stage47_projected_polar_48x48_confirmation
          retention-days: 30

name: Vision-guided DSMC Stage 89

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage89_boundary_reconstruction_admissibility_audit.py'
      - 'vision_guided_dsmc/tests/test_stage89_boundary_reconstruction_admissibility_audit.py'
      - 'vision_guided_dsmc/results/stage88_full_moment_boundary_counterfactual_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage89.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage89_boundary_reconstruction_admissibility_audit.py'
      - 'vision_guided_dsmc/tests/test_stage89_boundary_reconstruction_admissibility_audit.py'
      - 'vision_guided_dsmc/results/stage88_full_moment_boundary_counterfactual_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage89.yml'

permissions:
  actions: read
  contents: read

jobs:
  boundary-reconstruction-admissibility-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 89 and retained frozen-audit endpoints
        run: |
          pytest -q \
            tests/test_stage89_boundary_reconstruction_admissibility_audit.py \
            tests/test_stage88_full_moment_boundary_counterfactual_audit.py \
            tests/test_stage87_one_sided_boundary_slope_counterfactual_audit.py \
            tests/test_stage86_boundary_reconstruction_stencil_activation_audit.py \
            tests/test_stage85_near_wall_face_amplitude_suppression_audit.py \
            tests/test_stage84_wall_normal_sign_lobe_geometry_audit.py \
            tests/test_stage83_opposite_sector_spatial_cancellation_localization_audit.py \
            tests/test_stage82_within_sector_angular_coherence_audit.py \
            tests/test_stage81_dominant_node_individual_ordinate_audit.py \
            tests/test_stage80_dominant_shell_radial_node_angular_attribution_audit.py \
            tests/test_stage79_dominant_moment_radial_angular_gradient_audit.py \
            tests/test_stage78_face_gradient_moment_attribution_audit.py \
            tests/test_stage77_common_frame_face_flux_divergence_audit.py \
            tests/test_stage76_local_velocity_frame_jump_audit.py \
            tests/test_stage75_signed_face_location_velocity_moment_audit.py \
            tests/test_stage74_radial_speed_shell_opposite_sector_cancellation_audit.py \
            tests/test_stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit.py \
            tests/test_stage72_directional_transport_component_audit.py \
            tests/test_stage71_wall_layer_interior_face_transport_attribution_audit.py \
            tests/test_stage70_independent_wall_face_flux_discretization_audit.py \
            tests/test_stage69_frozen_grid_transfer_residual_scaling_audit.py \
            tests/test_stage68_independent_transport_operator_residual_audit.py \
            tests/test_stage67_frozen_full_distribution_residual_decomposition.py \
            tests/test_stage66_frozen_collision_source_observable_audit.py \
            tests/test_stage65_local_clipping_activation_map_audit.py \
            tests/test_stage64_source_step_consistency_audit.py \
            tests/test_stage63_collision_target_equivalence_audit.py \
            tests/test_stage62_finite_kn_normalization_audit.py \
            tests/test_stage60_transport_wall_equation_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 88 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage88-full-moment-boundary-counterfactual-audit
          path: /tmp/stage88_full_moment_boundary_counterfactual_audit
          run-id: 31260169074
          github-token: ${{ github.token }}
      - name: Run Stage 89 boundary reconstruction admissibility audit
        run: |
          python -m vgdsmc.stage89_boundary_reconstruction_admissibility_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage88-artifact-dir /tmp/stage88_full_moment_boundary_counterfactual_audit \
            --output-dir /tmp/stage89_boundary_reconstruction_admissibility_audit
      - name: Verify fixed design, local admissibility metrics and scientific scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage89_boundary_reconstruction_admissibility_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 89
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['counterfactual_boundary_slope'] == 'one_sided_first_difference'
          assert cfg['solver_rerun_count'] == 0
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          metrics = summary['admissibility_metrics']
          assert len(metrics['state_rows']) == 4
          assert len(metrics['moment_rows']) == 2
          assert all(row['field'] in {'phi', 'psi'} for row in metrics['state_rows'])
          assert all(row['side'] in {'left', 'right'} for row in metrics['state_rows'])
          allowed = {
              'stage89_local_admissibility_closes_stage90_single_condition_reconstruction_solver_ab_audit',
              'stage89_nonfinite_reconstruction_admissibility_blocker',
              'stage89_counterfactual_halfspace_scope_leakage_blocker',
              'stage89_candidate_nonnegativity_blocker_stage90_negativity_origin_audit',
              'stage89_neighbor_bound_overshoot_blocker_stage90_overshoot_origin_audit',
              'stage89_midpoint_reconstruction_closure_blocker',
              'stage89_reduced_moment_linearity_closure_blocker',
          }
          assert summary['decision'] in allowed
          with np.load(root / 'boundary_reconstruction_admissibility_profiles.npz') as profiles:
              assert profiles['moment_names'].shape == (5,)
              for side in ('left', 'right'):
                  assert profiles[f'{side}_baseline_full_moments'].shape == (64, 5)
                  assert profiles[f'{side}_counterfactual_full_moments'].shape == (64, 5)
                  assert profiles[f'{side}_candidate_active_moments'].shape == (64, 5)
                  assert profiles[f'{side}_reference_active_moments'].shape == (64, 5)
                  assert profiles[f'{side}_phi_counterfactual_min_by_row'].shape == (64,)
                  assert profiles[f'{side}_psi_counterfactual_min_by_row'].shape == (64,)
          assert 'does not establish nonlinear solver stability' in summary['negative_findings'][0]
          assert 'failed Stage-28 MUSCL' in summary['negative_findings'][2]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage89-boundary-reconstruction-admissibility-audit
          path: /tmp/stage89_boundary_reconstruction_admissibility_audit
          retention-days: 30

name: Vision-guided DSMC Stage 144

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage144_positive_lobe_shape_audit.py'
      - 'vision_guided_dsmc/tests/test_stage144_positive_lobe_shape_audit.py'
      - 'vision_guided_dsmc/results/stage143_positive_lobe_scale_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage144.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage144_positive_lobe_shape_audit.py'
      - 'vision_guided_dsmc/tests/test_stage144_positive_lobe_shape_audit.py'
      - 'vision_guided_dsmc/results/stage143_positive_lobe_scale_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage144.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  positive-lobe-shape-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 142-144 fixed-design guards
        run: |
          pytest -q \
            tests/test_stage142_sampled_sign_margin_audit.py \
            tests/test_stage143_positive_lobe_scale_audit.py \
            tests/test_stage144_positive_lobe_shape_audit.py
      - name: Download exact completed Stage 143 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage143-positive-lobe-scale-audit
          path: /tmp/stage143_positive_lobe_scale_audit
          run-id: 32300755939
          github-token: ${{ github.token }}
      - name: Verify exact Stage 143 payload digests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage143_positive_lobe_scale_audit/summary.json': 'a2ad7ae79afec2135adebe4182dc9c9ec6c05b69d0951c9f34db0e6ee8f91722',
              '/tmp/stage143_positive_lobe_scale_audit/positive_lobe_scale.npz': '0d71eee395b623cb7f9470f06863ae71cd5c4aa64f64bde979b43b8360d7e44a',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 144 positive-lobe shape audit
        run: |
          python -m vgdsmc.stage144_positive_lobe_shape_audit \
            --stage143-dir /tmp/stage143_positive_lobe_scale_audit \
            --stage143-record results/stage143_positive_lobe_scale_audit_observed.json \
            --output-dir /tmp/stage144_positive_lobe_shape_audit
      - name: Verify Stage 144 scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage144_positive_lobe_shape_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 144
          assert summary['finite'] is True
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['interior_grid'] == [56, 56]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['correction_floor'] == 0.05
          assert cfg['witness_node'] == 9
          assert cfg['pair_sectors'] == [5, 6]
          assert cfg['dominant_mirrored_sector'] == 6
          assert cfg['dominant_deviation_energy_share_min'] == 0.75
          assert cfg['leave_one_out_cv_reduction_min'] == 0.50
          assert cfg['material_relative_deviation_min'] == 0.25
          assert cfg['positive_lobe_shape_used_for_solver'] is False
          assert cfg['solver_rerun'] is False
          assert cfg['solver_endpoint_advanced'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['benchmark_or_validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          agg = summary['aggregate']
          assert agg['parent_record_ok'] is True
          assert agg['parent_route_ok'] is True
          assert agg['sufficient_support'] is True
          assert agg['maximum_parent_metric_closure'] <= 1.0e-12
          allowed = {
              'stage144_single_sample_dominated_positive_lobe_trough_stage145_trough_persistence_audit',
              'stage144_single_sample_dominated_positive_lobe_peak_stage145_peak_persistence_audit',
              'stage144_distributed_positive_lobe_shape_stage145_distributed_shape_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'Stage 90 remains nonconverged' in summary['negative_result_guard']
          assert 'diagnostics, not solver parameters' in summary['negative_result_guard']
          with np.load(root / 'positive_lobe_shape.npz') as data:
              assert data['later_positive_depth'].shape == (4,)
              assert data['later_positive_values'].shape == (4,)
              assert data['median_normalized_profile'].shape == (4,)
              assert data['deviation_energy_fraction'].shape == (4,)
              assert data['leave_one_out_cv'].shape == (4,)
              assert np.isfinite(data['median_normalized_profile']).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage144-positive-lobe-shape-audit
          path: /tmp/stage144_positive_lobe_shape_audit
          retention-days: 30

name: Vision-guided DSMC Stage 138

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage138_channel_rate_origin_audit.py'
      - 'vision_guided_dsmc/tests/test_stage138_channel_rate_origin_audit.py'
      - 'vision_guided_dsmc/results/stage137_right_lobe_decay_shape_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage138.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage138_channel_rate_origin_audit.py'
      - 'vision_guided_dsmc/tests/test_stage138_channel_rate_origin_audit.py'
      - 'vision_guided_dsmc/results/stage137_right_lobe_decay_shape_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage138.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  channel-rate-origin-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 137-138 fixed-design guards
        run: |
          pytest -q \
            tests/test_stage137_right_lobe_decay_shape_audit.py \
            tests/test_stage138_channel_rate_origin_audit.py
      - name: Download exact completed Stage 136 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage136-right-lobe-depth-support-audit
          path: /tmp/stage136_right_lobe_depth_support_audit
          run-id: 32140741740
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 137 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage137-right-lobe-decay-shape-audit
          path: /tmp/stage137_right_lobe_decay_shape_audit
          run-id: 32141400728
          github-token: ${{ github.token }}
      - name: Verify exact Stage 136-137 payload digests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage136_right_lobe_depth_support_audit/summary.json': 'eaf3706b2c7bca1678b0680dcf06daa076ccd36eeb91dccb9b8602bd8378b64c',
              '/tmp/stage136_right_lobe_depth_support_audit/right_lobe_depth_support.npz': 'f8829d07450f3832dc45a878943ac69415390e89208f9bb859e838fa9c160015',
              '/tmp/stage137_right_lobe_decay_shape_audit/summary.json': '1a655f9761d021def68996d4848508f7b035db82b584d11d3464eaa455a5a5f5',
              '/tmp/stage137_right_lobe_decay_shape_audit/right_lobe_decay_shape.npz': '05a8119eaf668aee355194428840596baacc79a79eb88446351bc2143ad5d3b6',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 138 fixed signed channel-rate origin audit
        run: |
          python -m vgdsmc.stage138_channel_rate_origin_audit \
            --stage136-dir /tmp/stage136_right_lobe_depth_support_audit \
            --stage137-dir /tmp/stage137_right_lobe_decay_shape_audit \
            --stage137-record results/stage137_right_lobe_decay_shape_audit_observed.json \
            --output-dir /tmp/stage138_channel_rate_origin_audit
      - name: Verify Stage 138 scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage138_channel_rate_origin_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 138
          assert summary['finite'] is True
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['interior_grid'] == [56, 56]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['correction_floor'] == 0.05
          assert cfg['witness_node'] == 9
          assert cfg['pair_sectors'] == [5, 6]
          assert cfg['dominant_mirrored_sector'] == 6
          assert cfg['rate_identity_closure_max'] == 1.0e-12
          assert cfg['rate_split_explained_fraction_min'] == 0.95
          assert cfg['ratio_swing_min'] == 0.25
          assert cfg['endpoint_cancellation_fraction_min'] == 0.25
          assert cfg['signed_complement_used_for_solver'] is False
          assert cfg['diagnostic_decay_fit_used_for_solver'] is False
          assert cfg['solver_rerun'] is False
          assert cfg['solver_endpoint_advanced'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['benchmark_or_validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          assert summary['aggregate']['maximum_parent_profile_closure'] <= 1.0e-12
          assert summary['aggregate']['parent_record_ok'] is True
          assert summary['aggregate']['rate_identity_closure'] <= 1.0e-12
          allowed = {
              'stage138_depth_varying_complement_cancellation_stage139_complement_transition_geometry_audit',
              'stage138_same_sign_mixture_rate_split_stage139_mixture_weight_gradient_audit',
              'stage138_unresolved_rate_origin_stage139_signed_channel_residual_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'Stage 90 remains nonconverged' in summary['negative_result_guard']
          assert 'not a solver parameter' in summary['negative_result_guard']
          with np.load(root / 'channel_rate_origin.npz') as data:
              for key in (
                  'right_depth', 'dominant_signed', 'parent_signed', 'complement_signed',
                  'complement_to_dominant_ratio', 'mixing_factor',
                  'pointwise_cancellation_fraction', 'mixing_log_linear_fit',
              ):
                  assert data[key].shape == (7,)
                  assert np.isfinite(data[key]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage138-channel-rate-origin-audit
          path: /tmp/stage138_channel_rate_origin_audit
          retention-days: 30

# Explicit Stage 138 launch touch; no scientific guard or numerical parameter changed.

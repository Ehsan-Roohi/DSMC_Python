name: Vision-guided DSMC Stage 151

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage151_outer_interval_asymmetry_audit.py'
      - 'vision_guided_dsmc/tests/test_stage151_outer_interval_asymmetry_audit.py'
      - 'vision_guided_dsmc/results/stage150_channel_sign_transition_localization_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage151.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage151_outer_interval_asymmetry_audit.py'
      - 'vision_guided_dsmc/tests/test_stage151_outer_interval_asymmetry_audit.py'
      - 'vision_guided_dsmc/results/stage150_channel_sign_transition_localization_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage151.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  outer-interval-asymmetry-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 150-151 fixed-design guards
        run: |
          pytest -q \
            tests/test_stage150_channel_sign_transition_localization_audit.py \
            tests/test_stage151_outer_interval_asymmetry_audit.py
      - name: Download exact completed Stage 150 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage150-channel-sign-transition-localization-audit
          path: /tmp/stage150_channel_sign_transition_localization_audit
          run-id: 32431079197
          github-token: ${{ github.token }}
      - name: Verify exact Stage 150 parent payload digests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage150_channel_sign_transition_localization_audit/summary.json': 'fbabcb9d83d008b0d52b96ea80c546636461c150a821a713cf773bfe31f7376a',
              '/tmp/stage150_channel_sign_transition_localization_audit/channel_sign_transition_localization.npz': '5e841e56d1d22d82fd73f9bfd6193857dc65b2ac42849ced065b273d264dc5c0',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 151 fixed outer-interval asymmetry audit
        run: |
          python -m vgdsmc.stage151_outer_interval_asymmetry_audit \
            --stage150-dir /tmp/stage150_channel_sign_transition_localization_audit \
            --stage150-record results/stage150_channel_sign_transition_localization_audit_observed.json \
            --output-dir /tmp/stage151_outer_interval_asymmetry_audit
      - name: Verify Stage 151 scientific guards
        run: |
          python - <<'PY'
          import json
          import numpy as np
          from pathlib import Path
          root = Path('/tmp/stage151_outer_interval_asymmetry_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 151 and summary['finite'] is True
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64] and cfg['interior_grid'] == [56, 56]
          assert cfg['kn0'] == 10.0 and cfg['cold_hot_ratio'] == 0.1 and cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0 and cfg['limiter'] == 'minmod' and cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0 and cfg['correction_floor'] == 0.05
          assert cfg['witness_node'] == 9 and cfg['pair_sectors'] == [5, 6] and cfg['dominant_mirrored_sector'] == 6
          assert cfg['combined_side_dominance_min'] == 0.75 and cfg['asymmetry_metrics_used_for_solver'] is False
          assert cfg['solver_rerun'] is False and cfg['solver_endpoint_advanced'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False and cfg['benchmark_or_validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'): assert value is False
          agg = summary['aggregate']
          assert agg['stage150_record_ok'] is True and agg['parent_route_ok'] is True
          assert agg['both_sides_cross_channel_opposed'] is True
          assert agg['opposite_asymmetry_orientation'] is True
          assert agg['combined_stronger_side'] == 'left'
          assert agg['combined_stronger_absolute_share'] >= 0.75
          assert agg['maximum_identity_or_provenance_error'] <= 1e-12
          assert summary['decision'] in {
              'stage151_opposed_channels_recombine_to_single_side_dominance_stage152_left_outer_channel_balance_audit',
              'stage151_distributed_outer_asymmetry_stage152_five_point_scale_balance_audit',
          }
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'Stage 90 remains nonconverged' in summary['negative_result_guard']
          assert 'diagnostics, not solver parameters' in summary['negative_result_guard']
          with np.load(root / 'outer_interval_asymmetry.npz') as data:
              assert data['dominant_outer_increments'].shape == (2,)
              assert data['parent_outer_increments'].shape == (2,)
              assert data['combined_outer_increments'].shape == (2,)
              assert data['sidewise_channel_sign_products'].tolist() == [-1, -1]
              assert np.isfinite(data['asymmetry_indices']).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage151-outer-interval-asymmetry-audit
          path: /tmp/stage151_outer_interval_asymmetry_audit
          retention-days: 30

name: Vision-guided DSMC Stage 142

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage142_sampled_sign_margin_audit.py'
      - 'vision_guided_dsmc/tests/test_stage142_sampled_sign_margin_audit.py'
      - 'vision_guided_dsmc/results/stage141_node_leverage_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage142.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage142_sampled_sign_margin_audit.py'
      - 'vision_guided_dsmc/tests/test_stage142_sampled_sign_margin_audit.py'
      - 'vision_guided_dsmc/results/stage141_node_leverage_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage142.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  sampled-sign-margin-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 140-142 fixed-design guards
        run: |
          pytest -q \
            tests/test_stage140_local_interpolation_robustness_audit.py \
            tests/test_stage141_node_leverage_audit.py \
            tests/test_stage142_sampled_sign_margin_audit.py
      - name: Download exact completed Stage 141 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage141-node-leverage-audit
          path: /tmp/stage141_node_leverage_audit
          run-id: 32245156606
          github-token: ${{ github.token }}
      - name: Verify exact Stage 141 payload digests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage141_node_leverage_audit/summary.json': '17b00cb49902b727cc45510068f147d2864a953f0ec164cce4fd1fde686b3a45',
              '/tmp/stage141_node_leverage_audit/node_leverage.npz': 'f9fc9181ef480e7d59017a06e08faaddd1711932b114e66822d9d7a7d4dab5e6',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 142 sampled sign-margin audit
        run: |
          python -m vgdsmc.stage142_sampled_sign_margin_audit \
            --stage141-dir /tmp/stage141_node_leverage_audit \
            --stage141-record results/stage141_node_leverage_audit_observed.json \
            --output-dir /tmp/stage142_sampled_sign_margin_audit
      - name: Verify Stage 142 scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage142_sampled_sign_margin_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 142
          assert summary['finite'] is True
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['interior_grid'] == [56, 56]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['correction_floor'] == 0.05
          assert cfg['witness_node'] == 9
          assert cfg['pair_sectors'] == [5, 6]
          assert cfg['dominant_mirrored_sector'] == 6
          assert cfg['weak_endpoint_ratio_max'] == 0.25
          assert cfg['min_positive_run_samples'] == 4
          assert cfg['min_later_positive_sign_coherence'] == 1.0
          assert cfg['max_deletion_count'] == 3
          assert cfg['sampled_sign_margin_used_for_solver'] is False
          assert cfg['counterfactual_root_used_for_solver'] is False
          assert cfg['solver_rerun'] is False
          assert cfg['solver_endpoint_advanced'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['benchmark_or_validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          assert summary['aggregate']['parent_record_ok'] is True
          assert summary['aggregate']['parent_route_ok'] is True
          assert summary['aggregate']['sufficient_support'] is True
          allowed = {
              'stage142_persistent_sampled_sign_with_weak_endpoint_margin_stage143_positive_lobe_scale_audit',
              'stage142_persistent_sampled_sign_with_strong_endpoint_margin_stage143_signed_lobe_balance_audit',
              'stage142_mixed_sampled_sign_support_stage143_transition_support_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'Stage 90 remains nonconverged' in summary['negative_result_guard']
          assert 'diagnostics, not solver parameters' in summary['negative_result_guard']
          with np.load(root / 'sampled_sign_margin.npz') as data:
              assert data['right_depth'].shape == (7,)
              assert data['complement_signed'].shape == (7,)
              assert data['deletion_counts'].shape == (3,)
              assert data['deletion_sign_retained'].shape == (3,)
              assert data['deletion_bracket_widths_cells'].shape == (3,)
              assert np.isfinite(data['right_depth']).all()
              assert np.isfinite(data['complement_signed']).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage142-sampled-sign-margin-audit
          path: /tmp/stage142_sampled_sign_margin_audit
          retention-days: 30

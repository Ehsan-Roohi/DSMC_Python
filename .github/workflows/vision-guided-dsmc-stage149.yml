name: Vision-guided DSMC Stage 149

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage149_channel_scale_separation_audit.py'
      - 'vision_guided_dsmc/tests/test_stage149_channel_scale_separation_audit.py'
      - 'vision_guided_dsmc/results/stage148_sample_scale_curvature_alternation_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage149.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage149_channel_scale_separation_audit.py'
      - 'vision_guided_dsmc/tests/test_stage149_channel_scale_separation_audit.py'
      - 'vision_guided_dsmc/results/stage148_sample_scale_curvature_alternation_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage149.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  channel-scale-separation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 147-149 fixed-design guards
        run: |
          pytest -q \
            tests/test_stage147_dual_channel_neighborhood_audit.py \
            tests/test_stage148_sample_scale_curvature_alternation_audit.py \
            tests/test_stage149_channel_scale_separation_audit.py
      - name: Download exact completed Stage 148 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage148-sample-scale-curvature-alternation-audit
          path: /tmp/stage148_sample_scale_curvature_alternation_audit
          run-id: 32383959503
          github-token: ${{ github.token }}
      - name: Verify exact Stage 148 parent payload digests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage148_sample_scale_curvature_alternation_audit/summary.json': '8b4133b3f344dbb58cb65fb775ee751bb21a3e4b5c5028439e71a7cb1e8a433c',
              '/tmp/stage148_sample_scale_curvature_alternation_audit/sample_scale_curvature.npz': 'da6827b2ad3aa7b1292be4ada264b3a333a822c8198cbbbe6903578a9f835da5',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 149 fixed channel-scale separation audit
        run: |
          python -m vgdsmc.stage149_channel_scale_separation_audit \
            --stage148-dir /tmp/stage148_sample_scale_curvature_alternation_audit \
            --stage148-record results/stage148_sample_scale_curvature_alternation_audit_observed.json \
            --output-dir /tmp/stage149_channel_scale_separation_audit
      - name: Verify Stage 149 scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage149_channel_scale_separation_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 149
          assert summary['finite'] is True
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['interior_grid'] == [56, 56]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['correction_floor'] == 0.05
          assert cfg['witness_node'] == 9
          assert cfg['pair_sectors'] == [5, 6]
          assert cfg['dominant_mirrored_sector'] == 6
          assert cfg['sample_scale_retention_max'] == 0.5
          assert cfg['persistent_channel_retention_min'] == 0.5
          assert cfg['channel_scale_metrics_used_for_solver'] is False
          assert cfg['solver_rerun'] is False
          assert cfg['solver_endpoint_advanced'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['benchmark_or_validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          agg = summary['aggregate']
          assert agg['stage148_record_ok'] is True
          assert agg['parent_route_ok'] is True
          assert agg['maximum_identity_or_provenance_error'] <= 1.0e-12
          allowed = {
              'stage149_coarse_cross_channel_cancellation_stage150_channel_sign_transition_localization_audit',
              'stage149_mixed_component_attenuation_stage150_component_scale_audit',
              'stage149_no_cross_channel_sign_separation_stage150_residual_shape_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'Stage 90 remains nonconverged' in summary['negative_result_guard']
          assert 'diagnostics, not solver parameters' in summary['negative_result_guard']
          with np.load(root / 'channel_scale_separation.npz') as data:
              assert data['fine_center_components'].shape == (3,)
              assert data['coarse_center_components'].shape == (3,)
              assert data['retention'].shape == (3,)
              assert data['cancellation_fraction'].shape == (2,)
              assert data['sign_product'].shape == (2,)
              assert np.isfinite(data['retention']).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage149-channel-scale-separation-audit
          path: /tmp/stage149_channel_scale_separation_audit
          retention-days: 30

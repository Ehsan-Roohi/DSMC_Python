name: Vision-guided DSMC Stage 65

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage65_local_clipping_activation_map_audit.py'
      - 'vision_guided_dsmc/tests/test_stage65_local_clipping_activation_map_audit.py'
      - 'vision_guided_dsmc/results/stage64_source_step_consistency_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage65.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage65_local_clipping_activation_map_audit.py'
      - 'vision_guided_dsmc/tests/test_stage65_local_clipping_activation_map_audit.py'
      - 'vision_guided_dsmc/results/stage64_source_step_consistency_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage65.yml'

permissions:
  actions: read
  contents: read

jobs:
  local-clipping-activation-map-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 65 and retained collision-equation endpoints
        run: |
          pytest -q \
            tests/test_stage65_local_clipping_activation_map_audit.py \
            tests/test_stage64_source_step_consistency_audit.py \
            tests/test_stage63_collision_target_equivalence_audit.py \
            tests/test_stage62_finite_kn_normalization_audit.py \
            tests/test_stage61_characteristic_transport_audit.py
      - name: Download exact completed Stage 64 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage64-source-step-consistency-audit
          path: /tmp/stage64_source_step_consistency_audit
          run-id: 30950873919
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 58 full-cavity artifact
        uses: actions/download-artifact@v4
        with:
          name: stage58-conservative-solver-64x64-confirmation
          path: /tmp/stage58_conservative_solver_64x64_confirmation
          run-id: 30864287564
          github-token: ${{ github.token }}
      - name: Run Stage 65 local clipping activation map audit
        run: |
          python -m vgdsmc.stage65_local_clipping_activation_map_audit \
            --stage64-artifact-dir /tmp/stage64_source_step_consistency_audit \
            --stage58-artifact-dir /tmp/stage58_conservative_solver_64x64_confirmation \
            --output-dir /tmp/stage65_local_clipping_activation_map_audit
      - name: Verify exact provenance, frozen design and guarded localization result
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage65_local_clipping_activation_map_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 65

          retained64 = summary['retained_stage64_endpoint']
          assert retained64['workflow_run_id'] == 30950873919
          assert retained64['workflow_job_id'] == 92132317102
          assert retained64['workflow_conclusion'] == 'success'
          assert retained64['tests_passed'] == 35
          assert retained64['tests_failed'] == 0
          assert retained64['artifact_id'] == 8913290588
          assert retained64['artifact_size_bytes'] == 9374
          assert retained64['artifact_sha256'] == (
              '6e4f94bc03fd53a45d63b007ab6d427e9587e2435add439ebb901f10cd521e1e'
          )
          assert retained64['summary_sha256'] == (
              'e620f120b9a031215279561bc3a89cafca5b55dcbaa3a9c22c04497bb2951c92'
          )

          retained58 = summary['retained_stage58_endpoint']
          assert retained58['workflow_run_id'] == 30864287564
          assert retained58['workflow_job_id'] == 91852659651
          assert retained58['workflow_conclusion'] == 'success'
          assert retained58['tests_passed'] == 72
          assert retained58['tests_failed'] == 0
          assert retained58['artifact_id'] == 8882191150
          assert retained58['artifact_size_bytes'] == 265675
          assert retained58['artifact_sha256'] == (
              'c1e1cb40d35439d44a93bae091f732f35e1790c2c4e3f1180b16d7f8fb54e8f6'
          )
          assert retained58['baseline_fields_sha256'] == (
              '9aa53136e05917236f87fb9279c2ecc4e29d6056ca5ec34ca3bcb4d8f66aa822'
          )

          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['prandtl'] == 2.0 / 3.0
          assert cfg['retained_correction_floor'] == 0.05
          assert cfg['wall_band_layers'] == 4
          assert cfg['solver_rerun'] is False
          assert cfg['conservative_projection_adopted'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          audit = summary['audit']
          assert audit['grid_shape'] == [64, 64]
          decision_metrics = audit['decision_metrics']
          assert decision_metrics['finite'] is True
          assert decision_metrics['material_clipping'] is True
          assert decision_metrics['material_source_defect'] is True
          assert decision_metrics['maximum_clipping_defect_correlation'] >= 0.5
          assert decision_metrics['maximum_wall_band_defect_share'] < 0.60
          assert decision_metrics['maximum_material_cell_fraction'] >= 0.25
          assert audit['clipping']['fraction_cells_with_any_clipping'] == 1.0
          assert audit['clipping']['fraction_cells_with_material_clipping'] == 1.0
          assert audit['local_conserved_defect']['fraction_cells_above_material_threshold'] == 1.0
          assert audit['local_heat_flux_closure_defect']['fraction_cells_above_material_threshold'] == 1.0
          assert math.isclose(
              audit['global_collision_defects']['maximum_conserved_moment_defect'],
              0.04381652170796425,
              rel_tol=1e-12,
              abs_tol=1e-14,
          )
          assert math.isclose(
              audit['global_collision_defects']['heat_flux_closure_relative_l2'],
              0.13468969483031196,
              rel_tol=1e-12,
              abs_tol=1e-14,
          )
          assert summary['decision'] == (
              'stage65_clipping_source_defects_broad_'
              'stage66_frozen_collision_source_observable_audit'
          )
          assert 'does not reconstruct' in summary['interpretation_guard']
          assert summary['scientifically_justified_next_scope']

          with np.load(root / 'local_activation_maps.npz') as maps:
              expected = {
                  'local_conserved_defect',
                  'local_heat_flux_closure_defect',
                  'phi_clipped_weight_fraction',
                  'psi_clipped_weight_fraction',
                  'combined_clipping_weight_fraction',
                  'nondimensional_heat_flux_strength',
                  'wall_distance_layers',
                  'conserved_material_mask',
                  'heat_flux_material_mask',
                  'clipping_material_mask',
              }
              assert set(maps.files) == expected
              for name in maps.files:
                  assert maps[name].shape == (64, 64)
                  assert np.all(np.isfinite(maps[name]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage65-local-clipping-activation-map-audit
          path: /tmp/stage65_local_clipping_activation_map_audit
          retention-days: 30

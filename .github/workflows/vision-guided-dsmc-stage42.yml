name: Vision-guided DSMC Stage 42

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage42_projected_polar_heated_cavity_pilot.py'
      - 'vision_guided_dsmc/tests/test_stage42_projected_polar_heated_cavity_pilot.py'
      - 'vision_guided_dsmc/results/stage41_projected_polar_operator_audit_summary.json'
      - '.github/workflows/vision-guided-dsmc-stage42.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage42_projected_polar_heated_cavity_pilot.py'
      - 'vision_guided_dsmc/tests/test_stage42_projected_polar_heated_cavity_pilot.py'
      - 'vision_guided_dsmc/results/stage41_projected_polar_operator_audit_summary.json'
      - '.github/workflows/vision-guided-dsmc-stage42.yml'

jobs:
  projected-polar-heated-cavity-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 42 and retained projected-polar infrastructure
        run: |
          pytest -q \
            tests/test_stage42_projected_polar_heated_cavity_pilot.py \
            tests/test_stage40_external_benchmark_fidelity_audit.py \
            tests/test_stage39_collision_model_benchmark_audit.py \
            tests/test_stage38_transport_collision_interaction_audit.py \
            tests/test_reduced_spherical_solver.py
      - name: Recheck Stage 41 fine projected-polar operators
        run: |
          python -m vgdsmc.stage41_projected_polar_operator_audit --self-test
      - name: Run fixed Stage 42 heated-cavity pilot
        run: |
          python -m vgdsmc.stage42_projected_polar_heated_cavity_pilot \
            --output-dir /tmp/stage42_projected_polar_heated_cavity_pilot
      - name: Verify frozen design and retain positive and negative endpoints
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage42_projected_polar_heated_cavity_pilot')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 42

          retained = summary['retained_stage41_endpoint']
          assert retained['workflow_run_id'] == 30727704751
          assert retained['workflow_job_id'] == 91442360250
          assert retained['artifact_id'] == 8827830725
          assert retained['artifact_sha256'] == (
              '0ed4c1c99a7424f1aaa67037121a1974c72f5dba1571615cde575f16e8776a05'
          )
          assert retained['decision'] == (
              'projected_polar_operators_pass_stage42_heated_cavity_pilot'
          )

          cfg = summary['configuration']
          assert cfg['kn0'] == 0.1
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['grid'] == [8, 8]
          assert cfg['polar_rule'] == {
              'radial_nodes': 32,
              'angular_nodes': 96,
              'point_count': 3072,
          }
          assert cfg['prandtl'] == 2.0 / 3.0
          assert cfg['shakhov_correction_floor'] == 0.05
          assert cfg['transport_iteration'] == (
              'steady_first_order_upwind_jacobi'
          )
          assert cfg['collision'] == 'projected_shakhov'
          assert cfg['relaxation_mapping'] == (
              'sqrt(2)*Kn0/sqrt(pi) in c0 coordinates'
          )
          assert cfg['source_relaxation'] == 1.0
          assert cfg['max_iterations'] == 3000
          assert cfg['minimum_iterations'] == 500
          assert cfg['check_interval'] == 25
          assert cfg['tolerance'] == 2e-5
          assert cfg['physical_parameter_retuning'] is False
          assert cfg['source_resolution_reproduction'] is False

          result = summary['result']
          for key in (
              'final_change', 'predicted_qav', 'literature_qav',
              'qav_relative_error', 'wall_mass_balance_relative_error',
              'minimum_phi', 'minimum_psi',
              'maximum_phi_clipped_weight_fraction',
              'maximum_psi_clipped_weight_fraction', 'work_proxy',
          ):
              assert math.isfinite(result[key])
          for value in result['velocity_metrics'].values():
              assert math.isfinite(value)
          assert result['finite'] is True
          assert result['minimum_phi'] > 0.0
          assert result['minimum_psi'] > 0.0
          assert result['wall_mass_balance_relative_error'] < 1e-10
          assert 1 <= result['iterations'] <= 3000
          assert summary['decision'] in {
              'projected_polar_pilot_converged_stage43_resolution_sequence',
              'projected_polar_pilot_stable_nonconverged_stage43_iteration_acceleration',
              'projected_polar_heated_cavity_blocker',
          }

          arrays = np.load(root / 'fields_and_profiles.npz')
          for key in (
              'T', 'rho', 'u', 'v', 'qx', 'qy',
              'left_wall_velocity', 'table_velocity',
              'bottom_heat_flux', 'residual_history',
              'quadrature_vx', 'quadrature_vy', 'quadrature_weight',
          ):
              assert np.isfinite(arrays[key]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage42-projected-polar-heated-cavity-pilot
          path: /tmp/stage42_projected_polar_heated_cavity_pilot
          retention-days: 30

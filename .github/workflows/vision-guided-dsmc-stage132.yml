name: Vision-guided DSMC Stage 132

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage132_crossing_phase_transition_width_audit.py'
      - 'vision_guided_dsmc/tests/test_stage132_crossing_phase_transition_width_audit.py'
      - 'vision_guided_dsmc/results/stage131_cross_wall_sector_interaction_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage132.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  crossing-phase-transition-width-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 131-132 fixed-design guards
        run: |
          pytest -q \
            tests/test_stage131_cross_wall_sector_interaction_audit.py \
            tests/test_stage132_crossing_phase_transition_width_audit.py
      - name: Download exact completed Stage 131 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage131-cross-wall-sector-interaction-audit
          path: /tmp/stage131_cross_wall_sector_interaction_audit
          run-id: 31984973371
          github-token: ${{ github.token }}
      - name: Verify exact Stage 131 payload digests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage131_cross_wall_sector_interaction_audit/summary.json': '67db62b54cc5e8de680f74d61604a2246ae5f4f6840b694644f8569a0d17b253',
              '/tmp/stage131_cross_wall_sector_interaction_audit/cross_wall_sector_interaction.npz': '837d2373df50040208ed3b130da64caa868cfc1c614f8206310272e2a8354b85',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 132 crossing phase transition width audit
        run: |
          python -m vgdsmc.stage132_crossing_phase_transition_width_audit \
            --stage131-dir /tmp/stage131_cross_wall_sector_interaction_audit \
            --stage131-record results/stage131_cross_wall_sector_interaction_audit_observed.json \
            --output-dir /tmp/stage132_crossing_phase_transition_width_audit
      - name: Verify Stage 132 scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage132_crossing_phase_transition_width_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 132
          assert summary['finite'] is True
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['interior_grid'] == [56, 56]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['correction_floor'] == 0.05
          assert cfg['witness_node'] == 9
          assert cfg['pair_sectors'] == [5, 6]
          assert cfg['dominant_mirrored_sector'] == 6
          assert cfg['solver_rerun'] is False
          assert cfg['solver_endpoint_advanced'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['benchmark_or_validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          assert summary['aggregate']['maximum_parent_closure'] <= 1.0e-12
          allowed = {
              'stage132_common_mirrored_crossing_phase_width_stage133_crossing_amplitude_scale_audit',
              'stage132_material_crossing_phase_offset_stage133_crossing_offset_origin_audit',
              'stage132_material_transition_width_mismatch_stage133_wall_normal_phase_gradient_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'Stage 90 remains nonconverged' in summary['negative_result_guard']
          with np.load(root / 'crossing_phase_transition_width.npz') as data:
              assert data['relative_depth'].shape == (26,)
              assert data['dominant_wall0'].shape == (26,)
              assert data['dominant_wall1_mirrored'].shape == (26,)
              assert data['dominant_quantile_depths'].shape == (2, 5)
              assert data['parent_quantile_depths'].shape == (2, 5)
              assert data['dominant_progress'].shape == (2, 26)
              assert data['parent_progress'].shape == (2, 26)
              assert np.isfinite(data['dominant_quantile_depths']).all()
              assert np.isfinite(data['parent_quantile_depths']).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage132-crossing-phase-transition-width-audit
          path: /tmp/stage132_crossing_phase_transition_width_audit
          retention-days: 30

name: Vision-guided DSMC Stage 140

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage140_local_interpolation_robustness_audit.py'
      - 'vision_guided_dsmc/tests/test_stage140_local_interpolation_robustness_audit.py'
      - 'vision_guided_dsmc/results/stage139_complement_transition_geometry_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage140.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage140_local_interpolation_robustness_audit.py'
      - 'vision_guided_dsmc/tests/test_stage140_local_interpolation_robustness_audit.py'
      - 'vision_guided_dsmc/results/stage139_complement_transition_geometry_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage140.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  local-interpolation-robustness-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 139-140 fixed-design guards
        run: |
          pytest -q \
            tests/test_stage139_complement_transition_geometry_audit.py \
            tests/test_stage140_local_interpolation_robustness_audit.py
      - name: Download exact completed Stage 139 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage139-complement-transition-geometry-audit
          path: /tmp/stage139_complement_transition_geometry_audit
          run-id: 32203217905
          github-token: ${{ github.token }}
      - name: Verify exact Stage 139 payload digests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage139_complement_transition_geometry_audit/summary.json': '289794bad96bdccc926758b6f1d7684d576da3b5f8a91788c25a390011f39c79',
              '/tmp/stage139_complement_transition_geometry_audit/complement_transition_geometry.npz': '0fb8071ba946a2cbea586f1fd2393e57ac8f4747e713bd5bdc82125d27a7703a',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 140 fixed local interpolation robustness audit
        run: |
          python -m vgdsmc.stage140_local_interpolation_robustness_audit \
            --stage139-dir /tmp/stage139_complement_transition_geometry_audit \
            --stage139-record results/stage139_complement_transition_geometry_audit_observed.json \
            --output-dir /tmp/stage140_local_interpolation_robustness_audit
      - name: Verify Stage 140 scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage140_local_interpolation_robustness_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 140
          assert summary['finite'] is True
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['interior_grid'] == [56, 56]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['correction_floor'] == 0.05
          assert cfg['witness_node'] == 9
          assert cfg['pair_sectors'] == [5, 6]
          assert cfg['dominant_mirrored_sector'] == 6
          assert cfg['parent_identity_closure_max'] == 1.0e-12
          assert cfg['root_spread_max_cells'] == 0.25
          assert cfg['node_proximate_edge_clearance_fraction'] == 0.25
          assert cfg['local_interpolation_candidates'] == ['linear_secant', 'left_quadratic', 'right_quadratic']
          assert cfg['interpolated_crossing_used_for_solver'] is False
          assert cfg['solver_rerun'] is False
          assert cfg['solver_endpoint_advanced'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['benchmark_or_validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          assert summary['aggregate']['parent_record_ok'] is True
          assert summary['aggregate']['parent_route_ok'] is True
          assert summary['aggregate']['parent_identity_closure'] <= 1.0e-12
          allowed = {
              'stage140_interpolation_sensitive_stage141_sampled_transition_support_audit',
              'stage140_interpolation_robust_but_node_proximate_stage141_node_leverage_audit',
              'stage140_interpolation_robust_and_centered_stage141_signed_lobe_balance_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'Stage 90 remains nonconverged' in summary['negative_result_guard']
          assert 'not solver parameters' in summary['negative_result_guard']
          with np.load(root / 'local_interpolation_robustness.npz') as data:
              assert data['right_depth'].shape == (7,)
              assert data['complement_signed'].shape == (7,)
              assert data['crossing_bracket_indices'].shape == (2,)
              assert data['candidate_names'].shape == (3,)
              assert data['candidate_crossing_depths'].shape == (3,)
              assert data['candidate_edge_clearance_fractions'].shape == (3,)
              assert np.isfinite(data['candidate_crossing_depths']).all()
              assert np.isfinite(data['candidate_edge_clearance_fractions']).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage140-local-interpolation-robustness-audit
          path: /tmp/stage140_local_interpolation_robustness_audit
          retention-days: 30

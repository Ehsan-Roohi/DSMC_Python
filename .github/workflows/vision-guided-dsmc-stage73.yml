name: Vision-guided DSMC Stage 73

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit.py'
      - 'vision_guided_dsmc/tests/test_stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit.py'
      - 'vision_guided_dsmc/results/stage72_directional_transport_component_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage73.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit.py'
      - 'vision_guided_dsmc/tests/test_stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit.py'
      - 'vision_guided_dsmc/results/stage72_directional_transport_component_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage73.yml'

permissions:
  actions: read
  contents: read

jobs:
  velocity-sign-angular-bin-interior-face-flux-attribution-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 73 and retained audit endpoints
        run: |
          pytest -q \
            tests/test_stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit.py \
            tests/test_stage72_directional_transport_component_audit.py \
            tests/test_stage71_wall_layer_interior_face_transport_attribution_audit.py \
            tests/test_stage70_independent_wall_face_flux_discretization_audit.py \
            tests/test_stage69_frozen_grid_transfer_residual_scaling_audit.py \
            tests/test_stage68_independent_transport_operator_residual_audit.py \
            tests/test_stage67_frozen_full_distribution_residual_decomposition.py \
            tests/test_stage66_frozen_collision_source_observable_audit.py \
            tests/test_stage65_local_clipping_activation_map_audit.py \
            tests/test_stage64_source_step_consistency_audit.py \
            tests/test_stage63_collision_target_equivalence_audit.py \
            tests/test_stage62_finite_kn_normalization_audit.py \
            tests/test_stage60_transport_wall_equation_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 72 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage72-directional-transport-component-audit
          path: /tmp/stage72_directional_transport_component_audit
          run-id: 31074807690
          github-token: ${{ github.token }}
      - name: Run Stage 73 velocity-sign and angular-bin attribution audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from vgdsmc import stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit as stage73

          summary = stage73.run_stage73(
              Path('/tmp/stage67_frozen_full_distribution_residual_decomposition'),
              Path('/tmp/stage72_directional_transport_component_audit'),
              Path('/tmp/stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit'),
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Verify exact grouping closure, provenance, and scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 73
          assert summary['finite'] is True
          assert summary['grouped_closure_closed'] is True
          assert summary['region_contract_consistent'] is True
          assert summary['provenance_consistent'] is True
          assert not summary['decision'].endswith('blocker')
          assert summary['decision'].startswith('stage73_')

          endpoint72 = summary['retained_stage72_endpoint']
          assert endpoint72['workflow_run_id'] == 31074807690
          assert endpoint72['workflow_job_id'] == 92530390942
          assert endpoint72['artifact_id'] == 8958793397
          assert endpoint72['tests_passed'] == 154
          assert endpoint72['tests_failed'] == 0

          cfg = summary['configuration']
          assert cfg['grids'] == [16, 32, 64]
          assert cfg['fine_grid'] == 64
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['angular_bin_count'] == 8
          assert cfg['angular_bin_offset_radians'] == 0.0
          assert cfg['vertical_oblique_bins'] == [1, 2, 5, 6]
          assert sum(cfg['angular_bin_velocity_point_counts']) == 3840
          assert cfg['sign_velocity_point_counts']['vx_negative'] == 1920
          assert cfg['sign_velocity_point_counts']['vx_positive'] == 1920
          assert cfg['solver_rerun_count'] == 0
          assert cfg['bounded_wall_face_arm_adopted'] is False
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          with np.load(root / 'velocity_group_interior_face_maps.npz') as maps:
              for grid in (16, 32, 64):
                  row = summary['grid_results'][str(grid)]
                  assert row['grouped_closure']['within_guard'] is True
                  attr = row['attribution']
                  assert abs(sum(attr['angular_bin_absolute_shares']) - 1.0) < 1e-12
                  assert abs(sum(attr['sign_absolute_shares'].values()) - 1.0) < 1e-12
                  reconstructed = maps[f'grid{grid}_reconstructed_x_qy']
                  reference = maps[f'grid{grid}_reference_x_qy']
                  assert reconstructed.shape == reference.shape == (grid, grid)
                  assert np.all(np.isfinite(reconstructed))
                  relative = np.linalg.norm((reconstructed - reference).ravel()) / max(np.linalg.norm(reference.ravel()), 1e-300)
                  assert relative <= 1e-10

          fine = summary['fine_grid_velocity_group_attribution']
          assert fine['stage72_x_component_absolute_share_error'] <= 1e-12
          assert 'not an adjoint sensitivity' in summary['negative_findings'][0]
          assert 'failed Stage-28 MUSCL' in summary['negative_findings'][2]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage73-velocity-sign-angular-bin-interior-face-flux-attribution-audit
          path: /tmp/stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit
          retention-days: 30

# Fixed-design artifact-only continuation; no solver retuning.
name: Vision-guided DSMC Stage 122
on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage122_*'
      - 'vision_guided_dsmc/tests/test_stage122_*'
      - 'vision_guided_dsmc/results/stage121_radial_kernel_factor_decomposition_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage122.yml'
permissions:
  contents: read
  actions: read
jobs:
  common-kernel-distribution-ratio-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_stage122_common_kernel_distribution_ratio_audit.py
      - uses: actions/download-artifact@v8
        with:
          name: stage121-radial-kernel-factor-decomposition-audit
          path: /tmp/stage121
          github-token: ${{ github.token }}
          run-id: 31849920665
      - run: >-
          python -m vgdsmc.stage122_common_kernel_distribution_ratio_audit
          --stage121-dir /tmp/stage121
          --stage121-record results/stage121_radial_kernel_factor_decomposition_audit_observed.json
          --output-dir /tmp/stage122
      - uses: actions/upload-artifact@v7
        with:
          name: stage122-common-kernel-distribution-ratio-audit
          path: /tmp/stage122
          retention-days: 30

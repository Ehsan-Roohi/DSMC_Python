name: Vision-guided DSMC Stage 105

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage105_directional_gradient_alignment_audit.py'
      - 'vision_guided_dsmc/tests/test_stage105_directional_gradient_alignment_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage105.yml'

permissions:
  actions: read
  contents: read

jobs:
  directional-gradient-alignment-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 105 and retained fixed-design guards
        run: |
          pytest -q \
            tests/test_stage105_directional_gradient_alignment_audit.py \
            tests/test_stage104_interior_gradient_scale_audit.py \
            tests/test_stage103_shell1_spatial_localization_audit.py \
            tests/test_stage102_radial_speed_shell_audit.py \
            tests/test_stage101_interior_velocity_sector_audit.py \
            tests/test_stage100_fused_single_run_directional_audit.py \
            tests/test_stage99_replay_provenance_audit.py \
            tests/test_stage98_directional_operator_growth_audit.py \
            tests/test_stage97_muscl_correction_spatial_localization_audit.py \
            tests/test_stage96_muscl_correction_growth_audit.py \
            tests/test_stage90_single_condition_reconstruction_solver_ab_audit.py
      - name: Download exact completed Stage 104 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage104-interior-gradient-scale-audit
          path: /tmp/stage104_interior_gradient_scale_audit
          run-id: 31448978626
          github-token: ${{ github.token }}
      - name: Verify exact Stage 104 payload provenance
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage104_interior_gradient_scale_audit/summary.json': '5ff1e7f4bae6ec0cf473ae61272143c9616dc83942052cccdcd90320008cfc95',
              '/tmp/stage104_interior_gradient_scale_audit/interior_gradient_scale_maps.npz': '88e45ddb944f498e34c305d2d2585475213937f825d9938a7c334451e11bdc64',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 105 directional gradient-alignment audit
        run: |
          python -m vgdsmc.stage105_directional_gradient_alignment_audit \
            --stage104-artifact-dir /tmp/stage104_interior_gradient_scale_audit \
            --output-dir /tmp/stage105_directional_gradient_alignment_audit
      - name: Verify Stage 105 fixed design and negative-result guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage105_directional_gradient_alignment_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 105
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['correction_floor'] == 0.05
          assert cfg['diagnostic_steps'] == 25
          assert cfg['wall_band_cells'] == 4
          assert cfg['dominant_radial_shell'] == 1
          assert cfg['strong_alignment_cosine'] == 0.80
          assert cfg['strong_alignment_weight_share'] == 0.75
          assert cfg['principal_axis_anisotropy_guard'] == 0.25
          assert cfg['parent_closure_tolerance'] == 1.0e-12
          assert cfg['stage104_run_id'] == 31448978626
          assert cfg['stage104_job_id'] == 93649171038
          assert cfg['stage104_artifact_id'] == 9090545022
          assert cfg['full_solver_endpoint_rerun'] is False
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['one_sided_boundary_slope_promoted'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          assert cfg['solver_endpoint_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          assert summary['stage104_authorization']['decision'] == 'stage104_mesoscale_shell1_gradient_stage105_directional_gradient_alignment_audit'
          assert summary['finite'] is True
          assert summary['parent_closure_relative'] <= 1.0e-12
          allowed = {
              'stage105_nonfinite_alignment_metric_blocker_without_retuning',
              'stage105_stage104_parent_closure_blocker_without_retuning',
              'stage105_common_strong_axis_alignment_stage106_directional_limiter_activation_audit',
              'stage105_common_gradient_alignment_without_axis_dominance_stage106_gradient_magnitude_coupling_audit',
              'stage105_common_opposed_gradient_stage106_signed_cancellation_audit',
              'stage105_mixed_gradient_alignment_stage106_spatial_phase_relation_audit',
          }
          assert summary['decision'] in allowed
          assert summary['decision'] == 'stage105_common_gradient_alignment_without_axis_dominance_stage106_gradient_magnitude_coupling_audit'
          metrics = summary['metrics']
          assert metrics['global_gradient_cosine'] >= 0.80
          assert metrics['strongly_aligned_magnitude_share'] >= 0.75
          assert min(metrics['principal_axis_anisotropy'].values()) < 0.25
          assert metrics['positive_dot_magnitude_share'] > 0.95
          assert metrics['x_gradient_same_sign_product_share'] > 0.95
          assert metrics['y_gradient_same_sign_product_share'] > 0.95
          assert 'Stage 99 remains a negative cross-run reproducibility result' in summary['negative_result_guard']
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'no cross-Knudsen MUSCL extension is permitted' in summary['negative_result_guard']
          with np.load(root / 'directional_gradient_alignment_maps.npz') as data:
              assert set(data.files) == {
                  'phi_gx', 'phi_gy', 'psi_gx', 'psi_gy',
                  'local_gradient_cosine', 'pair_gradient_weight'
              }
              for name in data.files:
                  assert data[name].shape == (56, 56)
                  assert np.isfinite(data[name]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage105-directional-gradient-alignment-audit
          path: /tmp/stage105_directional_gradient_alignment_audit
          retention-days: 30

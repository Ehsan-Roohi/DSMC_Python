name: Vision-guided DSMC Stage 113

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage113_x_wall_distance_profile_audit.py'
      - 'vision_guided_dsmc/tests/test_stage113_x_wall_distance_profile_audit.py'
      - 'vision_guided_dsmc/results/stage112_x_axis_spatial_localization_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage113.yml'

permissions:
  actions: read
  contents: read

jobs:
  x-wall-distance-profile-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 113 and retained fixed-design guards
        run: |
          pytest -q \
            tests/test_stage113_x_wall_distance_profile_audit.py \
            tests/test_stage112_x_axis_spatial_localization_audit.py \
            tests/test_stage111_axis_conditioned_asymmetry_audit.py \
            tests/test_stage110_same_sign_slope_asymmetry_audit.py \
            tests/test_stage109_limiter_intervention_mode_decomposition_audit.py \
            tests/test_stage108_limiter_severity_correction_amplitude_coupling_audit.py \
            tests/test_stage107_limiter_activation_colocation_audit.py \
            tests/test_stage106_gradient_magnitude_coupling_audit.py \
            tests/test_stage105_directional_gradient_alignment_audit.py \
            tests/test_stage104_interior_gradient_scale_audit.py \
            tests/test_stage103_shell1_spatial_localization_audit.py \
            tests/test_stage102_radial_speed_shell_audit.py \
            tests/test_stage101_interior_velocity_sector_audit.py \
            tests/test_stage100_fused_single_run_directional_audit.py \
            tests/test_stage99_replay_provenance_audit.py \
            tests/test_stage98_directional_operator_growth_audit.py \
            tests/test_stage97_muscl_correction_spatial_localization_audit.py \
            tests/test_stage96_muscl_correction_growth_audit.py \
            tests/test_stage90_single_condition_reconstruction_solver_ab_audit.py
      - name: Download exact completed Stage 112 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage112-x-axis-spatial-localization-audit
          path: /tmp/stage112_x_axis_spatial_localization_audit
          run-id: 31618371834
          github-token: ${{ github.token }}
      - name: Verify exact Stage 112 payload provenance
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage112_x_axis_spatial_localization_audit/summary.json': 'bc30e51ebceb57cff5e65d11f7dd66d446d00679f2d1745b8c535de1faa9ec00',
              '/tmp/stage112_x_axis_spatial_localization_audit/x_axis_spatial_localization_maps.npz': 'd51424d8a011083ae55fcfe084201d70b69c85cabf4a07c0b5deb7d203eae07e',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 113 frozen x-wall-distance profile audit
        run: |
          python -m vgdsmc.stage113_x_wall_distance_profile_audit \
            --stage112-artifact-dir /tmp/stage112_x_axis_spatial_localization_audit \
            --stage112-record-path results/stage112_x_axis_spatial_localization_audit_observed.json \
            --output-dir /tmp/stage113_x_wall_distance_profile_audit
      - name: Verify Stage 113 fixed design and negative-result guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage113_x_wall_distance_profile_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 113
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['correction_floor'] == 0.05
          assert cfg['diagnostic_steps'] == 25
          assert cfg['wall_band_cells'] == 4
          assert cfg['dominant_radial_shell'] == 1
          assert cfg['radial_shell_count'] == 4
          assert cfg['radial_nodes_per_shell'] == 10
          assert cfg['interior_extent'] == 56
          assert cfg['profile_bins'] == 28
          assert cfg['thin_first4_cumulative_guard'] == 0.50
          assert cfg['thin_half_mass_depth_max'] == 4
          assert cfg['broad_first14_cumulative_guard'] == 0.75
          assert cfg['broad_half_mass_depth_min'] == 5
          assert cfg['broad_effective_bins_min'] == 12.0
          assert cfg['stage112_run_id'] == 31618371834
          assert cfg['stage112_job_id'] == 94186713428
          assert cfg['stage112_artifact_id'] == 9156769170
          assert cfg['full_solver_endpoint_rerun'] is False
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['one_sided_boundary_slope_promoted'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          assert cfg['solver_endpoint_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          auth = summary['stage112_authorization']
          assert auth['decision'] == 'stage112_symmetric_outer_x_quarter_localization_stage113_x_wall_distance_profile_audit'
          assert auth['workflow_run_id'] == 31618371834
          assert auth['workflow_job_id'] == 94186713428
          assert auth['artifact_id'] == 9156769170
          assert auth['tests_passed'] == 204
          assert auth['tests_failed'] == 0
          common = summary['metrics']['common']
          assert common['first_4_cumulative_share'] < 0.50
          assert common['first_14_cumulative_share'] >= 0.75
          assert common['half_mass_depth_cells'] >= 5
          assert common['effective_profile_bin_count'] >= 12.0
          assert summary['decision'] == 'stage113_broad_x_wall_distance_profile_stage114_wall_distance_conditioned_velocity_quadrature_audit'
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'no cross-Knudsen MUSCL extension is permitted' in summary['negative_result_guard']
          with np.load(root / 'x_wall_distance_profiles.npz') as data:
              expected = {
                  'wall_distance_cell_centers', 'phi_profile', 'psi_profile', 'common_profile',
                  'phi_cumulative', 'psi_cumulative', 'common_cumulative',
              }
              assert set(data.files) == expected
              assert data['wall_distance_cell_centers'].shape == (28,)
              for name in expected - {'wall_distance_cell_centers'}:
                  assert data[name].shape == (28,)
                  assert np.isfinite(data[name]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage113-x-wall-distance-profile-audit
          path: /tmp/stage113_x_wall_distance_profile_audit
          retention-days: 30

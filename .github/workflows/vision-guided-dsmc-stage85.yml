name: Vision-guided DSMC Stage 85

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage85_near_wall_face_amplitude_suppression_audit.py'
      - 'vision_guided_dsmc/tests/test_stage85_near_wall_face_amplitude_suppression_audit.py'
      - 'vision_guided_dsmc/results/stage84_wall_normal_sign_lobe_geometry_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage85.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage85_near_wall_face_amplitude_suppression_audit.py'
      - 'vision_guided_dsmc/tests/test_stage85_near_wall_face_amplitude_suppression_audit.py'
      - 'vision_guided_dsmc/results/stage84_wall_normal_sign_lobe_geometry_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage85.yml'

permissions:
  actions: read
  contents: read

jobs:
  near-wall-face-amplitude-suppression-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 85 and retained frozen-audit endpoints
        run: |
          pytest -q \
            tests/test_stage85_near_wall_face_amplitude_suppression_audit.py \
            tests/test_stage84_wall_normal_sign_lobe_geometry_audit.py \
            tests/test_stage83_opposite_sector_spatial_cancellation_localization_audit.py \
            tests/test_stage82_within_sector_angular_coherence_audit.py \
            tests/test_stage81_dominant_node_individual_ordinate_audit.py \
            tests/test_stage80_dominant_shell_radial_node_angular_attribution_audit.py \
            tests/test_stage79_dominant_moment_radial_angular_gradient_audit.py \
            tests/test_stage78_face_gradient_moment_attribution_audit.py \
            tests/test_stage77_common_frame_face_flux_divergence_audit.py \
            tests/test_stage76_local_velocity_frame_jump_audit.py \
            tests/test_stage75_signed_face_location_velocity_moment_audit.py \
            tests/test_stage74_radial_speed_shell_opposite_sector_cancellation_audit.py \
            tests/test_stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit.py \
            tests/test_stage72_directional_transport_component_audit.py \
            tests/test_stage71_wall_layer_interior_face_transport_attribution_audit.py \
            tests/test_stage70_independent_wall_face_flux_discretization_audit.py \
            tests/test_stage69_frozen_grid_transfer_residual_scaling_audit.py \
            tests/test_stage68_independent_transport_operator_residual_audit.py \
            tests/test_stage67_frozen_full_distribution_residual_decomposition.py \
            tests/test_stage66_frozen_collision_source_observable_audit.py \
            tests/test_stage65_local_clipping_activation_map_audit.py \
            tests/test_stage64_source_step_consistency_audit.py \
            tests/test_stage63_collision_target_equivalence_audit.py \
            tests/test_stage62_finite_kn_normalization_audit.py \
            tests/test_stage60_transport_wall_equation_audit.py
      - name: Download exact completed Stage 84 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage84-wall-normal-sign-lobe-geometry-audit
          path: /tmp/stage84_wall_normal_sign_lobe_geometry_audit
          run-id: 31235732726
          github-token: ${{ github.token }}
      - name: Run Stage 85 near-wall face-amplitude suppression audit
        run: |
          python -m vgdsmc.stage85_near_wall_face_amplitude_suppression_audit \
            --stage84-artifact-dir /tmp/stage84_wall_normal_sign_lobe_geometry_audit \
            --output-dir /tmp/stage85_near_wall_face_amplitude_suppression_audit
      - name: Verify frozen design and preregistered scientific route
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage85_near_wall_face_amplitude_suppression_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 85
          assert summary['finite'] is True
          assert summary['decision'] == 'stage85_abrupt_near_wall_face_suppression_stage86_boundary_reconstruction_stencil_activation_audit'

          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['dominant_moment'] == 'transverse_kinetic'
          assert cfg['dominant_radial_shell'] == 2
          assert cfg['dominant_local_radial_node'] == 1
          assert cfg['dominant_global_radial_node'] == 21
          assert cfg['vertical_oblique_bins'] == [1, 2, 5, 6]
          assert cfg['opposite_sector_pairs'] == [[1, 5], [2, 6]]
          assert cfg['wall_to_first_l2_ratio_max'] == 0.10
          assert cfg['wall_to_first_l1_ratio_max'] == 0.10
          assert cfg['scaled_shape_residual_rel_first_max'] == 0.05
          assert cfg['near_wall_jump_share_guard'] == 0.75
          assert cfg['raw_pearson_y_correlation_is_diagnostic_only'] is True
          assert cfg['solver_rerun_count'] == 0
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          metrics = summary['near_wall_face_amplitude_metrics']
          assert len(metrics['rows']) == 4
          assert metrics['maximum_wall_to_first_l2_ratio'] <= 0.10
          assert metrics['maximum_wall_to_first_l1_ratio'] <= 0.10
          assert metrics['maximum_scaled_shape_residual_rel_to_first'] <= 0.05
          assert metrics['minimum_near_wall_jump_share_of_first_two_transitions'] >= 0.75
          assert all(row['first_interior_face_l2'] > 0 for row in metrics['rows'])

          with np.load(root / 'near_wall_face_amplitude_suppression_maps.npz') as maps:
              assert maps['pair_face_groups'].shape == (2, 64, 63)
              assert maps['pair_cell_divergence_groups'].shape == (2, 64, 64)
              assert maps['wall_adjacent_face_vectors'].shape == (2, 2, 64)
              assert maps['first_interior_face_vectors'].shape == (2, 2, 64)
              assert maps['second_interior_face_vectors'].shape == (2, 2, 64)
              assert maps['scaled_first_fit_to_wall_vectors'].shape == (2, 2, 64)
              assert np.array_equal(maps['opposite_sector_pairs'], [[1, 5], [2, 6]])
              assert np.all(np.isfinite(maps['pair_face_groups']))

          assert 'Raw Pearson correlation is diagnostic only' in summary['negative_findings'][0]
          assert 'does not establish a wall-model or reconstruction error' in summary['negative_findings'][1]
          assert 'failed Stage-28 MUSCL' in summary['negative_findings'][2]
          assert 'no cavity solver is rerun' in summary['negative_findings'][3]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage85-near-wall-face-amplitude-suppression-audit
          path: /tmp/stage85_near_wall_face_amplitude_suppression_audit
          retention-days: 30

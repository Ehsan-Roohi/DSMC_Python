name: Vision-guided DSMC Stage 76

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage76_local_velocity_frame_jump_audit.py'
      - 'vision_guided_dsmc/tests/test_stage76_local_velocity_frame_jump_audit.py'
      - 'vision_guided_dsmc/results/stage75_signed_face_location_velocity_moment_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage76.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage76_local_velocity_frame_jump_audit.py'
      - 'vision_guided_dsmc/tests/test_stage76_local_velocity_frame_jump_audit.py'
      - 'vision_guided_dsmc/results/stage75_signed_face_location_velocity_moment_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage76.yml'

permissions:
  actions: read
  contents: read

jobs:
  local-velocity-frame-jump-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 76 and retained audit endpoints
        run: |
          pytest -q \
            tests/test_stage76_local_velocity_frame_jump_audit.py \
            tests/test_stage75_signed_face_location_velocity_moment_audit.py \
            tests/test_stage74_radial_speed_shell_opposite_sector_cancellation_audit.py \
            tests/test_stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit.py \
            tests/test_stage72_directional_transport_component_audit.py \
            tests/test_stage71_wall_layer_interior_face_transport_attribution_audit.py \
            tests/test_stage70_independent_wall_face_flux_discretization_audit.py \
            tests/test_stage69_frozen_grid_transfer_residual_scaling_audit.py \
            tests/test_stage68_independent_transport_operator_residual_audit.py \
            tests/test_stage67_frozen_full_distribution_residual_decomposition.py \
            tests/test_stage66_frozen_collision_source_observable_audit.py \
            tests/test_stage65_local_clipping_activation_map_audit.py \
            tests/test_stage64_source_step_consistency_audit.py \
            tests/test_stage63_collision_target_equivalence_audit.py \
            tests/test_stage62_finite_kn_normalization_audit.py \
            tests/test_stage60_transport_wall_equation_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 75 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage75-signed-face-location-velocity-moment-audit
          path: /tmp/stage75_signed_face_location_velocity_moment_audit
          run-id: 31115869623
          github-token: ${{ github.token }}
      - name: Run Stage 76 local velocity-frame jump audit
        run: |
          python -m vgdsmc.stage76_local_velocity_frame_jump_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage75-artifact-dir /tmp/stage75_signed_face_location_velocity_moment_audit \
            --output-dir /tmp/stage76_local_velocity_frame_jump_audit
      - name: Verify exact frame-jump closure, provenance, and scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage76_local_velocity_frame_jump_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 76
          assert summary['finite'] is True
          assert summary['provenance_consistent'] is True
          assert summary['frame_closure_closed'] is True
          assert summary['group_closure_closed'] is True
          assert not summary['decision'].endswith('blocker')

          endpoint75 = summary['retained_stage75_endpoint']
          assert endpoint75['workflow_run_id'] == 31115869623
          assert endpoint75['workflow_job_id'] == 92665123190
          assert endpoint75['artifact_id'] == 8975166032
          assert endpoint75['tests_passed'] == 190
          assert endpoint75['tests_failed'] == 0

          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['material_frame_ratio_guard'] == 0.01
          assert cfg['midpoint_cell_l2_guard'] == 0.01
          assert cfg['solver_rerun_count'] == 0
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          metrics = summary['fine_grid_local_velocity_frame_metrics']
          assert abs(sum(metrics['component_absolute_shares']) - 1.0) < 1e-12
          assert abs(sum(metrics['group_absolute_shares']) - 1.0) < 1e-12
          if 'frame_jump_negligible' in summary['decision']:
              assert metrics['frame_pair_to_cell_absolute_ratio'] <= cfg['material_frame_ratio_guard']
              assert metrics['midpoint_common_frame_cell_relative_l2_error'] <= cfg['midpoint_cell_l2_guard']

          with np.load(root / 'local_velocity_frame_jump_maps.npz') as maps:
              components = maps['component_face_pair_remainder_maps']
              groups = maps['group_face_pair_remainder_maps']
              reference = maps['stage75_reference_face_pair_remainder_maps']
              midpoint_cell = maps['midpoint_common_frame_cell_map']
              stage75_cell = maps['stage75_reference_cell_map']
              assert components.shape == groups.shape == reference.shape == (3, 64, 63)
              assert midpoint_cell.shape == stage75_cell.shape == (64, 64)
              assert np.all(np.isfinite(components))
              assert np.linalg.norm((components-reference).ravel()) / np.linalg.norm(reference.ravel()) <= 1e-10
              assert np.linalg.norm((np.sum(groups, axis=0)-np.sum(components, axis=0)).ravel()) / np.linalg.norm(np.sum(components, axis=0).ravel()) <= 1e-10

          assert 'failed Stage-28 MUSCL' in summary['negative_findings'][1]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage76-local-velocity-frame-jump-audit
          path: /tmp/stage76_local_velocity_frame_jump_audit
          retention-days: 30

name: Vision-guided DSMC Stage 67

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage67_frozen_full_distribution_residual_decomposition.py'
      - 'vision_guided_dsmc/tests/test_stage67_frozen_full_distribution_residual_decomposition.py'
      - 'vision_guided_dsmc/results/stage66_frozen_collision_source_observable_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage67.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage67_frozen_full_distribution_residual_decomposition.py'
      - 'vision_guided_dsmc/tests/test_stage67_frozen_full_distribution_residual_decomposition.py'
      - 'vision_guided_dsmc/results/stage66_frozen_collision_source_observable_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage67.yml'

permissions:
  actions: read
  contents: read

jobs:
  frozen-full-distribution-residual-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 67 and retained equation-audit endpoints
        run: |
          pytest -q \
            tests/test_stage67_frozen_full_distribution_residual_decomposition.py \
            tests/test_stage66_frozen_collision_source_observable_audit.py \
            tests/test_stage65_local_clipping_activation_map_audit.py \
            tests/test_stage64_source_step_consistency_audit.py \
            tests/test_stage63_collision_target_equivalence_audit.py \
            tests/test_stage62_finite_kn_normalization_audit.py \
            tests/test_stage60_transport_wall_equation_audit.py
      - name: Download exact completed Stage 66 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage66-frozen-collision-source-observable-audit
          path: /tmp/stage66_frozen_collision_source_observable_audit
          run-id: 30976588772
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 58 baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: stage58-conservative-solver-64x64-confirmation
          path: /tmp/stage58_conservative_solver_64x64_confirmation
          run-id: 30864287564
          github-token: ${{ github.token }}
      - name: Run Stage 67 exact replay and residual decomposition
        run: |
          python -m vgdsmc.stage67_frozen_full_distribution_residual_decomposition \
            --stage66-artifact-dir /tmp/stage66_frozen_collision_source_observable_audit \
            --stage58-artifact-dir /tmp/stage58_conservative_solver_64x64_confirmation \
            --output-dir /tmp/stage67_frozen_full_distribution_residual_decomposition
      - name: Verify provenance, frozen replay, full distributions and guards
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage67_frozen_full_distribution_residual_decomposition')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 67
          assert summary['retained_stage66_endpoint']['workflow_run_id'] == 30976588772
          assert summary['retained_stage66_endpoint']['workflow_job_id'] == 92211738864
          assert summary['retained_stage66_endpoint']['artifact_id'] == 8923406335
          assert summary['retained_stage66_endpoint']['tests_passed'] == 54
          assert summary['retained_stage66_endpoint']['tests_failed'] == 0
          assert summary['retained_stage66_endpoint']['summary_sha256'] == (
              '71726050b1b41ad4d14616f7f78212156343edba6de670b716498a6cfb40fa68'
          )
          assert summary['retained_stage66_endpoint']['maps_sha256'] == (
              'c4948595303ed14beb7df7edf70597d45e4f17b3f7993c042ef95e67e8eb69d0'
          )
          assert summary['retained_stage58_endpoint']['workflow_run_id'] == 30864287564
          assert summary['retained_stage58_endpoint']['artifact_id'] == 8882191150

          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['retained_correction_floor'] == 0.05
          assert cfg['source_relaxation'] == 1.0
          assert cfg['max_iterations'] == 3000
          assert cfg['minimum_iterations'] == 500
          assert cfg['check_interval'] == 25
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['solver_replay_count'] == 1
          assert cfg['conservative_projection_adopted'] is False
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          replay = summary['replay']
          assert replay['finite'] is True
          assert replay['converged'] is True
          assert replay['minimum_phi'] > 0.0
          assert replay['minimum_psi'] > 0.0
          assert replay['wall_mass_balance_relative_error'] < 1.0e-10
          assert replay['stage58_field_comparison']['within_frozen_tolerance'] is True
          assert replay['stage58_field_comparison']['maximum_absolute_error'] <= 1.0e-11
          assert replay['stage58_field_comparison']['maximum_relative_l2_error'] <= 1.0e-10
          assert math.isclose(replay['predicted_qav'], 0.2249270610451477, rel_tol=1e-12)
          assert replay['relative_qav_excess'] > 0.25

          metrics = summary['decision_metrics']
          assert metrics['finite'] is True
          assert metrics['converged'] is True
          assert metrics['replay_within_tolerance'] is True
          assert math.isfinite(metrics['normal_heat_flux_residual_ratio'])
          assert math.isfinite(metrics['conserved_residual_ratio'])
          allowed = {
              'stage67_distribution_fixed_point_residual_blocker',
              'stage67_frozen_replay_and_residual_balance_close_stage68_independent_transport_operator_residual_audit',
          }
          assert summary['decision'] in allowed
          assert 'not adjoint sensitivities' in summary['interpretation_guard']
          assert 'without solving or tuning' in summary['scientifically_justified_next_scope']

          with np.load(root / 'converged_full_distributions.npz') as data:
              assert set(data.files) == {'phi', 'psi', 'vx', 'vy', 'weight'}
              assert data['phi'].shape == (64, 64, 3840)
              assert data['psi'].shape == (64, 64, 3840)
              assert data['vx'].shape == (3840,)
              assert data['vy'].shape == (3840,)
              assert data['weight'].shape == (3840,)
              assert np.all(np.isfinite(data['phi']))
              assert np.all(np.isfinite(data['psi']))
              assert np.min(data['phi']) > 0.0
              assert np.min(data['psi']) > 0.0

          with np.load(root / 'steady_residual_moment_maps.npz') as maps:
              components = {'collision', 'interior_transport', 'diffuse_wall', 'total'}
              moments = {'mass', 'momentum_x', 'momentum_y', 'energy', 'qx', 'qy'}
              assert set(maps.files) == {
                  f'{component}_{moment}'
                  for component in components
                  for moment in moments
              }
              for name in maps.files:
                  assert maps[name].shape == (64, 64)
                  assert np.all(np.isfinite(maps[name]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          retention-days: 30
          compression-level: 0

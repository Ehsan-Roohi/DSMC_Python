name: Vision-guided DSMC Stage 31
on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage31_cross_kn_extension.py'
      - 'vision_guided_dsmc/vgdsmc/reduced_spherical_solver.py'
      - 'vision_guided_dsmc/vgdsmc/velocity_quadrature_audit.py'
      - 'vision_guided_dsmc/tests/test_stage31_cross_kn_extension.py'
      - 'vision_guided_dsmc/tests/test_reduced_spherical_solver.py'
      - 'vision_guided_dsmc/pyproject.toml'
      - '.github/workflows/vision-guided-dsmc-stage31.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage31_cross_kn_extension.py'
      - 'vision_guided_dsmc/vgdsmc/reduced_spherical_solver.py'
      - 'vision_guided_dsmc/vgdsmc/velocity_quadrature_audit.py'
      - 'vision_guided_dsmc/tests/test_stage31_cross_kn_extension.py'
      - 'vision_guided_dsmc/tests/test_reduced_spherical_solver.py'
      - 'vision_guided_dsmc/pyproject.toml'
      - '.github/workflows/vision-guided-dsmc-stage31.yml'

jobs:
  cross-knudsen-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 31 fixed design and arbitrary-quadrature solver
        run: pytest -q tests/test_stage31_cross_kn_extension.py tests/test_reduced_spherical_solver.py
      - name: Run fixed-physics Kn0 0.1 and 10 Cartesian versus spherical comparisons
        run: |
          vgdsmc-stage31-cross-kn \
            --output-dir /tmp/stage31_cross_kn \
            --nx 12 --ny 12 \
            --max-steps 9000 --tolerance 3e-5
      - name: Verify Stage 31 reproducibility and scientific endpoint
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np
          summary = json.load(open('/tmp/stage31_cross_kn/summary.json'))
          assert summary['stage'] == 31
          cfg = summary['configuration']
          assert cfg['grid'] == [12, 12]
          assert cfg['kn0_sequence'] == [0.1, 10.0]
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['physical_parameter_retuning'] is False
          assert cfg['transport'] == 'first-order upwind'
          assert cfg['collision'] == 'Shakhov'
          assert cfg['quadratures'] == [
              'cartesian_midpoint_nv19',
              'spherical_matched_r16_mu12_phi24',
          ]
          assert len(summary['rows']) == 4
          assert len(summary['comparisons']) == 2
          for row in summary['rows']:
              assert row['kn0'] in (0.1, 10.0)
              assert row['scheme'] in cfg['quadratures']
              assert row['point_count'] > 0
              for key in (
                  'final_change', 'predicted_qav', 'literature_qav',
                  'qav_relative_error', 'wall_velocity_relative_rms',
                  'wall_velocity_sign_agreement', 'wall_mass_balance_relative_error',
                  'minimum_distribution', 'minimum_temperature', 'maximum_temperature',
                  'work_proxy',
              ):
                  assert math.isfinite(row[key])
              assert row['minimum_distribution'] > 0.0
              assert row['minimum_temperature'] > 0.0
              assert row['wall_mass_balance_relative_error'] < 1e-10
          assert summary['decision'] in {
              'spherical_quadrature_supported_across_kn0_0p1_1_10',
              'record_partial_or_negative_cross_kn_extension_and_audit_remaining_model_error',
          }
          arrays = np.load('/tmp/stage31_cross_kn/fields_and_profiles.npz')
          for kn in ('0p1', '10p0'):
              for scheme in cfg['quadratures']:
                  key = f'T_kn{kn}_{scheme}'
                  assert key in arrays.files
                  assert np.isfinite(arrays[key]).all()
          assert Path('/tmp/stage31_cross_kn/summary.json').exists()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage31-cross-knudsen-extension
          path: /tmp/stage31_cross_kn
          retention-days: 30

name: Vision-guided DSMC Stage 133

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage133_crossing_amplitude_scale_audit.py'
      - 'vision_guided_dsmc/tests/test_stage133_crossing_amplitude_scale_audit.py'
      - 'vision_guided_dsmc/results/stage132_crossing_phase_transition_width_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage133.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  crossing-amplitude-scale-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 132-133 fixed-design guards
        run: |
          pytest -q \
            tests/test_stage132_crossing_phase_transition_width_audit.py \
            tests/test_stage133_crossing_amplitude_scale_audit.py
      - name: Download exact completed Stage 132 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage132-crossing-phase-transition-width-audit
          path: /tmp/stage132_crossing_phase_transition_width_audit
          run-id: 32001930265
          github-token: ${{ github.token }}
      - name: Verify exact Stage 132 payload digests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage132_crossing_phase_transition_width_audit/summary.json': 'bbcfe2e0a60411891e81d0535d4e341346ebea3283ede3c8e7fb7f96fce70443',
              '/tmp/stage132_crossing_phase_transition_width_audit/crossing_phase_transition_width.npz': '59c00c09bf0e8109946bf720f279bb151314c271f1fc67ae4b2378cb6abcc198',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 133 crossing amplitude scale audit
        run: |
          python -m vgdsmc.stage133_crossing_amplitude_scale_audit \
            --stage132-dir /tmp/stage132_crossing_phase_transition_width_audit \
            --stage132-record results/stage132_crossing_phase_transition_width_audit_observed.json \
            --output-dir /tmp/stage133_crossing_amplitude_scale_audit
      - name: Verify Stage 133 scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage133_crossing_amplitude_scale_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 133
          assert summary['finite'] is True
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['interior_grid'] == [56, 56]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['correction_floor'] == 0.05
          assert cfg['witness_node'] == 9
          assert cfg['pair_sectors'] == [5, 6]
          assert cfg['dominant_mirrored_sector'] == 6
          assert cfg['core_half_width_cells'] == 4.0
          assert cfg['core_sample_count'] == 8
          assert cfg['phase_shift_applied'] is False
          assert cfg['width_refit_applied'] is False
          assert cfg['solver_rerun'] is False
          assert cfg['solver_endpoint_advanced'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['benchmark_or_validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          assert summary['aggregate']['maximum_parent_closure'] <= 1.0e-12
          allowed = {
              'stage133_material_multiplicative_amplitude_scale_stage134_amplitude_origin_audit',
              'stage133_affine_offset_dominated_crossing_mismatch_stage134_additive_baseline_origin_audit',
              'stage133_amplitude_scaling_insufficient_stage134_crossing_shape_residual_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'Stage 90 remains nonconverged' in summary['negative_result_guard']
          with np.load(root / 'crossing_amplitude_scale.npz') as data:
              assert data['relative_depth_core'].shape == (8,)
              assert data['dominant_wall0_core'].shape == (8,)
              assert data['dominant_wall1_core'].shape == (8,)
              assert data['dominant_scale_only_fit'].shape == (8,)
              assert data['dominant_affine_fit'].shape == (8,)
              assert data['dominant_affine_residual'].shape == (8,)
              assert data['parent_wall0_core'].shape == (8,)
              assert data['parent_wall1_core'].shape == (8,)
              assert data['parent_scale_only_fit'].shape == (8,)
              assert data['parent_affine_fit'].shape == (8,)
              assert data['parent_affine_residual'].shape == (8,)
              for key in data.files:
                  assert np.isfinite(data[key]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage133-crossing-amplitude-scale-audit
          path: /tmp/stage133_crossing_amplitude_scale_audit
          retention-days: 30

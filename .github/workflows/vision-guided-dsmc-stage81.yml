name: Vision-guided DSMC Stage 81

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage81_dominant_node_individual_ordinate_audit.py'
      - 'vision_guided_dsmc/tests/test_stage81_dominant_node_individual_ordinate_audit.py'
      - 'vision_guided_dsmc/results/stage80_dominant_shell_radial_node_angular_attribution_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage81.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage81_dominant_node_individual_ordinate_audit.py'
      - 'vision_guided_dsmc/tests/test_stage81_dominant_node_individual_ordinate_audit.py'
      - 'vision_guided_dsmc/results/stage80_dominant_shell_radial_node_angular_attribution_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage81.yml'

permissions:
  actions: read
  contents: read

jobs:
  dominant-node-individual-ordinate-attribution-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 81 and retained frozen-audit endpoints
        run: |
          pytest -q \
            tests/test_stage81_dominant_node_individual_ordinate_audit.py \
            tests/test_stage80_dominant_shell_radial_node_angular_attribution_audit.py \
            tests/test_stage79_dominant_moment_radial_angular_gradient_audit.py \
            tests/test_stage78_face_gradient_moment_attribution_audit.py \
            tests/test_stage77_common_frame_face_flux_divergence_audit.py \
            tests/test_stage76_local_velocity_frame_jump_audit.py \
            tests/test_stage75_signed_face_location_velocity_moment_audit.py \
            tests/test_stage74_radial_speed_shell_opposite_sector_cancellation_audit.py \
            tests/test_stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit.py \
            tests/test_stage72_directional_transport_component_audit.py \
            tests/test_stage71_wall_layer_interior_face_transport_attribution_audit.py \
            tests/test_stage70_independent_wall_face_flux_discretization_audit.py \
            tests/test_stage69_frozen_grid_transfer_residual_scaling_audit.py \
            tests/test_stage68_independent_transport_operator_residual_audit.py \
            tests/test_stage67_frozen_full_distribution_residual_decomposition.py \
            tests/test_stage66_frozen_collision_source_observable_audit.py \
            tests/test_stage65_local_clipping_activation_map_audit.py \
            tests/test_stage64_source_step_consistency_audit.py \
            tests/test_stage63_collision_target_equivalence_audit.py \
            tests/test_stage62_finite_kn_normalization_audit.py \
            tests/test_stage60_transport_wall_equation_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 80 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage80-dominant-shell-radial-node-angular-attribution-audit
          path: /tmp/stage80_dominant_shell_radial_node_angular_attribution_audit
          run-id: 31174110559
          github-token: ${{ github.token }}
      - name: Run Stage 81 dominant-node individual-ordinate attribution audit
        run: |
          python -m vgdsmc.stage81_dominant_node_individual_ordinate_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage80-artifact-dir /tmp/stage80_dominant_shell_radial_node_angular_attribution_audit \
            --output-dir /tmp/stage81_dominant_node_individual_ordinate_audit
      - name: Verify fixed design, closure, and scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage81_dominant_node_individual_ordinate_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 81
          assert summary['finite'] is True
          assert summary['closure_closed'] is True
          assert not summary['decision'].endswith('blocker')

          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['dominant_moment'] == 'transverse_kinetic'
          assert cfg['dominant_radial_shell'] == 2
          assert cfg['dominant_local_radial_node'] == 1
          assert cfg['dominant_global_radial_node'] == 21
          assert cfg['ordinate_count'] == 96
          assert cfg['angular_bin_count'] == 8
          assert cfg['nominal_ordinates_per_angular_bin'] == 12
          assert cfg['retained_stage80_angular_bin_labels_preserved_exactly'] is True
          assert cfg['vertical_oblique_bins'] == [1, 2, 5, 6]
          assert cfg['dominant_ordinate_share_guard'] == 0.05
          assert cfg['top_twelve_ordinate_concentration_guard'] == 0.50
          assert cfg['vertical_oblique_concentration_guard'] == 0.70
          assert cfg['solver_rerun_count'] == 0
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          closure = summary['dominant_node_reconstruction_closure']
          assert closure['face_relative_l2_error'] <= 1e-10
          assert closure['cell_relative_l2_error'] <= 1e-10
          assert closure['radial_node_labels_exact_match'] is True
          assert closure['angular_bin_labels_exact_match'] is True

          metrics = summary['ordinate_metrics']
          assert 0 <= metrics['dominant_ordinate'] < 96
          assert 0.0 <= metrics['dominant_ordinate_cell_divergence_share'] <= 1.0 + 1e-12
          assert 0.0 <= metrics['top_twelve_ordinate_cell_divergence_share'] <= 1.0 + 1e-12
          assert 0.0 <= metrics['vertical_oblique_cell_divergence_share_within_node'] <= 1.0 + 1e-12
          assert len(metrics['retained_angular_bin_ordinate_counts']) == 8
          assert sum(metrics['retained_angular_bin_ordinate_counts']) == 96
          assert metrics['nominal_ordinates_per_angular_bin'] == 12

          with np.load(root / 'dominant_node_individual_ordinate_attribution_maps.npz') as maps:
              face = maps['face_groups']
              cell = maps['cell_divergence_groups']
              assert face.shape == (96, 64, 63)
              assert cell.shape == (96, 64, 64)
              assert np.all(np.isfinite(face))
              assert np.all(np.isfinite(cell))
              assert np.max(np.abs(np.sum(cell, axis=(1, 2)))) <= 1e-10
              assert maps['ordinate_labels'].shape == (3840,)
              assert int(np.sum(maps['ordinate_labels'] >= 0)) == 96

          assert 'not an adjoint sensitivity' in summary['negative_findings'][0]
          assert 'does not rebucket or retune' in summary['negative_findings'][1]
          assert 'failed Stage-28 MUSCL' in summary['negative_findings'][2]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage81-dominant-node-individual-ordinate-attribution-audit
          path: /tmp/stage81_dominant_node_individual_ordinate_audit
          retention-days: 30

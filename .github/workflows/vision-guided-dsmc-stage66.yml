name: Vision-guided DSMC Stage 66

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage66_frozen_collision_source_observable_audit.py'
      - 'vision_guided_dsmc/tests/test_stage66_frozen_collision_source_observable_audit.py'
      - 'vision_guided_dsmc/results/stage65_local_clipping_activation_map_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage66.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage66_frozen_collision_source_observable_audit.py'
      - 'vision_guided_dsmc/tests/test_stage66_frozen_collision_source_observable_audit.py'
      - 'vision_guided_dsmc/results/stage65_local_clipping_activation_map_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage66.yml'

permissions:
  actions: read
  contents: read

jobs:
  frozen-collision-source-observable-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 66 and retained collision-audit endpoints
        run: |
          pytest -q \
            tests/test_stage66_frozen_collision_source_observable_audit.py \
            tests/test_stage65_local_clipping_activation_map_audit.py \
            tests/test_stage64_source_step_consistency_audit.py \
            tests/test_stage63_collision_target_equivalence_audit.py \
            tests/test_stage62_finite_kn_normalization_audit.py
      - name: Download exact completed Stage 65 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage65-local-clipping-activation-map-audit
          path: /tmp/stage65_local_clipping_activation_map_audit
          run-id: 30963463806
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 58 baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: stage58-conservative-solver-64x64-confirmation
          path: /tmp/stage58_conservative_solver_64x64_confirmation
          run-id: 30864287564
          github-token: ${{ github.token }}
      - name: Run Stage 66 frozen collision-source observable audit
        run: |
          python -m vgdsmc.stage66_frozen_collision_source_observable_audit \
            --stage65-artifact-dir /tmp/stage65_local_clipping_activation_map_audit \
            --stage58-artifact-dir /tmp/stage58_conservative_solver_64x64_confirmation \
            --output-dir /tmp/stage66_frozen_collision_source_observable_audit
      - name: Verify provenance, frozen design, signed findings and interpretation guards
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage66_frozen_collision_source_observable_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 66

          retained65 = summary['retained_stage65_endpoint']
          assert retained65['workflow_run_id'] == 30963463806
          assert retained65['workflow_job_id'] == 92172238988
          assert retained65['workflow_conclusion'] == 'success'
          assert retained65['tests_passed'] == 48
          assert retained65['tests_failed'] == 0
          assert retained65['artifact_id'] == 8918027763
          assert retained65['artifact_size_bytes'] == 115402
          assert retained65['artifact_sha256'] == (
              '50f695ef5e73ab7315b741cd3f1eb9fc5a008f242a480872aba5130a6ec48ad6'
          )
          assert retained65['summary_sha256'] == (
              'bc44f5410763bf22d5c409a9f06f554a2652e488552bf706c2d792efeddd6aff'
          )
          assert retained65['maps_sha256'] == (
              '085285bff41a576098d73a44e7da036dc7f292193acd39e88cbcc766311e5fac'
          )

          retained58 = summary['retained_stage58_endpoint']
          assert retained58['workflow_run_id'] == 30864287564
          assert retained58['workflow_job_id'] == 91852659651
          assert retained58['workflow_conclusion'] == 'success'
          assert retained58['artifact_id'] == 8882191150
          assert retained58['baseline_fields_sha256'] == (
              '9aa53136e05917236f87fb9279c2ecc4e29d6056ca5ec34ca3bcb4d8f66aa822'
          )

          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['viscosity_exponent'] == 0.5
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['prandtl'] == 2.0 / 3.0
          assert cfg['retained_correction_floor'] == 0.05
          assert cfg['wall_band_layers'] == 4
          assert cfg['solver_rerun'] is False
          assert cfg['full_distribution_available'] is False
          assert cfg['conservative_projection_adopted'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          audit = summary['audit']
          gap = audit['observed_heat_flux_gap']
          assert gap['signed_excess'] > 0.0
          assert math.isclose(
              gap['baseline_predicted_qav'], 0.2249270610451477, rel_tol=1e-13
          )
          assert gap['published_dsmc_qav'] == 0.179

          closure = audit['unclipped_target_closure']
          assert closure['maximum_relative_vector_error'] <= 1.0e-6

          target_y = audit['target_bias_paper_coordinates']['y']
          source_y = audit['collision_source_bias_paper_coordinates']['y']
          relative = audit['collision_source_bias_paper_coordinates'][
              'relative_normal_source_bias'
          ]
          assert target_y['negative_fraction'] == 1.0
          assert target_y['positive_fraction'] == 0.0
          assert target_y['mean'] < 0.0
          assert source_y['negative_fraction'] == 1.0
          assert source_y['mean'] < 0.0
          assert relative['maximum'] > 0.10
          assert relative['active_to_ideal_ratio_minimum'] > 1.0

          directional = audit['directional_review']
          assert (
              directional['fraction_target_bias_aligned_with_observed_positive_excess']
              == 0.0
          )
          assert (
              directional['fraction_target_bias_opposed_to_observed_positive_excess']
              == 1.0
          )
          assert (
              directional['nominal_full_relaxation_mean_target_bias_to_observed_gap']
              < 0.0
          )

          wall = audit['wall_distance_stratification']
          assert wall['wall_band_absolute_share'] < wall['wall_band_cell_fraction']
          assert wall['interior_absolute_share'] > 0.80
          assert wall['wall_band_mean'] < 0.0
          assert wall['interior_mean'] < wall['wall_band_mean']

          correlations = audit['correlations']
          assert correlations['clipping_vs_signed_normal_source_bias'] < -0.90
          assert correlations['clipping_vs_absolute_normal_source_bias'] > 0.90
          assert (
              correlations['stage65_heat_flux_defect_vs_absolute_normal_source_bias']
              > 0.95
          )

          assert summary['decision'] == (
              'stage66_clipping_source_bias_opposes_heat_flux_overprediction_'
              'stage67_frozen_full_distribution_residual_decomposition'
          )
          assert 'not an adjoint sensitivity' in summary['interpretation_guard']
          assert 'exact frozen replay' in summary['scientifically_justified_next_scope']

          with np.load(root / 'source_observable_maps.npz') as maps:
              expected = {
                  'clipped_target_qx_paper',
                  'clipped_target_qy_paper',
                  'unclipped_target_qx_paper',
                  'unclipped_target_qy_paper',
                  'target_bias_qx_paper',
                  'target_bias_qy_paper',
                  'source_bias_qx_paper',
                  'source_bias_qy_paper',
                  'ideal_source_qy_paper',
                  'active_source_qy_paper',
                  'relative_source_bias_qy',
                  'collision_frequency',
                  'unclipped_target_closure_error',
                  'wall_distance_layers',
              }
              assert set(maps.files) == expected
              for name in maps.files:
                  assert maps[name].shape == (64, 64)
                  assert np.all(np.isfinite(maps[name]))
              assert np.all(maps['target_bias_qy_paper'] < 0.0)
              assert np.all(maps['source_bias_qy_paper'] < 0.0)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage66-frozen-collision-source-observable-audit
          path: /tmp/stage66_frozen_collision_source_observable_audit
          retention-days: 30

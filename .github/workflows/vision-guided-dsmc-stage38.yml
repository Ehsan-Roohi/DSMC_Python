name: Vision-guided DSMC Stage 38

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage38_transport_collision_interaction_audit.py'
      - 'vision_guided_dsmc/tests/test_stage38_transport_collision_interaction_audit.py'
      - 'vision_guided_dsmc/results/stage37_low_kn_transport_audit_summary.json'
      - '.github/workflows/vision-guided-dsmc-stage38.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage38_transport_collision_interaction_audit.py'
      - 'vision_guided_dsmc/tests/test_stage38_transport_collision_interaction_audit.py'
      - 'vision_guided_dsmc/results/stage37_low_kn_transport_audit_summary.json'
      - '.github/workflows/vision-guided-dsmc-stage38.yml'

jobs:
  transport-collision-interaction-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 38 and retained low-Kn infrastructure
        run: |
          pytest -q \
            tests/test_stage38_transport_collision_interaction_audit.py \
            tests/test_stage37_low_kn_transport_audit.py \
            tests/test_stage36_high_resolution_cross_kn.py \
            tests/test_second_order_transport.py \
            tests/test_stage34_velocity_scale_consistency.py \
            tests/test_reduced_spherical_solver.py
      - name: Run fixed-physics transport-collision interaction audit
        run: |
          python -m vgdsmc.stage38_transport_collision_interaction_audit \
            --output-dir /tmp/stage38_transport_collision_interaction_audit \
            --max-steps 16000 --tolerance 2e-5
      - name: Verify frozen design and retain every endpoint
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage38_transport_collision_interaction_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 38
          cfg = summary['configuration']
          assert cfg['kn0'] == 0.1
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['grid'] == [24, 24]
          assert cfg['quadrature'] == 'spherical_matched_r16_mu12_phi24'
          assert cfg['velocity_point_count'] == 4608
          assert cfg['relaxation_mapping'] == 'sqrt(2)*Kn0/sqrt(pi) in c0 coordinates'
          assert cfg['collision'] == 'Shakhov'
          assert cfg['transport_orders'] == ['first_order_upwind', 'muscl_ssprk2']
          assert cfg['couplings'] == [
              'retained_lie_explicit', 'strang_explicit_half_collision'
          ]
          assert cfg['wall_observable'] == 'linear_extrapolated_wall'
          assert cfg['cfl_equal_in_all_arms'] == 0.2
          assert cfg['limiter_theta'] == 1.5
          assert cfg['physical_parameter_retuning'] is False

          retained = summary['retained_stage37_endpoint']
          assert retained['workflow_run_id'] == 30708041761
          assert retained['workflow_job_id'] == 91390477801
          assert retained['tests_passed'] == 44
          assert retained['tests_failed'] == 0
          assert retained['artifact_id'] == 8822338075
          assert retained['artifact_sha256'] == (
              '2981365dd782c617eba73deb9e54d3ec31909acdc862d6d786934879f6b87152'
          )
          assert retained['rows']['first_order_lie_explicit']['predicted_qav'] == (
              0.07473044968217635
          )
          assert retained['rows']['muscl_lie_explicit']['predicted_qav'] == (
              0.04324014823991044
          )

          assert [row['scheme'] for row in summary['new_rows']] == [
              'first_order_strang_explicit', 'muscl_strang_explicit'
          ]
          for row in summary['new_rows']:
              for key in (
                  'final_change', 'predicted_qav', 'literature_qav',
                  'qav_relative_error', 'wall_mass_balance_relative_error',
                  'minimum_distribution', 'minimum_temperature',
                  'maximum_temperature', 'dt', 'work_proxy',
              ):
                  assert math.isfinite(row[key])
              for key in ('relative_rms', 'sign_agreement', 'relative_l1'):
                  assert math.isfinite(row['velocity_metrics'][key])
              assert row['wall_mass_balance_relative_error'] < 1e-10
              assert row['minimum_distribution'] > 0.0
              assert row['minimum_temperature'] > 0.0
          for value in summary['comparison'].values():
              assert math.isfinite(value)
          assert summary['decision'] in {
              'coupling_rescues_muscl_stage39_high_resolution_confirmation',
              'splitting_dominates_stage39_collision_time_integration_audit',
              'partial_muscl_rescue_stage39_limiter_flux_consistency_audit',
              'no_coupling_rescue_stage39_collision_model_or_benchmark_audit',
              'stage38_nonconvergence_stage39_numerical_stability_audit',
          }

          arrays = np.load(root / 'fields_and_profiles.npz')
          for scheme in ('first_order_strang', 'muscl_strang'):
              for key in (
                  f'bottom_heat_flux_{scheme}',
                  f'residual_history_{scheme}',
                  f'T_{scheme}',
                  f'rho_{scheme}',
                  f'table_velocity_linear_extrapolated_wall_{scheme}',
              ):
                  assert np.isfinite(arrays[key]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage38-transport-collision-interaction-audit
          path: /tmp/stage38_transport_collision_interaction_audit
          retention-days: 30

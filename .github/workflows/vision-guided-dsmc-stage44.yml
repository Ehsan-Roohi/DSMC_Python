name: Vision-guided DSMC Stage 44

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage44_projected_polar_finer_grid_sequence.py'
      - 'vision_guided_dsmc/tests/test_stage44_projected_polar_finer_grid_sequence.py'
      - 'vision_guided_dsmc/results/stage43_projected_polar_resolution_sequence_summary.json'
      - '.github/workflows/vision-guided-dsmc-stage44.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage44_projected_polar_finer_grid_sequence.py'
      - 'vision_guided_dsmc/tests/test_stage44_projected_polar_finer_grid_sequence.py'
      - 'vision_guided_dsmc/results/stage43_projected_polar_resolution_sequence_summary.json'
      - '.github/workflows/vision-guided-dsmc-stage44.yml'

jobs:
  projected-polar-finer-grid-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 44 and retained projected-polar infrastructure
        run: |
          pytest -q \
            tests/test_stage44_projected_polar_finer_grid_sequence.py \
            tests/test_stage43_projected_polar_resolution_sequence.py \
            tests/test_stage42_projected_polar_heated_cavity_pilot.py \
            tests/test_stage40_external_benchmark_fidelity_audit.py \
            tests/test_reduced_spherical_solver.py
      - name: Run frozen Stage 44 finer-grid sequence
        run: |
          python -m vgdsmc.stage44_projected_polar_finer_grid_sequence \
            --output-dir /tmp/stage44_projected_polar_finer_grid_sequence
      - name: Verify exact provenance, frozen design and retained endpoint
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage44_projected_polar_finer_grid_sequence')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 44

          retained = summary['retained_stage43_endpoint']
          assert retained['workflow_run_id'] == 30733957628
          assert retained['workflow_job_id'] == 91459088187
          assert retained['tests_passed'] == 53
          assert retained['tests_failed'] == 0
          assert retained['artifact_id'] == 8830544995
          assert retained['artifact_sha256'] == (
              '70bb2a08a1e49cfe31091ce91cf26c286c7652ae7c341855a4ec1dc81de528dd'
          )
          assert retained['source_head_sha'] == (
              '27f33f1be007cf81ea97a1cc452c248e07d83470'
          )
          finest = summary['retained_stage43_finest_case']
          assert finest['grid'] == [16, 16]
          assert finest['predicted_qav'] == 0.0814053328666412
          assert finest['qav_relative_error'] == 0.13062962314779453
          assert finest['velocity_metrics']['relative_rms'] == 2.0834768337668104

          cfg = summary['configuration']
          assert cfg['kn0'] == 0.1
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['new_grids'] == [[20, 20], [24, 24]]
          assert cfg['combined_sequence_grids'] == [16, 20, 24]
          assert cfg['polar_rule'] == {
              'radial_nodes': 32,
              'angular_nodes': 96,
              'point_count': 3072,
          }
          assert cfg['prandtl'] == 2.0 / 3.0
          assert cfg['shakhov_correction_floor'] == 0.05
          assert cfg['transport_iteration'] == 'steady_first_order_upwind_jacobi'
          assert cfg['collision'] == 'projected_shakhov'
          assert cfg['relaxation_mapping'] == (
              'sqrt(2)*Kn0/sqrt(pi) in c0 coordinates'
          )
          assert cfg['source_relaxation'] == 1.0
          assert cfg['max_iterations'] == 3000
          assert cfg['minimum_iterations'] == 500
          assert cfg['check_interval'] == 25
          assert cfg['tolerance'] == 2e-5
          assert cfg['physical_parameter_retuning'] is False
          assert cfg['velocity_quadrature_retuning'] is False
          assert cfg['source_resolution_reproduction'] is False

          assert len(summary['new_cases']) == 2
          for case, grid in zip(summary['new_cases'], cfg['new_grids']):
              assert case['grid'] == grid
              assert case['finite'] is True
              assert case['minimum_phi'] > 0.0
              assert case['minimum_psi'] > 0.0
              assert case['wall_mass_balance_relative_error'] < 1e-10
              assert 1 <= case['iterations'] <= 3000
              for key in (
                  'final_change', 'predicted_qav', 'literature_qav',
                  'qav_relative_error', 'wall_mass_balance_relative_error',
                  'minimum_phi', 'minimum_psi',
                  'maximum_phi_clipped_weight_fraction',
                  'maximum_psi_clipped_weight_fraction', 'work_proxy',
              ):
                  assert math.isfinite(case[key])
              for value in case['velocity_metrics'].values():
                  assert math.isfinite(value)
              assert np.isfinite(case['table_velocity']).all()

          monotonicity = summary['combined_monotonicity']
          for key, value in monotonicity.items():
              if isinstance(value, list):
                  assert np.isfinite(value).all()
              elif isinstance(value, bool):
                  pass
              else:
                  assert math.isfinite(value)
          extrapolation = summary['linear_h_extrapolation']
          for key, value in extrapolation.items():
              if isinstance(value, list):
                  assert np.isfinite(value).all()
              elif isinstance(value, str):
                  pass
              else:
                  assert math.isfinite(value)

          assert summary['decision'] in {
              'projected_polar_finer_grid_converging_stage45_cross_kn_extension',
              'projected_polar_finer_grid_improving_not_converged_stage45_32x32_confirmation',
              'projected_polar_heat_flux_only_improves_stage45_wall_observable_audit',
              'projected_polar_velocity_only_improves_stage45_heat_flux_definition_audit',
              'projected_polar_finer_grid_nonmonotonic_stage45_space_velocity_coupling_audit',
              'stage44_finer_grid_blocker',
          }

          arrays = np.load(root / 'fields_and_profiles.npz')
          for key in arrays.files:
              assert np.isfinite(arrays[key]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage44-projected-polar-finer-grid-sequence
          path: /tmp/stage44_projected_polar_finer_grid_sequence
          retention-days: 30

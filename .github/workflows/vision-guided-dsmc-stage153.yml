name: Vision-guided DSMC Stage 153

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage153_left_channel_endpoint_balance_audit.py'
      - 'vision_guided_dsmc/tests/test_stage153_left_channel_endpoint_balance_audit.py'
      - 'vision_guided_dsmc/results/stage152_left_outer_channel_balance_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage153.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage153_left_channel_endpoint_balance_audit.py'
      - 'vision_guided_dsmc/tests/test_stage153_left_channel_endpoint_balance_audit.py'
      - 'vision_guided_dsmc/results/stage152_left_outer_channel_balance_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage153.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  left-channel-endpoint-balance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 152-153 fixed-design guards
        run: |
          pytest -q \
            tests/test_stage152_left_outer_channel_balance_audit.py \
            tests/test_stage153_left_channel_endpoint_balance_audit.py
      - name: Download exact completed Stage 152 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage152-left-outer-channel-balance-audit
          path: /tmp/stage152_left_outer_channel_balance_audit
          run-id: 32450348284
          github-token: ${{ github.token }}
      - name: Verify exact Stage 152 parent payload digests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage152_left_outer_channel_balance_audit/summary.json': 'e4e4a79e37321a540855ff8a84ecef07d2f36e48a4239ff532bd927948337291',
              '/tmp/stage152_left_outer_channel_balance_audit/left_outer_channel_balance.npz': 'cce055806167ad30d408d162680ddf02670823d507f1b260dc76cfe5451949d4',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Download exact completed Stage 150 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage150-channel-sign-transition-localization-audit
          path: /tmp/stage150_channel_sign_transition_localization_audit
          run-id: 32431079197
          github-token: ${{ github.token }}
      - name: Verify exact Stage 150 supporting payload digests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage150_channel_sign_transition_localization_audit/summary.json': 'fbabcb9d83d008b0d52b96ea80c546636461c150a821a713cf773bfe31f7376a',
              '/tmp/stage150_channel_sign_transition_localization_audit/channel_sign_transition_localization.npz': '5e841e56d1d22d82fd73f9bfd6193857dc65b2ac42849ced065b273d264dc5c0',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 153 fixed left-channel endpoint-balance audit
        run: |
          python -m vgdsmc.stage153_left_channel_endpoint_balance_audit \
            --stage152-dir /tmp/stage152_left_outer_channel_balance_audit \
            --stage152-record results/stage152_left_outer_channel_balance_audit_observed.json \
            --stage150-dir /tmp/stage150_channel_sign_transition_localization_audit \
            --stage150-record results/stage150_channel_sign_transition_localization_audit_observed.json \
            --output-dir /tmp/stage153_left_channel_endpoint_balance_audit
      - name: Verify Stage 153 scientific guards
        run: |
          python - <<'PY'
          import json
          import numpy as np
          from pathlib import Path
          root = Path('/tmp/stage153_left_channel_endpoint_balance_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 153 and summary['finite'] is True
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64] and cfg['interior_grid'] == [56, 56]
          assert cfg['kn0'] == 10.0 and cfg['cold_hot_ratio'] == 0.1 and cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0 and cfg['limiter'] == 'minmod' and cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0 and cfg['correction_floor'] == 0.05
          assert cfg['coarse_endpoint_cancellation_min'] == 0.75
          assert cfg['single_channel_dominance_min'] == 0.75
          assert cfg['endpoint_metrics_used_for_solver'] is False
          assert cfg['solver_rerun'] is False and cfg['solver_endpoint_advanced'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['benchmark_or_validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          agg = summary['aggregate']
          assert agg['stage152_record_ok'] is True and agg['stage150_record_ok'] is True and agg['parent_route_ok'] is True
          assert agg['fine_channel_sign_product'] == 1
          assert agg['coarse_channel_sign_product'] == -1
          assert agg['coarse_cross_channel_cancellation_fraction'] >= 0.75
          assert agg['coarse_stronger_absolute_share'] < 0.75
          assert agg['maximum_identity_or_provenance_error'] <= 1e-12
          assert summary['decision'] == 'stage153_coarse_endpoint_cancellation_without_single_channel_dominance_stage154_coarse_endpoint_support_audit'
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'Stage 90 remains nonconverged' in summary['negative_result_guard']
          assert 'diagnostics, not solver parameters' in summary['negative_result_guard']
          with np.load(root / 'left_channel_endpoint_balance.npz') as data:
              assert data['fine_components'].shape == (2,)
              assert data['coarse_components'].shape == (2,)
              assert data['combined_endpoints'].shape == (2,)
              assert data['endpoint_cancellation_fractions'].shape == (2,)
              assert data['endpoint_stronger_absolute_shares'].shape == (2,)
              assert data['component_scale_increments'].shape == (2,)
              assert np.isfinite(data['combined_endpoints']).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage153-left-channel-endpoint-balance-audit
          path: /tmp/stage153_left_channel_endpoint_balance_audit
          retention-days: 30

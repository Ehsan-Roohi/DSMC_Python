name: Vision-guided DSMC Stage 107

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage107_limiter_activation_colocation_audit.py'
      - 'vision_guided_dsmc/tests/test_stage107_limiter_activation_colocation_audit.py'
      - 'vision_guided_dsmc/results/stage106_gradient_magnitude_coupling_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage107.yml'

permissions:
  actions: read
  contents: read

jobs:
  limiter-activation-colocation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 107 and retained fixed-design guards
        run: |
          pytest -q \
            tests/test_stage107_limiter_activation_colocation_audit.py \
            tests/test_stage106_gradient_magnitude_coupling_audit.py \
            tests/test_stage105_directional_gradient_alignment_audit.py \
            tests/test_stage104_interior_gradient_scale_audit.py \
            tests/test_stage103_shell1_spatial_localization_audit.py \
            tests/test_stage102_radial_speed_shell_audit.py \
            tests/test_stage101_interior_velocity_sector_audit.py \
            tests/test_stage100_fused_single_run_directional_audit.py \
            tests/test_stage99_replay_provenance_audit.py \
            tests/test_stage98_directional_operator_growth_audit.py \
            tests/test_stage97_muscl_correction_spatial_localization_audit.py \
            tests/test_stage96_muscl_correction_growth_audit.py \
            tests/test_stage90_single_condition_reconstruction_solver_ab_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 106 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage106-gradient-magnitude-coupling-audit
          path: /tmp/stage106_gradient_magnitude_coupling_audit
          run-id: 31493094393
          github-token: ${{ github.token }}
      - name: Verify exact Stage 106 payload provenance
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage106_gradient_magnitude_coupling_audit/summary.json': '2eb04fe9b1e1eeff963189b9d7c6af39f0738a5c181a2e0b2847502d0878f80b',
              '/tmp/stage106_gradient_magnitude_coupling_audit/gradient_magnitude_coupling_maps.npz': '84c1009f54c71454b31a074563d2339a6cf7e791e6062ef3e2a4da59ed8a4413',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 107 frozen limiter activation colocation audit
        run: |
          python -m vgdsmc.stage107_limiter_activation_colocation_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage106-artifact-dir /tmp/stage106_gradient_magnitude_coupling_audit \
            --output-dir /tmp/stage107_limiter_activation_colocation_audit
      - name: Verify Stage 107 fixed design and negative-result guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage107_limiter_activation_colocation_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 107
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['correction_floor'] == 0.05
          assert cfg['diagnostic_steps'] == 25
          assert cfg['wall_band_cells'] == 4
          assert cfg['dominant_radial_shell'] == 1
          assert cfg['shell_velocity_point_count'] == 960
          assert cfg['support_quantile'] == 0.75
          assert cfg['colocation_enrichment_guard'] == 1.25
          assert cfg['colocation_overlap_guard'] == 0.50
          assert cfg['pair_weight_share_guard'] == 0.75
          assert cfg['parent_closure_tolerance'] == 1.0e-12
          assert cfg['activation_state'] == 'stage67_pre_replay_initial_state'
          assert cfg['stage67_run_id'] == 30991124477
          assert cfg['stage67_job_id'] == 92257254811
          assert cfg['stage67_artifact_id'] == 8931272132
          assert cfg['stage106_run_id'] == 31493094393
          assert cfg['stage106_job_id'] == 93784067866
          assert cfg['stage106_artifact_id'] == 9109429586
          assert cfg['full_solver_endpoint_rerun'] is False
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['one_sided_boundary_slope_promoted'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          assert cfg['solver_endpoint_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          assert summary['stage106_authorization']['decision'] == 'stage106_common_gradient_magnitude_coupling_stage107_frozen_limiter_activation_colocation_audit'
          allowed = {
              'stage107_nonfinite_limiter_colocation_blocker_without_retuning',
              'stage107_limiter_intervention_colocated_stage108_limiter_severity_correction_amplitude_coupling_audit',
              'stage107_partial_limiter_colocation_stage108_continuous_intervention_rank_coupling_audit',
              'stage107_no_material_limiter_colocation_stage108_unlimited_gradient_smoothness_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 99 remains a negative cross-run reproducibility result' in summary['negative_result_guard']
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'no cross-Knudsen MUSCL extension is permitted' in summary['negative_result_guard']
          with np.load(root / 'limiter_activation_colocation_maps.npz') as data:
              assert set(data.files) == {
                  'phi_intervention_fraction', 'psi_intervention_fraction',
                  'joint_intervention_fraction',
                  'phi_zeroed_velocity_weight_fraction', 'psi_zeroed_velocity_weight_fraction',
                  'stage106_common_high_gradient_mask',
                  'phi_high_intervention_support', 'psi_high_intervention_support',
                  'joint_high_intervention_support', 'stage106_pair_gradient_weight'
              }
              for name in data.files:
                  assert data[name].shape == (56, 56)
                  assert np.isfinite(data[name]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage107-limiter-activation-colocation-audit
          path: /tmp/stage107_limiter_activation_colocation_audit
          retention-days: 30

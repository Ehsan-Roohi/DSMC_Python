name: Vision-guided DSMC Stage 39

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage39_collision_model_benchmark_audit.py'
      - 'vision_guided_dsmc/tests/test_stage39_collision_model_benchmark_audit.py'
      - 'vision_guided_dsmc/results/stage38_transport_collision_interaction_audit_summary.json'
      - '.github/workflows/vision-guided-dsmc-stage39.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage39_collision_model_benchmark_audit.py'
      - 'vision_guided_dsmc/tests/test_stage39_collision_model_benchmark_audit.py'
      - 'vision_guided_dsmc/results/stage38_transport_collision_interaction_audit_summary.json'
      - '.github/workflows/vision-guided-dsmc-stage39.yml'

jobs:
  collision-model-benchmark-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 39 and retained low-Kn infrastructure
        run: |
          pytest -q \
            tests/test_stage39_collision_model_benchmark_audit.py \
            tests/test_stage38_transport_collision_interaction_audit.py \
            tests/test_stage37_low_kn_transport_audit.py \
            tests/test_stage36_high_resolution_cross_kn.py \
            tests/test_second_order_transport.py \
            tests/test_stage34_velocity_scale_consistency.py \
            tests/test_reduced_spherical_solver.py
      - name: Run canonical collision-model and benchmark-convention audit
        run: |
          python -m vgdsmc.stage39_collision_model_benchmark_audit \
            --output-dir /tmp/stage39_collision_model_benchmark_audit \
            --max-steps 16000 --tolerance 2e-5
      - name: Verify frozen design, exact reproduction, and retained endpoints
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage39_collision_model_benchmark_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 39
          cfg = summary['configuration']
          assert cfg['kn0'] == 0.1
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['grid'] == [24, 24]
          assert cfg['quadrature'] == 'spherical_matched_r16_mu12_phi24'
          assert cfg['velocity_point_count'] == 4608
          assert cfg['relaxation_mapping'] == 'sqrt(2)*Kn0/sqrt(pi) in c0 coordinates'
          assert cfg['transport'] == 'first_order_upwind'
          assert cfg['coupling'] == 'strang_explicit_half_collision'
          assert cfg['collision_models'] == [
              {'name': 'shakhov_pr_2_over_3', 'prandtl': 2.0 / 3.0},
              {'name': 'bgk_pr_1', 'prandtl': 1.0},
          ]
          assert cfg['wall_observable'] == 'linear_extrapolated_wall'
          assert cfg['coordinate_variants'] == [
              'direct', 'reverse_y', 'flip_tangential_sign',
              'reverse_y_and_flip_sign'
          ]
          assert cfg['cfl'] == 0.2
          assert cfg['physical_parameter_retuning'] is False

          retained = summary['retained_stage38_endpoint']
          assert retained['workflow_run_id'] == 30714512141
          assert retained['workflow_job_id'] == 91407706438
          assert retained['tests_passed'] == 54
          assert retained['tests_failed'] == 0
          assert retained['artifact_id'] == 8823968646
          assert retained['artifact_sha256'] == (
              'b9d17b291c2cefe5ead6b0953de2547296ec617ed2855c825d8c15610b06159d'
          )
          reproduction = summary['stage38_shakhov_reproduction']
          assert reproduction['within_tolerance'] is True
          assert reproduction['qav_absolute_difference'] <= 1e-12
          assert reproduction['qav_error_absolute_difference'] <= 1e-12
          assert reproduction['velocity_rms_absolute_difference'] <= 1e-12
          assert reproduction['iterations_difference'] == 0

          assert [row['collision_model'] for row in summary['rows']] == [
              'Shakhov', 'BGK'
          ]
          assert [row['prandtl'] for row in summary['rows']] == [2.0 / 3.0, 1.0]
          for row in summary['rows']:
              assert row['converged'] in {True, False}
              for key in (
                  'final_change', 'predicted_qav', 'literature_qav',
                  'qav_relative_error', 'wall_mass_balance_relative_error',
                  'minimum_distribution', 'minimum_temperature',
                  'maximum_temperature', 'dt', 'work_proxy',
              ):
                  assert math.isfinite(row[key])
              assert row['wall_mass_balance_relative_error'] < 1e-10
              assert row['minimum_distribution'] > 0.0
              assert row['minimum_temperature'] > 0.0
              variants = row['coordinate_variant_metrics']
              assert tuple(variants) == (
                  'direct', 'reverse_y', 'flip_tangential_sign',
                  'reverse_y_and_flip_sign'
              )
              for metrics in variants.values():
                  for value in metrics.values():
                      assert math.isfinite(value)

          for value in summary['comparison'].values():
              assert math.isfinite(value)
          assert summary['decision'] in {
              'stage39_reproduction_mismatch_blocker',
              'stage39_nonconvergence_stage40_numerical_stability_audit',
              'benchmark_coordinate_convention_flag_stage40_source_table_audit',
              'canonical_bgk_sensitivity_stage40_independent_collision_model_audit',
              'mixed_collision_model_sensitivity_stage40_external_benchmark_audit',
              'collision_model_and_simple_conventions_do_not_explain_stage40_external_reference_audit',
          }

          arrays = np.load(root / 'fields_and_profiles.npz')
          for model in ('shakhov', 'bgk'):
              for key in (
                  f'bottom_heat_flux_{model}',
                  f'residual_history_{model}',
                  f'T_{model}',
                  f'rho_{model}',
                  f'table_velocity_linear_extrapolated_wall_{model}',
                  f'table_velocity_variant_direct_{model}',
                  f'table_velocity_variant_reverse_y_{model}',
                  f'table_velocity_variant_flip_tangential_sign_{model}',
                  f'table_velocity_variant_reverse_y_and_flip_sign_{model}',
              ):
                  assert np.isfinite(arrays[key]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage39-collision-model-benchmark-audit
          path: /tmp/stage39_collision_model_benchmark_audit
          retention-days: 30

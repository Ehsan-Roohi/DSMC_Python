name: Vision-guided DSMC Stage 98

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage98_directional_operator_growth_audit.py'
      - 'vision_guided_dsmc/tests/test_stage98_directional_operator_growth_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage98.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage98_directional_operator_growth_audit.py'
      - 'vision_guided_dsmc/tests/test_stage98_directional_operator_growth_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage98.yml'

permissions:
  actions: read
  contents: read

jobs:
  directional-operator-growth-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 98 and retained fixed-design guards
        run: |
          pytest -q \
            tests/test_stage98_directional_operator_growth_audit.py \
            tests/test_stage97_muscl_correction_spatial_localization_audit.py \
            tests/test_stage96_muscl_correction_growth_audit.py \
            tests/test_stage90_single_condition_reconstruction_solver_ab_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 97 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage97-muscl-correction-spatial-localization-audit
          path: /tmp/stage97_muscl_correction_spatial_localization_audit
          run-id: 31351436518
          github-token: ${{ github.token }}
      - name: Run Stage 98 fixed directional-operator growth audit
        run: |
          python -m vgdsmc.stage98_directional_operator_growth_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage97-artifact-dir /tmp/stage97_muscl_correction_spatial_localization_audit \
            --output-dir /tmp/stage98_directional_operator_growth_audit
      - name: Verify fixed design and negative-result guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage98_directional_operator_growth_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 98
          assert summary['retained_stage97_decision'] == (
              'stage97_interior_dominant_redistribution_stage98_directional_operator_growth_audit'
          )
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['positivity_floor'] == 1.0e-30
          assert cfg['correction_floor'] == 0.05
          assert cfg['diagnostic_steps'] == 25
          assert cfg['directional_dominance_share'] == 2.0 / 3.0
          assert cfg['material_directional_growth_ratio'] == 2.0
          assert cfg['material_cancellation_ratio'] == 0.50
          assert cfg['stage67_run_id'] == 30991124477
          assert cfg['stage97_run_id'] == 31351436518
          assert cfg['stage97_artifact_id'] == 9051881261
          assert cfg['fixed_diagnostic_replay'] is True
          assert cfg['full_solver_endpoint_rerun'] is False
          assert cfg['solver_endpoint_search'] is False
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['one_sided_boundary_slope_promoted'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          assert cfg['solver_endpoint_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          assert np.isfinite(summary['maximum_decomposition_closure_relative_l2'])
          assert np.isfinite(summary['maximum_parent_map_replay_relative_l2'])
          for distribution in ('phi', 'psi'):
              traces = summary['directional_growth'][distribution]
              for metric in (
                  'x_weighted_abs', 'y_weighted_abs', 'net_weighted_abs',
                  'x_l2', 'y_l2', 'net_l2',
                  'x_directional_abs_share', 'y_directional_abs_share',
                  'weighted_abs_cancellation_ratio', 'l2_cancellation_ratio',
                  'decomposition_closure_relative_l2',
              ):
                  for value in traces[metric].values():
                      assert np.isfinite(value)

          allowed = {
              'stage98_decomposition_or_replay_mismatch_blocker_without_retuning',
              'stage98_x_dominant_growing_operator_stage99_x_signed_lobe_localization_audit',
              'stage98_y_dominant_growing_operator_stage99_y_signed_lobe_localization_audit',
              'stage98_material_cross_axis_cancellation_stage99_signed_cancellation_localization_audit',
              'stage98_mixed_directional_growth_stage99_interior_velocity_sector_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 90 remains nonconverged in both reconstruction arms' in summary['negative_result_guard']
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'one-sided boundary slope is not promoted' in summary['negative_result_guard']

          with np.load(root / 'directional_operator_growth_histories.npz') as data:
              for distribution in ('phi', 'psi'):
                  for metric in (
                      'x_weighted_abs', 'y_weighted_abs', 'net_weighted_abs',
                      'x_directional_abs_share', 'y_directional_abs_share',
                      'weighted_abs_cancellation_ratio', 'decomposition_closure_relative_l2',
                  ):
                      name = f'{distribution}_{metric}'
                      assert data[name].shape == (25,)
                      assert np.isfinite(data[name]).all()
                  for when in ('first', 'final'):
                      for map_name in (
                          'x_signed_m0', 'y_signed_m0', 'net_signed_m0',
                          'x_abs_m0', 'y_abs_m0', 'net_abs_m0', 'parent_net_abs_m0',
                      ):
                          name = f'{when}_{distribution}_{map_name}'
                          assert data[name].shape == (64, 64)
                          assert np.isfinite(data[name]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage98-directional-operator-growth-audit
          path: /tmp/stage98_directional_operator_growth_audit
          retention-days: 30

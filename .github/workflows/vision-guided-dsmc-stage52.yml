name: Vision-guided DSMC Stage 52

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage52_velocity_resolution_audit.py'
      - 'vision_guided_dsmc/tests/test_stage52_velocity_resolution_audit.py'
      - 'vision_guided_dsmc/results/stage51_heat_flux_definition_audit_summary.json'
      - '.github/workflows/vision-guided-dsmc-stage52.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage52_velocity_resolution_audit.py'
      - 'vision_guided_dsmc/tests/test_stage52_velocity_resolution_audit.py'
      - 'vision_guided_dsmc/results/stage51_heat_flux_definition_audit_summary.json'
      - '.github/workflows/vision-guided-dsmc-stage52.yml'

permissions:
  contents: read
  actions: read

jobs:
  velocity-resolution-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 52 and retained projected-polar infrastructure
        run: |
          pytest -q \
            tests/test_stage52_velocity_resolution_audit.py \
            tests/test_stage51_heat_flux_definition_audit.py \
            tests/test_stage50_projected_polar_cross_kn_extension.py \
            tests/test_stage49_projected_polar_64x64_confirmation.py \
            tests/test_stage48_projected_polar_56x56_confirmation.py \
            tests/test_stage47_projected_polar_48x48_confirmation.py \
            tests/test_stage46_projected_polar_40x40_confirmation.py \
            tests/test_stage45_projected_polar_32x32_confirmation.py \
            tests/test_stage44_projected_polar_finer_grid_sequence.py \
            tests/test_stage43_projected_polar_resolution_sequence.py \
            tests/test_stage42_projected_polar_heated_cavity_pilot.py \
            tests/test_stage40_external_benchmark_fidelity_audit.py \
            tests/test_reduced_spherical_solver.py
      - name: Download exact completed Stage 50 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage50-projected-polar-cross-kn-extension
          path: /tmp/stage50_projected_polar_cross_kn_extension
          run-id: 30776673982
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact completed Stage 51 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage51-heat-flux-definition-audit
          path: /tmp/stage51_heat_flux_definition_audit
          run-id: 30781991799
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run frozen Stage 52 velocity-resolution audit
        run: |
          python -m vgdsmc.stage52_velocity_resolution_audit \
            --stage50-artifact-dir /tmp/stage50_projected_polar_cross_kn_extension \
            --stage51-artifact-dir /tmp/stage51_heat_flux_definition_audit \
            --output-dir /tmp/stage52_velocity_resolution_audit
      - name: Verify provenance, frozen design and explicit scientific endpoint
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage52_velocity_resolution_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 52
          retained = summary['retained_stage51_endpoint']
          assert retained['workflow_run_id'] == 30781991799
          assert retained['workflow_job_id'] == 91588361434
          assert retained['workflow_conclusion'] == 'success'
          assert retained['tests_passed'] == 71
          assert retained['tests_failed'] == 0
          assert retained['artifact_id'] == 8845163403
          assert retained['artifact_sha256'] == (
              '95cbcb84bb57386a8d88d191566af4a2138ca62f49c3304737fd45aa7b89f974'
          )

          cfg = summary['configuration']
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['grid'] == [64, 64]
          assert cfg['baseline_rule'] == {
              'radial_nodes': 32, 'angular_nodes': 96, 'point_count': 3072,
          }
          assert cfg['audit_rules'] == [
              {'name': 'radial_refined', 'radial_nodes': 40, 'angular_nodes': 96, 'point_count': 3840},
              {'name': 'angular_refined', 'radial_nodes': 32, 'angular_nodes': 120, 'point_count': 3840},
              {'name': 'coupled_refined', 'radial_nodes': 40, 'angular_nodes': 120, 'point_count': 4800},
          ]
          for key in (
              'physical_parameter_retuning', 'collision_parameter_retuning',
              'transport_retuning', 'wall_model_retuning',
              'normalization_retuning', 'radial_mapping_scale_retuning',
          ):
              assert cfg[key] is False
          assert cfg['quadrature_resolution_is_preregistered_audit_variable'] is True

          baseline = summary['baseline_case']
          assert baseline['kn0'] == 10.0
          assert baseline['iterations'] == 775
          assert baseline['converged'] is True
          assert math.isclose(
              baseline['predicted_qav'], 0.22492827563466516,
              rel_tol=0.0, abs_tol=1e-15,
          )
          assert math.isclose(
              baseline['qav_relative_error'], 0.26364199794755716,
              rel_tol=0.0, abs_tol=1e-15,
          )

          names = ['radial_refined', 'angular_refined', 'coupled_refined']
          assert [case['name'] for case in summary['audit_cases']] == names
          assert set(summary['comparisons_to_baseline']) == set(names)
          for case in summary['audit_cases']:
              assert case['kn0'] == 10.0
              assert case['grid'] == [64, 64]
              assert isinstance(case['converged'], bool)
              assert isinstance(case['finite'], bool)
              path = root / f"{case['name']}_fields_and_profiles.npz"
              with np.load(path) as data:
                  assert {
                      'T', 'rho', 'u', 'v', 'qx', 'qy', 'bottom_heat_flux'
                  }.issubset(data.files)
                  if case['finite']:
                      assert math.isfinite(case['predicted_qav'])
                      assert math.isfinite(case['qav_relative_error'])
                      assert math.isfinite(case['velocity_metrics']['relative_rms'])
                      assert np.isfinite(data['T']).all()

          allowed = {
              'radial_refined_materially_improves_stage53_cross_kn_confirmation',
              'angular_refined_materially_improves_stage53_cross_kn_confirmation',
              'coupled_refined_materially_improves_stage53_cross_kn_confirmation',
              'velocity_resolution_small_or_mixed_effect_stage53_radial_mapping_tail_audit',
              'velocity_point_count_does_not_explain_cross_kn_heat_flux_stage53_projected_collision_moment_audit',
              'stage52_velocity_resolution_stable_nonconverged_stage53_fixed_point_audit',
              'stage52_velocity_resolution_numerical_blocker',
          }
          assert summary['decision'] in allowed
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage52-velocity-resolution-audit
          path: /tmp/stage52_velocity_resolution_audit
          retention-days: 30

name: Vision-guided DSMC Stage 110

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage110_same_sign_slope_asymmetry_audit.py'
      - 'vision_guided_dsmc/tests/test_stage110_same_sign_slope_asymmetry_audit.py'
      - 'vision_guided_dsmc/results/stage109_limiter_intervention_mode_decomposition_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage110.yml'

permissions:
  actions: read
  contents: read

jobs:
  same-sign-slope-asymmetry-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 110 and retained fixed-design guards
        run: |
          pytest -q \
            tests/test_stage110_same_sign_slope_asymmetry_audit.py \
            tests/test_stage109_limiter_intervention_mode_decomposition_audit.py \
            tests/test_stage108_limiter_severity_correction_amplitude_coupling_audit.py \
            tests/test_stage107_limiter_activation_colocation_audit.py \
            tests/test_stage106_gradient_magnitude_coupling_audit.py \
            tests/test_stage105_directional_gradient_alignment_audit.py \
            tests/test_stage104_interior_gradient_scale_audit.py \
            tests/test_stage103_shell1_spatial_localization_audit.py \
            tests/test_stage102_radial_speed_shell_audit.py \
            tests/test_stage101_interior_velocity_sector_audit.py \
            tests/test_stage100_fused_single_run_directional_audit.py \
            tests/test_stage99_replay_provenance_audit.py \
            tests/test_stage98_directional_operator_growth_audit.py \
            tests/test_stage97_muscl_correction_spatial_localization_audit.py \
            tests/test_stage96_muscl_correction_growth_audit.py \
            tests/test_stage90_single_condition_reconstruction_solver_ab_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 109 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage109-limiter-intervention-mode-decomposition-audit
          path: /tmp/stage109_limiter_intervention_mode_decomposition_audit
          run-id: 31553717856
          github-token: ${{ github.token }}
      - name: Verify exact Stage 67 and Stage 109 payload provenance
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage67_frozen_full_distribution_residual_decomposition/summary.json': 'e04043a1913b2fa9ae57fe1561aa26c70627830d648e91204093c8f1fb57b3d1',
              '/tmp/stage67_frozen_full_distribution_residual_decomposition/converged_full_distributions.npz': 'd4002a2765137ba517abec2d0483a3e5adcf13f415c53259018556bd14d612d1',
              '/tmp/stage109_limiter_intervention_mode_decomposition_audit/summary.json': 'ae5942c05221b0e6bf68b22f5547a7bb762649fd30eaab7cfe381e7848267416',
              '/tmp/stage109_limiter_intervention_mode_decomposition_audit/limiter_intervention_mode_decomposition_maps.npz': '37b57cd484a2ab0426c93599fdf0fb84b2392c93e31314738d66edd1dc7f993b',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 110 frozen same-sign slope asymmetry audit
        run: |
          python -m vgdsmc.stage110_same_sign_slope_asymmetry_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage109-artifact-dir /tmp/stage109_limiter_intervention_mode_decomposition_audit \
            --output-dir /tmp/stage110_same_sign_slope_asymmetry_audit
      - name: Verify Stage 110 fixed design and negative-result guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage110_same_sign_slope_asymmetry_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 110
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['correction_floor'] == 0.05
          assert cfg['diagnostic_steps'] == 25
          assert cfg['wall_band_cells'] == 4
          assert cfg['dominant_radial_shell'] == 1
          assert cfg['radial_shell_count'] == 4
          assert cfg['radial_nodes_per_shell'] == 10
          assert cfg['shell_velocity_point_count'] == 960
          assert cfg['lower_quantile'] == 0.25
          assert cfg['upper_quantile'] == 0.75
          assert cfg['mode_closure_tolerance'] == 1.0e-12
          assert cfg['asymmetry_rank_coupling_guard'] == 0.50
          assert cfg['quartile_amplitude_ratio_guard'] == 1.50
          assert cfg['stage67_run_id'] == 30991124477
          assert cfg['stage67_job_id'] == 92257254811
          assert cfg['stage67_artifact_id'] == 8931272132
          assert cfg['stage109_run_id'] == 31553717856
          assert cfg['stage109_job_id'] == 93981657168
          assert cfg['stage109_artifact_id'] == 9129826604
          assert cfg['full_solver_endpoint_rerun'] is False
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['one_sided_boundary_slope_promoted'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          assert cfg['solver_endpoint_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          assert summary['stage109_authorization']['decision'] == 'stage109_same_sign_amplitude_mode_dominates_stage110_same_sign_slope_asymmetry_audit'
          assert summary['max_mode_closure_relative_l2'] <= 1.0e-12
          allowed = {
              'stage110_nonfinite_same_sign_asymmetry_blocker_without_retuning',
              'stage110_same_sign_mode_closure_blocker_without_retuning',
              'stage110_relative_same_sign_asymmetry_coupled_stage111_axis_conditioned_asymmetry_audit',
              'stage110_same_sign_gradient_strength_coupled_stage111_gradient_strength_conditioning_audit',
              'stage110_same_sign_mode_not_explained_by_single_factor_stage111_joint_factor_spatial_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 99 remains a negative cross-run reproducibility result' in summary['negative_result_guard']
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'no cross-Knudsen MUSCL extension is permitted' in summary['negative_result_guard']
          with np.load(root / 'same_sign_slope_asymmetry_maps.npz') as data:
              expected = {
                  'phi_same_sign_change_weighted_abs', 'phi_same_sign_centered_slope_weighted_abs',
                  'phi_same_sign_relative_asymmetry', 'phi_same_sign_support_weight_fraction',
                  'phi_growth_amplitude', 'phi_stage109_same_sign_intervention_fraction',
                  'psi_same_sign_change_weighted_abs', 'psi_same_sign_centered_slope_weighted_abs',
                  'psi_same_sign_relative_asymmetry', 'psi_same_sign_support_weight_fraction',
                  'psi_growth_amplitude', 'psi_stage109_same_sign_intervention_fraction',
                  'common_relative_same_sign_asymmetry', 'common_same_sign_gradient_strength',
                  'joint_growth_amplitude', 'stage109_common_same_sign_intervention_fraction',
              }
              assert set(data.files) == expected
              for name in data.files:
                  assert data[name].shape == (56, 56)
                  assert np.isfinite(data[name]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage110-same-sign-slope-asymmetry-audit
          path: /tmp/stage110_same_sign_slope_asymmetry_audit
          retention-days: 30

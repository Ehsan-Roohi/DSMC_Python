name: Vision-guided DSMC Stage 143

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage143_positive_lobe_scale_audit.py'
      - 'vision_guided_dsmc/tests/test_stage143_positive_lobe_scale_audit.py'
      - 'vision_guided_dsmc/results/stage142_sampled_sign_margin_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage143.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage143_positive_lobe_scale_audit.py'
      - 'vision_guided_dsmc/tests/test_stage143_positive_lobe_scale_audit.py'
      - 'vision_guided_dsmc/results/stage142_sampled_sign_margin_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage143.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  positive-lobe-scale-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 141-143 fixed-design guards
        run: |
          pytest -q \
            tests/test_stage141_node_leverage_audit.py \
            tests/test_stage142_sampled_sign_margin_audit.py \
            tests/test_stage143_positive_lobe_scale_audit.py
      - name: Download exact completed Stage 142 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage142-sampled-sign-margin-audit
          path: /tmp/stage142_sampled_sign_margin_audit
          run-id: 32270422318
          github-token: ${{ github.token }}
      - name: Verify exact Stage 142 payload digests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage142_sampled_sign_margin_audit/summary.json': '29eaa1bbd8307fcbfabe50fddec0c4f983332ffd719828b1c8f0faa1a34838ea',
              '/tmp/stage142_sampled_sign_margin_audit/sampled_sign_margin.npz': 'c6b7e92b4dae20ff324ccb66d248e4a87a939598b303c4f2b4c65b14fc7cc7ce',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 143 positive-lobe scale audit
        run: |
          python -m vgdsmc.stage143_positive_lobe_scale_audit \
            --stage142-dir /tmp/stage142_sampled_sign_margin_audit \
            --stage142-record results/stage142_sampled_sign_margin_audit_observed.json \
            --output-dir /tmp/stage143_positive_lobe_scale_audit
      - name: Verify Stage 143 scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage143_positive_lobe_scale_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 143
          assert summary['finite'] is True
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['interior_grid'] == [56, 56]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['correction_floor'] == 0.05
          assert cfg['witness_node'] == 9
          assert cfg['pair_sectors'] == [5, 6]
          assert cfg['dominant_mirrored_sector'] == 6
          assert cfg['min_later_positive_samples'] == 4
          assert cfg['min_later_positive_sign_coherence'] == 1.0
          assert cfg['coherent_cv_max'] == 0.5
          assert cfg['coherent_effective_count_min'] == 3.0
          assert cfg['coherent_peak_to_median_max'] == 2.0
          assert cfg['positive_lobe_scale_used_for_solver'] is False
          assert cfg['solver_rerun'] is False
          assert cfg['solver_endpoint_advanced'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['benchmark_or_validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          assert summary['aggregate']['parent_record_ok'] is True
          assert summary['aggregate']['parent_route_ok'] is True
          assert summary['aggregate']['sufficient_support'] is True
          allowed = {
              'stage143_broad_coherent_positive_lobe_scale_stage144_positive_lobe_shape_audit',
              'stage143_concentrated_positive_lobe_scale_stage144_positive_lobe_concentration_audit',
              'stage143_variable_positive_lobe_scale_stage144_positive_lobe_variability_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'Stage 90 remains nonconverged' in summary['negative_result_guard']
          assert 'diagnostics, not solver parameters' in summary['negative_result_guard']
          with np.load(root / 'positive_lobe_scale.npz') as data:
              assert data['positive_side_depth'].shape == (5,)
              assert data['positive_side_values'].shape == (5,)
              assert data['later_positive_depth'].shape == (4,)
              assert data['later_positive_values'].shape == (4,)
              assert np.isfinite(data['later_positive_values']).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage143-positive-lobe-scale-audit
          path: /tmp/stage143_positive_lobe_scale_audit
          retention-days: 30

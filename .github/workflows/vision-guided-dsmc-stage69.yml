name: Vision-guided DSMC Stage 69

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage69_frozen_grid_transfer_residual_scaling_audit.py'
      - 'vision_guided_dsmc/tests/test_stage69_frozen_grid_transfer_residual_scaling_audit.py'
      - 'vision_guided_dsmc/results/stage68_independent_transport_operator_residual_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage69.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage69_frozen_grid_transfer_residual_scaling_audit.py'
      - 'vision_guided_dsmc/tests/test_stage69_frozen_grid_transfer_residual_scaling_audit.py'
      - 'vision_guided_dsmc/results/stage68_independent_transport_operator_residual_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage69.yml'

permissions:
  actions: read
  contents: read

jobs:
  frozen-grid-transfer-residual-scaling-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 69 and retained transport-audit endpoints
        run: |
          pytest -q \
            tests/test_stage69_frozen_grid_transfer_residual_scaling_audit.py \
            tests/test_stage68_independent_transport_operator_residual_audit.py \
            tests/test_stage67_frozen_full_distribution_residual_decomposition.py \
            tests/test_stage66_frozen_collision_source_observable_audit.py \
            tests/test_stage65_local_clipping_activation_map_audit.py \
            tests/test_stage64_source_step_consistency_audit.py \
            tests/test_stage63_collision_target_equivalence_audit.py \
            tests/test_stage62_finite_kn_normalization_audit.py \
            tests/test_stage60_transport_wall_equation_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 68 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage68-independent-transport-operator-residual-audit
          path: /tmp/stage68_independent_transport_operator_residual_audit
          run-id: 31010112390
          github-token: ${{ github.token }}
      - name: Run Stage 69 frozen grid-transfer residual scaling audit
        run: |
          python -m vgdsmc.stage69_frozen_grid_transfer_residual_scaling_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage68-artifact-dir /tmp/stage68_independent_transport_operator_residual_audit \
            --output-dir /tmp/stage69_frozen_grid_transfer_residual_scaling_audit
      - name: Verify provenance, conservative restriction, scaling, and guards
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage69_frozen_grid_transfer_residual_scaling_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 69
          endpoint = summary['retained_stage68_endpoint']
          assert endpoint['workflow_run_id'] == 31010112390
          assert endpoint['workflow_job_id'] == 92319799599
          assert endpoint['artifact_id'] == 8938442470
          assert endpoint['tests_passed'] == 87
          assert endpoint['tests_failed'] == 0
          assert endpoint['artifact_sha256'] == (
              'd38fcf90e998341a8ed1ad443ac3de8a1597a91a89c454e8430491ff75751ea6'
          )
          assert endpoint['summary_sha256'] == (
              '67e8ab90c900d57f39ac1fe5f0835ca0346684da26964fb786bfb3f1c10bd06d'
          )
          assert endpoint['moment_maps_sha256'] == (
              '0e8ba77f6c6cd1ca98bc7d22c0e4b41d81e7ba99c0fcca922809804f79d3ad7d'
          )

          cfg = summary['configuration']
          assert cfg['grids'] == [16, 32, 64]
          assert cfg['fine_grid'] == 64
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['restriction'] == (
              'conservative_cell_average_from_exact_stage67_64x64_distribution'
          )
          assert cfg['wall_band_physical_fraction'] == 1.0 / 16.0
          assert cfg['material_heat_flux_ratio'] == 0.10
          assert cfg['solver_rerun_count'] == 0
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          assert summary['finite'] is True
          assert summary['restriction_conservative'] is True
          assert summary['provenance_consistent'] is True
          endpoint_check = summary['endpoint_consistency']
          assert endpoint_check['within_guard'] is True
          assert endpoint_check['maximum_relative_l2_error'] <= 1.0e-10
          assert endpoint_check['stage68_ratio_consistent'] is True
          assert endpoint_check['stage68_wall_share_consistent'] is True

          for grid, factor, layers in ((16, 4, 1), (32, 2, 2), (64, 1, 4)):
              restriction = summary['restriction_checks'][str(grid)]
              assert restriction['factor'] == factor
              assert restriction['finite'] is True
              assert restriction['phi']['within_guard'] is True
              assert restriction['psi']['within_guard'] is True
              result = summary['grid_results'][str(grid)]
              assert result['grid'] == [grid, grid]
              assert result['wall_band_layers'] == layers
              qy = result['normal_heat_flux']
              for value in qy.values():
                  assert math.isfinite(value)

          scaling = summary['normal_heat_flux_scaling']
          assert len(scaling['full_difference_rms_sequence']) == 3
          assert len(scaling['interior_difference_rms_sequence']) == 3
          for value in scaling['full_difference_rms_sequence']:
              assert math.isfinite(value) and value > 0.0
          for value in scaling['interior_difference_rms_sequence']:
              assert math.isfinite(value) and value > 0.0
          for value in scaling['full_observed_orders'].values():
              assert math.isfinite(value)
          for value in scaling['interior_observed_orders'].values():
              assert math.isfinite(value)
          assert math.isclose(
              scaling['fine_grid_difference_ratio'],
              2.711059451870935,
              rel_tol=1e-10,
              abs_tol=1e-10,
          )
          assert math.isclose(
              scaling['fine_grid_wall_band_absolute_share'],
              0.6047289196255863,
              rel_tol=1e-10,
              abs_tol=1e-10,
          )

          allowed = {
              'stage69_nonfinite_grid_transfer_blocker',
              'stage69_completed_endpoint_reproduction_blocker',
              'stage69_conservative_restriction_blocker',
              'stage69_nonmonotone_frozen_grid_transfer_blocker',
              'stage69_monotone_but_wall_dominated_slow_full_scaling_stage70_independent_wall_face_flux_discretization_audit',
              'stage69_monotone_material_nonwall_residual_stage70_frozen_linearized_response_audit',
              'stage69_transport_difference_scales_below_materiality_stage70_independent_wall_face_flux_discretization_audit',
          }
          assert summary['decision'] in allowed
          assert 'do not predict the sign or magnitude' in summary['interpretation_guard']
          assert 'before any response or solver experiment' in summary['scientifically_justified_next_scope']

          with np.load(root / 'grid_transfer_transport_moment_maps.npz') as maps:
              components = {
                  'retained_first_order', 'independent_second_order', 'difference'
              }
              moments = {'mass', 'momentum_x', 'momentum_y', 'energy', 'qx', 'qy'}
              assert set(maps.files) == {
                  f'grid{grid}_{component}_{moment}'
                  for grid in (16, 32, 64)
                  for component in components
                  for moment in moments
              }
              for name in maps.files:
                  grid = int(name.split('_', 1)[0].replace('grid', ''))
                  assert maps[name].shape == (grid, grid)
                  assert np.all(np.isfinite(maps[name]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage69-frozen-grid-transfer-residual-scaling-audit
          path: /tmp/stage69_frozen_grid_transfer_residual_scaling_audit
          retention-days: 30

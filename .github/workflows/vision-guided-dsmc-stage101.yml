name: Vision-guided DSMC Stage 101

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage101_interior_velocity_sector_audit.py'
      - 'vision_guided_dsmc/tests/test_stage101_interior_velocity_sector_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage101.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage101_interior_velocity_sector_audit.py'
      - 'vision_guided_dsmc/tests/test_stage101_interior_velocity_sector_audit.py'
      - '.github/workflows/vision-guided-dsmc-stage101.yml'

permissions:
  actions: read
  contents: read

jobs:
  interior-velocity-sector-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'

      - name: Test Stage 101 and retained fixed-design guards
        run: |
          pytest -q \
            tests/test_stage101_interior_velocity_sector_audit.py \
            tests/test_stage100_fused_single_run_directional_audit.py \
            tests/test_stage99_replay_provenance_audit.py \
            tests/test_stage98_directional_operator_growth_audit.py \
            tests/test_stage97_muscl_correction_spatial_localization_audit.py \
            tests/test_stage96_muscl_correction_growth_audit.py \
            tests/test_stage90_single_condition_reconstruction_solver_ab_audit.py

      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}

      - name: Download exact completed Stage 100 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage100-fused-single-run-directional-audit
          path: /tmp/stage100_fused_single_run_directional_audit
          run-id: 31423728782
          github-token: ${{ github.token }}

      - name: Verify exact Stage 67 and Stage 100 payload provenance
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              '/tmp/stage67_frozen_full_distribution_residual_decomposition/summary.json':
                  'e04043a1913b2fa9ae57fe1561aa26c70627830d648e91204093c8f1fb57b3d1',
              '/tmp/stage67_frozen_full_distribution_residual_decomposition/converged_full_distributions.npz':
                  'd4002a2765137ba517abec2d0483a3e5adcf13f415c53259018556bd14d612d1',
              '/tmp/stage100_fused_single_run_directional_audit/summary.json':
                  '91d23d59a0d09a1cf34f11cdc2bf9594883aac6b65cf39f3b79b7d308425c85a',
              '/tmp/stage100_fused_single_run_directional_audit/fused_directional_histories.npz':
                  '2ae6a11c7a7e567c139df0dd45617e9fd96b666d00d9c2e5ec3d600febc2a539',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY

      - name: Run Stage 101 interior velocity-sector audit
        run: |
          python -m vgdsmc.stage101_interior_velocity_sector_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage100-artifact-dir /tmp/stage100_fused_single_run_directional_audit \
            --output-dir /tmp/stage101_interior_velocity_sector_audit

      - name: Verify Stage 101 fixed design and negative-result guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage101_interior_velocity_sector_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 101
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['correction_floor'] == 0.05
          assert cfg['diagnostic_steps'] == 25
          assert cfg['wall_band_cells'] == 4
          assert cfg['n_angular_sectors'] == 8
          assert cfg['sector_width_degrees'] == 45.0
          assert cfg['sector_dominance_share'] == 0.25
          assert cfg['material_sector_growth_ratio'] == 2.0
          assert cfg['sector_parent_closure_tolerance'] == 1.0e-12
          assert cfg['stage67_run_id'] == 30991124477
          assert cfg['stage100_run_id'] == 31423728782
          assert cfg['stage100_job_id'] == 93570374447
          assert cfg['stage100_artifact_id'] == 9078152795
          assert cfg['full_solver_endpoint_rerun'] is False
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['one_sided_boundary_slope_promoted'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          assert cfg['solver_endpoint_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          assert summary['stage100_authorization']['decision'] == (
              'stage100_mixed_directional_growth_stage101_interior_velocity_sector_audit'
          )
          assert summary['stage100_authorization']['maximum_decomposition_closure_relative_l2'] <= 1.0e-12
          assert summary['stage100_authorization']['maximum_same_run_parent_map_relative_l2'] <= 1.0e-12
          assert 1 <= summary['executed_steps'] <= 25
          assert np.isfinite(summary['maximum_sector_parent_closure_relative'])

          allowed_prefixes = (
              'stage101_nonfinite_replay_blocker_without_retuning',
              'stage101_sector_parent_closure_blocker_without_retuning',
              'stage101_common_dominant_sector_',
              'stage101_diffuse_velocity_sector_growth_stage102_radial_speed_shell_audit',
          )
          assert summary['decision'].startswith(allowed_prefixes)
          if not summary['decision'].endswith('blocker_without_retuning'):
              assert summary['finite'] is True
              assert summary['executed_steps'] == 25
              assert summary['maximum_sector_parent_closure_relative'] <= 1.0e-12

          assert 'Stage 99 remains a negative cross-run reproducibility result' in summary['negative_result_guard']
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'no cross-Knudsen MUSCL extension is permitted' in summary['negative_result_guard']

          with np.load(root / 'interior_velocity_sector_histories.npz') as data:
              n = summary['executed_steps']
              assert data['velocity_sector_index'].shape == (40 * 96,)
              assert set(np.unique(data['velocity_sector_index']).tolist()) == set(range(8))
              assert data['interior_mask'].shape == (64, 64)
              for distribution in ('phi', 'psi'):
                  for metric in (
                      'sector_weighted_abs',
                      'sector_weighted_signed',
                      'sector_abs_share',
                      'sector_signed_to_abs_ratio',
                  ):
                      name = f'{distribution}_{metric}'
                      assert data[name].shape == (n, 8)
                      assert np.isfinite(data[name]).all()
                  closure = data[f'{distribution}_sector_parent_closure_relative']
                  assert closure.shape == (n,)
                  assert np.isfinite(closure).all()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: stage101-interior-velocity-sector-audit
          path: /tmp/stage101_interior_velocity_sector_audit
          retention-days: 30

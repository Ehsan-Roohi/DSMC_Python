name: Vision-guided DSMC Stage 109

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage109_limiter_intervention_mode_decomposition_audit.py'
      - 'vision_guided_dsmc/tests/test_stage109_limiter_intervention_mode_decomposition_audit.py'
      - 'vision_guided_dsmc/results/stage108_limiter_severity_correction_amplitude_coupling_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage109.yml'

permissions:
  actions: read
  contents: read

jobs:
  limiter-intervention-mode-decomposition-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 109 and retained fixed-design guards
        run: |
          pytest -q \
            tests/test_stage109_limiter_intervention_mode_decomposition_audit.py \
            tests/test_stage108_limiter_severity_correction_amplitude_coupling_audit.py \
            tests/test_stage107_limiter_activation_colocation_audit.py \
            tests/test_stage106_gradient_magnitude_coupling_audit.py \
            tests/test_stage105_directional_gradient_alignment_audit.py \
            tests/test_stage104_interior_gradient_scale_audit.py \
            tests/test_stage103_shell1_spatial_localization_audit.py \
            tests/test_stage102_radial_speed_shell_audit.py \
            tests/test_stage101_interior_velocity_sector_audit.py \
            tests/test_stage100_fused_single_run_directional_audit.py \
            tests/test_stage99_replay_provenance_audit.py \
            tests/test_stage98_directional_operator_growth_audit.py \
            tests/test_stage97_muscl_correction_spatial_localization_audit.py \
            tests/test_stage96_muscl_correction_growth_audit.py \
            tests/test_stage90_single_condition_reconstruction_solver_ab_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 108 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage108-limiter-severity-correction-amplitude-coupling-audit
          path: /tmp/stage108_limiter_severity_correction_amplitude_coupling_audit
          run-id: 31533014130
          github-token: ${{ github.token }}
      - name: Verify exact Stage 67 and Stage 108 payload provenance
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage67_frozen_full_distribution_residual_decomposition/summary.json': 'e04043a1913b2fa9ae57fe1561aa26c70627830d648e91204093c8f1fb57b3d1',
              '/tmp/stage67_frozen_full_distribution_residual_decomposition/converged_full_distributions.npz': 'd4002a2765137ba517abec2d0483a3e5adcf13f415c53259018556bd14d612d1',
              '/tmp/stage108_limiter_severity_correction_amplitude_coupling_audit/summary.json': '8c81a3b2434c13d210e541b1f922fe468a158a78d73060ec03b22b3cbfa2816f',
              '/tmp/stage108_limiter_severity_correction_amplitude_coupling_audit/limiter_severity_correction_amplitude_coupling_maps.npz': 'a90346c97afa828e7aeebb081855d58d2414dc30d94f2c7f0f05518a92b7c9cf',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 109 frozen limiter intervention mode decomposition audit
        run: |
          python -m vgdsmc.stage109_limiter_intervention_mode_decomposition_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage108-artifact-dir /tmp/stage108_limiter_severity_correction_amplitude_coupling_audit \
            --output-dir /tmp/stage109_limiter_intervention_mode_decomposition_audit
      - name: Verify Stage 109 fixed design and negative-result guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage109_limiter_intervention_mode_decomposition_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 109
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['correction_floor'] == 0.05
          assert cfg['diagnostic_steps'] == 25
          assert cfg['wall_band_cells'] == 4
          assert cfg['dominant_radial_shell'] == 1
          assert cfg['radial_shell_count'] == 4
          assert cfg['radial_nodes_per_shell'] == 10
          assert cfg['shell_velocity_point_count'] == 960
          assert cfg['lower_quantile'] == 0.25
          assert cfg['upper_quantile'] == 0.75
          assert cfg['mode_closure_tolerance'] == 1.0e-12
          assert cfg['same_sign_dominance_guard'] == 0.90
          assert cfg['same_sign_rank_coupling_guard'] == 0.50
          assert cfg['quartile_amplitude_ratio_guard'] == 1.50
          assert cfg['zeroing_material_share_guard'] == 0.25
          assert cfg['stage67_run_id'] == 30991124477
          assert cfg['stage67_job_id'] == 92257254811
          assert cfg['stage67_artifact_id'] == 8931272132
          assert cfg['stage108_run_id'] == 31533014130
          assert cfg['stage108_job_id'] == 93917354542
          assert cfg['stage108_artifact_id'] == 9124996033
          assert cfg['full_solver_endpoint_rerun'] is False
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['one_sided_boundary_slope_promoted'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          assert cfg['solver_endpoint_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          assert summary['stage108_authorization']['decision'] == 'stage108_continuous_limiter_severity_coupling_stage109_limiter_intervention_mode_decomposition_audit'
          assert summary['max_mode_closure_relative_l2'] <= 1.0e-12
          allowed = {
              'stage109_nonfinite_mode_decomposition_blocker_without_retuning',
              'stage109_mode_decomposition_closure_blocker_without_retuning',
              'stage109_same_sign_amplitude_mode_dominates_stage110_same_sign_slope_asymmetry_audit',
              'stage109_zeroing_mode_material_stage110_sign_reversal_geometry_audit',
              'stage109_mixed_or_weak_mode_coupling_stage110_mode_conditioned_spatial_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 99 remains a negative cross-run reproducibility result' in summary['negative_result_guard']
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'no cross-Knudsen MUSCL extension is permitted' in summary['negative_result_guard']
          with np.load(root / 'limiter_intervention_mode_decomposition_maps.npz') as data:
              expected = {
                  'phi_zeroing_change_weighted_abs', 'phi_same_sign_amplitude_change_weighted_abs',
                  'phi_centered_slope_weighted_abs', 'phi_zeroing_intervention_fraction',
                  'phi_same_sign_amplitude_intervention_fraction', 'phi_total_intervention_fraction',
                  'phi_zeroing_support_weight_fraction', 'phi_same_sign_amplitude_support_weight_fraction',
                  'phi_growth_amplitude', 'phi_stage108_intervention_fraction',
                  'psi_zeroing_change_weighted_abs', 'psi_same_sign_amplitude_change_weighted_abs',
                  'psi_centered_slope_weighted_abs', 'psi_zeroing_intervention_fraction',
                  'psi_same_sign_amplitude_intervention_fraction', 'psi_total_intervention_fraction',
                  'psi_zeroing_support_weight_fraction', 'psi_same_sign_amplitude_support_weight_fraction',
                  'psi_growth_amplitude', 'psi_stage108_intervention_fraction',
                  'common_zeroing_intervention_fraction', 'common_same_sign_amplitude_intervention_fraction',
                  'joint_growth_amplitude', 'stage108_joint_intervention_fraction',
              }
              assert set(data.files) == expected
              for name in data.files:
                  assert data[name].shape == (56, 56)
                  assert np.isfinite(data[name]).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage109-limiter-intervention-mode-decomposition-audit
          path: /tmp/stage109_limiter_intervention_mode_decomposition_audit
          retention-days: 30

name: Vision-guided DSMC Stage 86

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage86_boundary_reconstruction_stencil_activation_audit.py'
      - 'vision_guided_dsmc/tests/test_stage86_boundary_reconstruction_stencil_activation_audit.py'
      - 'vision_guided_dsmc/results/stage85_near_wall_face_amplitude_suppression_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage86.yml'
  pull_request:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage86_boundary_reconstruction_stencil_activation_audit.py'
      - 'vision_guided_dsmc/tests/test_stage86_boundary_reconstruction_stencil_activation_audit.py'
      - 'vision_guided_dsmc/results/stage85_near_wall_face_amplitude_suppression_audit_completed.json'
      - '.github/workflows/vision-guided-dsmc-stage86.yml'

permissions:
  actions: read
  contents: read

jobs:
  boundary-reconstruction-stencil-activation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 86 and retained frozen-audit endpoints
        run: |
          pytest -q \
            tests/test_stage86_boundary_reconstruction_stencil_activation_audit.py \
            tests/test_stage85_near_wall_face_amplitude_suppression_audit.py \
            tests/test_stage84_wall_normal_sign_lobe_geometry_audit.py \
            tests/test_stage83_opposite_sector_spatial_cancellation_localization_audit.py \
            tests/test_stage82_within_sector_angular_coherence_audit.py \
            tests/test_stage81_dominant_node_individual_ordinate_audit.py \
            tests/test_stage80_dominant_shell_radial_node_angular_attribution_audit.py \
            tests/test_stage79_dominant_moment_radial_angular_gradient_audit.py \
            tests/test_stage78_face_gradient_moment_attribution_audit.py \
            tests/test_stage77_common_frame_face_flux_divergence_audit.py \
            tests/test_stage76_local_velocity_frame_jump_audit.py \
            tests/test_stage75_signed_face_location_velocity_moment_audit.py \
            tests/test_stage74_radial_speed_shell_opposite_sector_cancellation_audit.py \
            tests/test_stage73_velocity_sign_angular_bin_interior_face_flux_attribution_audit.py \
            tests/test_stage72_directional_transport_component_audit.py \
            tests/test_stage71_wall_layer_interior_face_transport_attribution_audit.py \
            tests/test_stage70_independent_wall_face_flux_discretization_audit.py \
            tests/test_stage69_frozen_grid_transfer_residual_scaling_audit.py \
            tests/test_stage68_independent_transport_operator_residual_audit.py \
            tests/test_stage67_frozen_full_distribution_residual_decomposition.py \
            tests/test_stage66_frozen_collision_source_observable_audit.py \
            tests/test_stage65_local_clipping_activation_map_audit.py \
            tests/test_stage64_source_step_consistency_audit.py \
            tests/test_stage63_collision_target_equivalence_audit.py \
            tests/test_stage62_finite_kn_normalization_audit.py \
            tests/test_stage60_transport_wall_equation_audit.py
      - name: Download exact completed Stage 81 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage81-dominant-node-individual-ordinate-attribution-audit
          path: /tmp/stage81_dominant_node_individual_ordinate_audit
          run-id: 31189580849
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 85 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage85-near-wall-face-amplitude-suppression-audit
          path: /tmp/stage85_near_wall_face_amplitude_suppression_audit
          run-id: 31241452734
          github-token: ${{ github.token }}
      - name: Run Stage 86 boundary-reconstruction stencil-activation audit
        run: |
          python -m vgdsmc.stage86_boundary_reconstruction_stencil_activation_audit \
            --stage81-artifact-dir /tmp/stage81_dominant_node_individual_ordinate_audit \
            --stage85-artifact-dir /tmp/stage85_near_wall_face_amplitude_suppression_audit \
            --output-dir /tmp/stage86_boundary_reconstruction_stencil_activation_audit
      - name: Verify frozen design and scientific branch integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('/tmp/stage86_boundary_reconstruction_stencil_activation_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 86
          assert summary['finite'] is True

          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['radial_nodes'] == 40
          assert cfg['angular_nodes'] == 96
          assert cfg['point_count'] == 3840
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['dominant_moment'] == 'transverse_kinetic'
          assert cfg['dominant_radial_shell'] == 2
          assert cfg['dominant_local_radial_node'] == 1
          assert cfg['dominant_global_radial_node'] == 21
          assert cfg['vertical_oblique_bins'] == [1, 2, 5, 6]
          assert cfg['opposite_sector_pairs'] == [[1, 5], [2, 6]]
          assert cfg['solver_rerun_count'] == 0
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False

          invariants = summary['reconstruction_implementation_invariants']
          assert all(invariants.values())
          metrics = summary['boundary_stencil_metrics']
          assert len(metrics['pair_reconstruction_closure']) == 2
          assert len(metrics['rows']) == 4
          assert metrics['maximum_pair_reconstruction_relative_l2_error'] <= cfg['pair_closure_guard']

          allowed = {
              'stage86_boundary_zero_slope_stencil_primary_frozen_suppression_stage87_one_sided_boundary_slope_counterfactual_audit',
              'stage86_boundary_zero_slope_stencil_contributes_but_not_dominant_stage87_remaining_direction_localization_audit',
              'stage86_no_structural_boundary_zero_explanation_stage87_frozen_distribution_transition_audit',
          }
          assert summary['decision'] in allowed

          with np.load(root / 'boundary_reconstruction_stencil_activation_maps.npz') as maps:
              assert maps['retained_pair_face_groups'].shape == (2, 64, 63)
              assert maps['retained_pair_cell_divergence_groups'].shape == (2, 64, 64)
              assert maps['boundary_component_vectors'].shape == (2, 2, 2, 64)
              assert maps['remaining_component_vectors'].shape == (2, 2, 2, 64)
              assert maps['ordinate_to_angular_bin'].shape == (96,)
              assert maps['ordinate_angles_degrees'].shape == (96,)

          assert 'without proving that the boundary treatment is numerically wrong' in summary['negative_findings'][0]
          assert 'Non-boundary-upwind directions are retained explicitly' in summary['negative_findings'][1]
          assert 'failed Stage-28 MUSCL' in summary['negative_findings'][2]
          assert 'no cavity solver is rerun' in summary['negative_findings'][3]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage86-boundary-reconstruction-stencil-activation-audit
          path: /tmp/stage86_boundary_reconstruction_stencil_activation_audit
          retention-days: 30

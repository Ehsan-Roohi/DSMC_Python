name: Vision-guided DSMC Stage 114

on:
  push:
    paths:
      - 'vision_guided_dsmc/vgdsmc/stage114_wall_distance_conditioned_velocity_quadrature_audit.py'
      - 'vision_guided_dsmc/tests/test_stage114_wall_distance_conditioned_velocity_quadrature_audit.py'
      - 'vision_guided_dsmc/results/stage113_x_wall_distance_profile_audit_observed.json'
      - '.github/workflows/vision-guided-dsmc-stage114.yml'

permissions:
  actions: read
  contents: read

jobs:
  wall-distance-conditioned-velocity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vision_guided_dsmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test Stage 114 and retained fixed-design guards
        run: |
          pytest -q \
            tests/test_stage114_wall_distance_conditioned_velocity_quadrature_audit.py \
            tests/test_stage113_x_wall_distance_profile_audit.py \
            tests/test_stage112_x_axis_spatial_localization_audit.py \
            tests/test_stage111_axis_conditioned_asymmetry_audit.py \
            tests/test_stage110_same_sign_slope_asymmetry_audit.py \
            tests/test_stage109_limiter_intervention_mode_decomposition_audit.py \
            tests/test_stage108_limiter_severity_correction_amplitude_coupling_audit.py \
            tests/test_stage107_limiter_activation_colocation_audit.py \
            tests/test_stage106_gradient_magnitude_coupling_audit.py \
            tests/test_stage105_directional_gradient_alignment_audit.py \
            tests/test_stage104_interior_gradient_scale_audit.py \
            tests/test_stage103_shell1_spatial_localization_audit.py \
            tests/test_stage102_radial_speed_shell_audit.py \
            tests/test_stage101_interior_velocity_sector_audit.py \
            tests/test_stage100_fused_single_run_directional_audit.py \
            tests/test_stage99_replay_provenance_audit.py \
            tests/test_stage98_directional_operator_growth_audit.py \
            tests/test_stage97_muscl_correction_spatial_localization_audit.py \
            tests/test_stage96_muscl_correction_growth_audit.py \
            tests/test_stage90_single_condition_reconstruction_solver_ab_audit.py
      - name: Download exact completed Stage 67 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage67-frozen-full-distribution-residual-decomposition
          path: /tmp/stage67_frozen_full_distribution_residual_decomposition
          run-id: 30991124477
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 111 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage111-axis-conditioned-asymmetry-audit
          path: /tmp/stage111_axis_conditioned_asymmetry_audit
          run-id: 31590035358
          github-token: ${{ github.token }}
      - name: Download exact completed Stage 113 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage113-x-wall-distance-profile-audit
          path: /tmp/stage113_x_wall_distance_profile_audit
          run-id: 31637768178
          github-token: ${{ github.token }}
      - name: Verify exact Stage 67, 111, and 113 payload provenance
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '/tmp/stage67_frozen_full_distribution_residual_decomposition/summary.json': 'e04043a1913b2fa9ae57fe1561aa26c70627830d648e91204093c8f1fb57b3d1',
              '/tmp/stage67_frozen_full_distribution_residual_decomposition/converged_full_distributions.npz': 'd4002a2765137ba517abec2d0483a3e5adcf13f415c53259018556bd14d612d1',
              '/tmp/stage111_axis_conditioned_asymmetry_audit/summary.json': '93cff62b97e29e7ad5600b7b0c26b5b39bd3f71517e70c15447c95be239f5a77',
              '/tmp/stage111_axis_conditioned_asymmetry_audit/axis_conditioned_asymmetry_maps.npz': '78b8173d81eaf2523791201690d6464295b8aa65413d9ccb3eb2c2215ac85407',
              '/tmp/stage113_x_wall_distance_profile_audit/summary.json': '1a84edaa0a9e9d7cd3f38038289cccdd39283a4364a9415c863c0cf32113f2b8',
              '/tmp/stage113_x_wall_distance_profile_audit/x_wall_distance_profiles.npz': '52d5d39e01dd29e249cfdd006a276272864db4ab53f99bea28f15e33e15e222f',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY
      - name: Run Stage 114 frozen wall-distance-conditioned velocity audit
        run: |
          python -m vgdsmc.stage114_wall_distance_conditioned_velocity_quadrature_audit \
            --stage67-artifact-dir /tmp/stage67_frozen_full_distribution_residual_decomposition \
            --stage111-artifact-dir /tmp/stage111_axis_conditioned_asymmetry_audit \
            --stage113-artifact-dir /tmp/stage113_x_wall_distance_profile_audit \
            --stage113-record-path results/stage113_x_wall_distance_profile_audit_observed.json \
            --output-dir /tmp/stage114_wall_distance_conditioned_velocity_quadrature_audit
      - name: Verify Stage 114 fixed design and negative-result guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/stage114_wall_distance_conditioned_velocity_quadrature_audit')
          summary = json.load(open(root / 'summary.json'))
          assert summary['stage'] == 114
          cfg = summary['configuration']
          assert cfg['grid'] == [64, 64]
          assert cfg['kn0'] == 10.0
          assert cfg['cold_hot_ratio'] == 0.1
          assert cfg['rule'] == [40, 96]
          assert cfg['radial_scale'] == 2.0
          assert cfg['limiter'] == 'minmod'
          assert cfg['boundary_slope'] == 'zero'
          assert cfg['source_relaxation'] == 1.0
          assert cfg['tolerance'] == 2.0e-5
          assert cfg['correction_floor'] == 0.05
          assert cfg['diagnostic_steps'] == 25
          assert cfg['wall_band_cells'] == 4
          assert cfg['dominant_radial_shell'] == 1
          assert cfg['radial_shell_count'] == 4
          assert cfg['radial_nodes_per_shell'] == 10
          assert cfg['interior_extent'] == 56
          assert cfg['angular_sectors'] == 8
          assert cfg['sector_width_degrees'] == 45.0
          assert cfg['near_wall_depth'] == 4
          assert cfg['broad_wall_depth'] == 14
          assert cfg['sector_localization_share_guard'] == 0.30
          assert cfg['sector_diffuse_share_guard'] == 0.25
          assert cfg['diffuse_effective_sector_min'] == 4.0
          assert cfg['closure_tolerance'] == 1.0e-12
          assert cfg['stage67_run_id'] == 30991124477
          assert cfg['stage111_run_id'] == 31590035358
          assert cfg['stage113_run_id'] == 31637768178
          assert cfg['full_solver_endpoint_rerun'] is False
          assert cfg['failed_muscl_endpoint_rehabilitated'] is False
          assert cfg['one_sided_boundary_slope_promoted'] is False
          assert cfg['cross_knudsen_extension_permitted'] is False
          assert cfg['validation_claim_permitted'] is False
          assert cfg['solver_endpoint_claim_permitted'] is False
          for key, value in cfg.items():
              if key.endswith('_retuning'):
                  assert value is False
          assert summary['stage113_authorization']['decision'] == 'stage113_broad_x_wall_distance_profile_stage114_wall_distance_conditioned_velocity_quadrature_audit'
          assert summary['stage113_authorization']['tests_passed'] == 216
          assert summary['stage113_authorization']['tests_failed'] == 0
          assert summary['sector_point_count'] == [120] * 8
          assert summary['max_parent_x_change_closure_relative_l2'] <= 1.0e-12
          allowed = {
              'stage114_nonfinite_velocity_quadrature_conditioning_blocker_without_retuning',
              'stage114_velocity_sector_closure_blocker_without_retuning',
              'stage114_common_wall_distance_sector_localization_stage115_sector_resolved_radial_node_audit',
              'stage114_wall_distance_dependent_sector_structure_stage115_sector_transition_audit',
              'stage114_angularly_diffuse_within_broad_wall_profile_stage115_radial_node_conditioning_audit',
              'stage114_mixed_velocity_quadrature_structure_stage115_distribution_specific_audit',
          }
          assert summary['decision'] in allowed
          assert 'Stage 28 remains a failed MUSCL endpoint' in summary['negative_result_guard']
          assert 'No failed parameter or velocity quadrature is retuned' in summary['negative_result_guard']
          assert 'no cross-Knudsen MUSCL extension is permitted' in summary['negative_result_guard']
          with np.load(root / 'wall_distance_velocity_sector_maps.npz') as data:
              assert data['phi_x_sector_change'].shape == (8, 56, 56)
              assert data['psi_x_sector_change'].shape == (8, 56, 56)
              assert data['phi_growth_amplitude'].shape == (56, 56)
              assert data['psi_growth_amplitude'].shape == (56, 56)
              assert data['joint_growth_amplitude'].shape == (56, 56)
              assert data['sector_index'].shape == (960,)
              assert data['sector_center_degrees'].shape == (8,)
              assert np.isfinite(data['phi_x_sector_change']).all()
              assert np.isfinite(data['psi_x_sector_change']).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage114-wall-distance-conditioned-velocity-quadrature-audit
          path: /tmp/stage114_wall_distance_conditioned_velocity_quadrature_audit
          retention-days: 30

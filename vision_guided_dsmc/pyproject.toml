[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-guided-dsmc"
version = "0.1.0"
description = "Minimal vision-guided particle-allocation pilot for a rarefied thermal cavity"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
ml = ["torch>=2.1"]
dev = ["pytest>=7"]

[project.scripts]
vgdsmc-generate = "vgdsmc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

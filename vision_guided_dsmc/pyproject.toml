[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-guided-dsmc"
version = "0.9.0"
description = "Matched-cost physical Argon VHS/SBT pilot with deterministic-reference supervision"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
ml = ["torch>=2.1"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7"]
full = ["torch>=2.1", "matplotlib>=3.7", "pytest>=7"]

[project.scripts]
vgdsmc-generate = "vgdsmc.cli:main"
vgdsmc-benchmark = "vgdsmc.benchmark:main"
vgdsmc-physical-benchmark = "vgdsmc.physical_benchmark:main"
vgdsmc-physical-multiseed = "vgdsmc.physical_multiseed:main"
vgdsmc-physical-paired = "vgdsmc.physical_paired_ensemble:main"
vgdsmc-physical-policy-study = "vgdsmc.physical_policy_study:main"
vgdsmc-reference-case = "vgdsmc.reference_cli:main"
vgdsmc-validate-collisions = "vgdsmc.collision_validation:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vgdsmc*"]
exclude = ["results*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
